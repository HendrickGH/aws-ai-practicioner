cumplimiento reúne 400 pares de entrada y salida que muestran el formato exacto del dictamen que exige la firma y quiere que el modelo lo reproduzca de manera consistente. ¿Qué enfoque es el más adecuado?","options":["Ajuste fino (fine-tuning) con esos ejemplos curados, para que el modelo aprenda el formato.","Preentrenamiento del modelo desde cero con los 400 ejemplos.","Aumentar la temperatura para que el modelo explore distintos formatos.","Eliminar los ejemplos del prompt y confiar en que el modelo los deduzca por sí solo."],"answers":[0],"explain":"El ajuste fino es adecuado para que el modelo adopte un estilo o formato específico a partir de ejemplos curados. El preentrenamiento desde cero exige corpus mucho mayores y no se justifica para 400 pares, la temperatura alta aumenta la variabilidad en lugar de fijar el formato y, sin ejemplos ni instrucciones, no hay garantía de que el formato se reproduzca."},{"id":35,"domain":3,"task":"3.1","type":"mc","stem":"El comité de arquitectura de un banco debe elegir entre varios modelos fundacionales disponibles en Amazon Bedrock para resumir expedientes confidenciales. ¿Qué conjunto de criterios es el más apropiado para tomar la decisión?","options":["La calidad medida con evaluaciones sobre casos propios, el costo por token, la latencia y las regiones donde el modelo está disponible.","El número de parámetros del modelo, porque a mayor tamaño siempre corresponde mejor calidad.","La antigüedad del proveedor, porque garantiza que el modelo no cambiará con el tiempo.","La longitud del prompt del sistema, porque un prompt más largo asegura mejores respuestas."],"answers":[0],"explain":"La selección debe combinar la calidad observada en el caso de uso con restricciones operativas como costo, latencia y disponibilidad regional. El tamaño del modelo, la antigüedad del proveedor o la longitud del prompt son indicios aislados que no garantizan un mejor resultado para el requisito planteado."},{"id":36,"domain":3,"task":"3.1","type":"mc","stem":"Una aseguradora quiere que sus ajustadores consulten 60 000 informes de siniestros en lenguaje natural, con actualización automática de los índices a medida que llegan informes nuevos y con el mínimo trabajo de integración. ¿Qué opción es la más adecuada?","options":["Configurar una base de conocimiento en Amazon Bedrock Knowledge Bases sobre el repositorio de informes.","Escribir llamadas directas al modelo incluyendo los 60 000 informes en cada prompt.","Ajustar el modelo con cada informe nuevo que llega al repositorio.","Clasificar los informes con Amazon Comprehend y responder con Amazon Lex."],"answers":[0],"explain":"Bedrock Knowledge Bases administra la ingesta, la fragmentación, las incrustaciones y la recuperación, y mantiene el índice actualizado con los documentos del origen. Enviar todo el corpus en cada prompt es inviable, el ajuste fino no incorpora documentos nuevos de forma automática y la clasificación de texto por sí sola no responde consultas en lenguaje natural sobre el corpus."},{"id":37,"domain":3,"task":"3.1","type":"mc","stem":"El equipo de auditoría interna quiere un asistente que, ante una pregunta, consulte el sistema contable, verifique cifras y redacte el hallazgo con sus fuentes, todo dentro de un mismo flujo. ¿Qué enfoque permite esa secuencia de acciones?","options":["Construir un agente con herramientas y orquestación que ejecute los pasos necesarios para completar la tarea.","Ajustar un modelo de clasificación para que etiquete las preguntas por tipo.","Configurar la inferencia por lotes para que procese las preguntas cada noche.","Ampliar la longitud máxima de salida para incluir todas las cifras posibles."],"answers":[0],"explain":"Un agente combina el modelo con herramientas, memoria y un ciclo de planificación y ejecución que le permite consultar otros sistemas y completar la tarea. Un clasificador solo etiqueta, la inferencia por lotes programa el procesamiento y aumentar la longitud de salida no genera acciones ni consultas a otros sistemas."},{"id":38,"domain":3,"task":"3.2","type":"mc","stem":"Un analista de crédito escribe: «Eres un asistente de análisis financiero. Con base en el balance que se incluye, responde con una tabla comparativa y no incluyas opiniones personales». ¿Qué elementos del prompt están presentes en este ejemplo?","options":["Una instrucción sobre el rol y la tarea, un contexto de datos y una restricción sobre lo que no debe incluir la respuesta.","Ejemplos de entrada y salida revisados por un especialista.","Parámetros de inferencia que controlan la creatividad del modelo.","Métricas de evaluación del desempeño del modelo."],"answers":[0],"explain":"El texto fija un rol y una tarea, entrega el contexto de los datos y añade una restricción negativa; esos son elementos típicos de un prompt bien construido. Los ejemplos, los parámetros de inferencia y las métricas no son elementos del prompt escrito, sino recursos de entrenamiento, de configuración o de evaluación."},{"id":39,"domain":3,"task":"3.2","type":"mc","stem":"El área de tesorería de un banco necesita extraer datos de confirmaciones bancarias en un formato estable y ya cuenta con diez ejemplos revisados de entrada y salida del formato deseado. ¿Qué técnica conviene aplicar en el prompt?","options":["Aprendizaje con pocos ejemplos (few-shot), incluyendo esos ejemplos en el prompt.","Aprendizaje sin ejemplos (zero-shot), omitiendo cualquier ejemplo para no sesgar al modelo.","Ajuste fino (fine-tuning) con millones de ejemplos adicionales.","Preentrenamiento del modelo con las confirmaciones históricas."],"answers":[0],"explain":"Incluir unos pocos ejemplos de entrada y salida en el prompt, conocido como few-shot, es la vía más rápida y económica para fijar un formato. Omitir los ejemplos reduce el control del formato, y el ajuste fino o el preentrenamiento son alternativas que requieren muchos más datos y esfuerzo, innecesarios con diez ejemplos revisados."},{"id":40,"domain":3,"task":"3.2","type":"mc","stem":"Un analista debe resolver un cálculo de rendimiento de varios pasos y quiere que el modelo muestre el razonamiento intermedio antes del resultado final para poder revisarlo. ¿Qué técnica de ingeniería de prompts se ajusta mejor?","options":["Cadena de pensamiento (chain-of-thought), que pide al modelo razonar paso a paso antes de responder.","Aumentar la temperatura para que el modelo genere más alternativas.","Ampliar la longitud máxima de salida sin cambiar el prompt.","Usar una plantilla con variables para cada solicitud."],"answers":[0],"explain":"La cadena de pensamiento solicita al modelo explicitar los pasos intermedios, lo que facilita la revisión del cálculo. Subir la temperatura solo agrega variabilidad, ampliar la longitud de salida no induce el razonamiento intermedio y una plantilla organiza el prompt, pero no ordena al modelo razonar por pasos."},{"id":41,"domain":3,"task":"3.2","type":"mc","stem":"Un equipo de suscripción de seguros atiende veinte tipos de consultas y quiere reutilizar la misma estructura de prompt cambiando en cada llamada el nombre del producto y el número de póliza. ¿Qué práctica describe esto?","options":["Usar plantillas de prompt con variables que se sustituyen en cada solicitud.","Reentrenar el modelo cada vez que cambia el producto.","Reducir la ventana de contexto para ahorrar tokens.","Registrar cada respuesta en un archivo de auditoría."],"answers":[0],"explain":"Las plantillas con variables permiten estandarizar la estructura del prompt y completar los datos cambiantes en tiempo de ejecución. Reentrenar por cada cambio no es proporcional, reducir la ventana de contexto no organiza el prompt y el registro de respuestas es una práctica de auditoría, no de plantillas."},{"id":42,"domain":3,"task":"3.2","type":"mc","stem":"El equipo de cumplimiento ajusta continuamente los prompts del asistente interno y necesita conservar versiones, comparar revisiones y volver a una anterior cuando baja la calidad de las respuestas. ¿Qué opción de AWS cubre ese requisito?","options":["Gestionar los prompts con versiones en Amazon Bedrock Prompt Management.","Guardar cada prompt en un archivo compartido sin identificador de versión.","Incluir el prompt directamente en el código de la aplicación sin conservar copias.","Reentrenar el modelo cada vez que cambie el prompt."],"answers":[0],"explain":"Bedrock Prompt Management permite crear, versionar y comparar prompts, y mantener el historial de cambios para revertir si es necesario. Guardar los prompts sin versión, escribirlos solo dentro del código o reentrenar el modelo no ofrecen control de versiones ni trazabilidad de los cambios."},{"id":43,"domain":3,"task":"3.2","type":"mr","stem":"El equipo de seguridad de un banco revisa los riesgos asociados a la ingeniería de prompts del asistente que atiende a clientes. ¿Cuáles TRES riesgos están directamente relacionados con la ingeniería de prompts? (Selecciona tres.)","options":["El secuestro de prompts (prompt hijacking), en el que una instrucción maliciosa desvía al modelo de la tarea original.","El jailbreaking (elusión de restricciones), en el que el usuario logra que el modelo ignore sus salvaguardas.","La exposición del prompt, cuando el modelo revela sus instrucciones internas.","El sobreajuste (overfitting) del modelo a los datos de entrenamiento.","El aumento del costo por tokens cuando el prompt es muy largo."],"answers":[0,1,2],"explain":"El secuestro, el jailbreaking y la exposición del prompt son riesgos propios de la ingeniería de prompts, porque dependen de cómo el usuario manipula las instrucciones. El sobreajuste se origina en el entrenamiento y no en el prompt, y un prompt extenso afecta el costo, pero no es uno de los riesgos de seguridad de esta categoría."},{"id":44,"domain":3,"task":"3.3","type":"order","stem":"Un banco quiere especializar un modelo fundacional con expedientes internos para el área de cumplimiento. Ordena las etapas del proceso, desde la primera hasta la última.","items":["Definir el objetivo del caso de uso, curar los datos propios y revisar su calidad y representatividad.","Separar los datos en conjuntos de entrenamiento, validación y prueba.","Ejecutar el ajuste fino del modelo preentrenado con el conjunto de entrenamiento.","Evaluar el modelo ajustado con el conjunto de prueba y compararlo con el modelo base.","Desplegar la versión aprobada y monitorear su desempeño en producción."],"explain":"El proceso comienza con la curaduría y revisión de los datos, continúa con la separación de conjuntos y el ajuste fino, sigue con la evaluación frente al modelo base y termina con el despliegue y el monitoreo. Entrenar antes de separar los datos o evaluar antes de entrenar invalidaría los resultados."},{"id":45,"domain":3,"task":"3.4","type":"mc","stem":"Un equipo de investigación de una casa de bolsa necesita evaluar a escala la calidad de resúmenes de reportes generados por un modelo: la comparación palabra por palabra castiga paráfrasis válidas. ¿Qué método de evaluación es el más adecuado?","options":["Usar un modelo de lenguaje como juez (LLM-as-a-judge) para calificar la fidelidad y la coherencia de cada resumen.","Calcular únicamente BLEU, que mide la coincidencia de n-gramas con una referencia.","Medir la latencia de la inferencia de cada resumen.","Contar la cantidad de tokens que tiene cada resumen."],"answers":[0],"explain":"Un modelo como juez puede valorar significado, fidelidad y coherencia, cosas que las métricas de coincidencia superficial no capturan cuando hay paráfrasis válidas. BLEU y otras métricas basadas en n-gramas dependen de la coincidencia literal, y la latencia o el conteo de tokens son indicadores operativos que no miden la calidad del contenido."},{"id":46,"domain":3,"task":"3.4","type":"mc","stem":"Un modelo generativo redacta recomendaciones de inversión que se envían a clientes. El área de cumplimiento exige que una persona revise y apruebe cada recomendación antes del envío. ¿Qué práctica describe este requisito?","options":["La supervisión humana en el ciclo (human-in-the-loop), en la que una persona valida la salida antes de usarla.","El aprendizaje por refuerzo con retroalimentación humana (RLHF) aplicado durante el entrenamiento.","La evaluación automática con conjuntos de datos de referencia, sin intervención humana.","El ajuste fino supervisado con el historial de recomendaciones."],"answers":[0],"explain":"La supervisión humana en el ciclo coloca a una persona como punto de control antes de que la salida se use o se publique. RLHF es una técnica de entrenamiento que ocurre antes del despliegue, la evaluación automática sustituye precisamente la revisión humana y el ajuste fino modifica el modelo, no el flujo de aprobación."},{"id":47,"domain":3,"task":"3.4","type":"mc","stem":"Un equipo quiere comparar dos modelos fundacionales con conjuntos de datos propios y métricas automáticas antes de elegir uno para producción. ¿Qué capacidad de AWS ofrece ese flujo de evaluación administrada?","options":["Las evaluaciones de modelos de Amazon Bedrock (Amazon Bedrock Model Evaluations).","Las tarjetas de modelo de Amazon SageMaker AI (SageMaker Model Cards).","AWS Config.","Amazon CloudWatch."],"answers":[0],"explain":"Amazon Bedrock Model Evaluations permite ejecutar evaluaciones automáticas y con revisión humana sobre conjuntos de datos propios para comparar modelos. Las tarjetas de modelo documentan un modelo, AWS Config evalúa el cumplimiento de configuraciones de recursos y CloudWatch monitorea métricas operativas; ninguno compara modelos con métricas de calidad."},{"id":48,"domain":4,"task":"4.1","type":"mc","stem":"Una aseguradora descubre que su conjunto de entrenamiento excluyó por completo los expedientes de clientes con ciertas condiciones de salud crónicas, a quienes sí atiende en el negocio. Antes de reentrenar el modelo, ¿qué característica del conjunto de datos debe corregirse?","options":["La inclusividad y diversidad del conjunto, que debe representar a todos los segmentos que el modelo atenderá.","El formato de almacenamiento, que debe ser de tipo columnar.","El número de tokens por documento, que debe reducirse.","La latencia de inferencia del modelo base, que debe bajar."],"answers":[0],"explain":"Un conjunto de entrenamiento que omite segmentos completos de la población produce resultados poco representativos para esos grupos, por lo que debe ampliarse con datos que los incluyan. El formato de almacenamiento, el tamaño del texto y la latencia son aspectos técnicos que no corrigen la falta de representatividad."},{"id":49,"domain":4,"task":"4.1","type":"mc","stem":"Un modelo de detección de fraude muestra un desempeño pobre tanto en el conjunto de entrenamiento como en el de prueba. ¿Cuál es el diagnóstico más probable?","options":["El modelo está subajustado (underfitting) y tiene un sesgo alto que le impide capturar los patrones de los datos.","El modelo está sobreajustado (overfitting) porque memorizó el ruido del entrenamiento.","El modelo tiene una varianza alta, lo que explica el mal desempeño en ambos conjuntos.","El modelo necesita una ventana de contexto mayor para recordar más ejemplos."],"answers":[0],"explain":"Cuando el desempeño es malo en entrenamiento y en prueba, el modelo no logró aprender la señal de los datos, lo que se conoce como subajuste o sesgo alto. El sobreajuste se reconoce por un buen desempeño en entrenamiento y uno pobre en prueba, la varianza alta se asocia al sobreajuste, y la ventana de contexto es un concepto de modelos de lenguaje que no aplica a este caso."},{"id":50,"domain":4,"task":"4.1","type":"mc","stem":"Un despacho legal usa un modelo generativo para redactar escritos y detecta que una de las salidas reproduce un párrafo extenso de un documento de un tercero. ¿Qué riesgo ilustra esta situación?","options":["El riesgo de infringir derechos de propiedad intelectual al reutilizar contenido protegido generado por el modelo.","El riesgo de exceder el presupuesto de tokens del mes.","El riesgo de que la latencia del asistente aumente en horas pico.","El riesgo de quedarse sin espacio en la ventana de contexto."],"answers":[0],"explain":"Las salidas de un modelo generativo pueden reproducir material protegido, lo que expone a la organización a reclamaciones por propiedad intelectual y exige revisión antes de publicar el contenido. El consumo de tokens, la latencia y la ventana de contexto son aspectos operativos que no describen este riesgo legal."},{"id":51,"domain":4,"task":"4.1","type":"mc","stem":"Un banco quiere reducir el impacto ambiental de su asistente generativo sin sacrificar la calidad que exige el negocio. ¿Qué consideración es la más razonable al seleccionar el modelo?","options":["Elegir el modelo más pequeño que cumpla con los niveles de calidad evaluados, porque requiere menos cómputo por solicitud.","Elegir siempre el modelo con más parámetros, porque es el más eficiente en el uso de energía.","Desactivar el monitoreo del asistente para ahorrar almacenamiento.","Duplicar la longitud del prompt para mejorar la eficiencia energética."],"answers":[0],"explain":"Un modelo más pequeño que satisfaga los requisitos de calidad consume menos recursos de cómputo por solicitud, lo que reduce el impacto ambiental asociado. Más parámetros implica mayor consumo, desactivar el monitoreo afecta la operación sin relación con la sostenibilidad y alargar el prompt aumenta el trabajo del modelo."},{"id":52,"domain":4,"task":"4.1","type":"mr","stem":"El comité de ética de un banco revisa el asistente generativo antes de su lanzamiento. ¿Cuáles DOS prácticas ayudan a detectar y mitigar sesgos en los datos y en el modelo? (Selecciona dos.)","options":["Auditar con revisión humana una muestra de etiquetas y de resultados, comparando el desempeño por subgrupos.","Curar y balancear el conjunto de datos para que represente a los segmentos atendidos.","Elevar la temperatura para diversificar las respuestas del modelo.","Reducir la longitud máxima de salida para disminuir el costo por consulta.","Aumentar el número de parámetros del modelo para mejorar su precisión general."],"answers":[0,1],"explain":"La detección de sesgos requiere análisis por subgrupos y auditorías humanas, y la mitigación empieza por datos representativos y balanceados. La temperatura, la longitud de salida y el tamaño del modelo son ajustes de generación o de arquitectura que no corrigen un sesgo originado en los datos o en la selección de variables."},{"id":53,"domain":4,"task":"4.2","type":"mc","stem":"Un banco debe justificar ante el regulador las decisiones de un modelo de aprobación de crédito. El equipo compara un modelo simple y transparente con un modelo de mayor precisión pero difícil de explicar. ¿Cómo se describe mejor esta situación?","options":["Es un compromiso entre transparencia y capacidad predictiva que debe resolverse según el contexto regulatorio y el riesgo del caso.","Es un problema de sesgo que se corrige añadiendo más datos históricos al modelo profundo.","Es un problema de latencia que se resuelve con throughput aprovisionado.","Es un requisito que se cumple mostrando solo el puntaje de confianza de cada decisión."],"answers":[0],"explain":"La elección entre explicabilidad y precisión es un compromiso de diseño que depende de la exigencia regulatoria y del impacto de la decisión. Más datos o más capacidad no vuelven explicable al modelo, el throughput atiende el rendimiento y un puntaje de confianza aislado no explica por qué se tomó la decisión."},{"id":54,"domain":4,"task":"4.2","type":"mc","stem":"Una fintech evalúa incorporar un modelo de código abierto y necesita confirmar si puede usarlo comercialmente y cómo debe dar atribución. ¿Qué revisión corresponde antes de integrarlo?","options":["Revisar la licencia del modelo y los términos aplicables a los datos con los que fue entrenado.","Revisar únicamente el tamaño del modelo en gigabytes.","Revisar solo la popularidad del modelo en repositorios públicos.","Revisar la latencia promedio del modelo en un servidor de pruebas."],"answers":[0],"explain":"La licencia y los términos de uso del modelo y de sus datos determinan si el uso comercial está permitido y qué atribuciones se exigen; también hay que considerar el origen de los datos de entrenamiento. El tamaño, la popularidad y la latencia son criterios técnicos que no responden la pregunta legal."},{"id":55,"domain":4,"task":"4.2","type":"mc","stem":"Un banco entrega a sus analistas un asistente que recomienda aprobar o rechazar solicitudes de crédito. El equipo de diseño quiere que los analistas comprendan y puedan cuestionar cada recomendación. ¿Qué práctica apoya mejor ese objetivo?","options":["Mostrar los factores y las fuentes que sustentan cada recomendación y ofrecer un mecanismo para registrar el desacuerdo del analista.","Ocultar el razonamiento del modelo para no influir en el criterio del analista.","Mostrar solo un puntaje de confianza sin explicación ni opción de retroalimentación.","Sustituir la revisión humana por la aprobación automática cuando el puntaje sea alto."],"answers":[0],"explain":"Un diseño centrado en las personas explica los factores de la recomendación y recoge la retroalimentación de quien decide, lo que permite detectar errores y mantener la responsabilidad humana. Ocultar el razonamiento o mostrar solo un puntaje deja al analista sin elementos para cuestionar, y automatizar la aprobación elimina la revisión que el escenario pide conservar."},{"id":56,"domain":4,"task":"4.2","type":"match","stem":"Un grupo financiero prepara una guía interna sobre transparencia de modelos de IA. Relaciona cada concepto con su descripción.","pairs":[["Tarjetas de modelo de Amazon SageMaker AI (SageMaker Model Cards)","Documentan el uso previsto del modelo, las características de los datos y los resultados de evaluación."],["Modelo transparente","Sus reglas y factores pueden inspeccionarse y explicarse a las partes interesadas."],["Modelo opaco","Su comportamiento interno es difícil de interpretar aunque su precisión sea alta."],["Modelo de código abierto","Su código, pesos o datos se publican bajo una licencia que define cómo pueden usarse."],["Compromiso entre seguridad y transparencia","Publicar menos detalles internos puede proteger la información, pero dificulta explicar las decisiones."]],"explain":"Las tarjetas documentan el modelo, la transparencia describe la posibilidad de inspeccionar su comportamiento, la opacidad es la dificultad de interpretarlo y las licencias de código abierto definen los usos permitidos. Reconocer el compromiso entre seguridad y transparencia evita prometer explicaciones completas cuando parte del diseño debe mantenerse reservada."},{"id":57,"domain":5,"task":"5.1","type":"mc","stem":"Un microservicio implementado en AWS Lambda necesita invocar un modelo en Amazon Bedrock. ¿Cuál es la práctica recomendada para otorgar ese acceso?","options":["Asignar al rol de ejecución de la función una política de IAM que permita únicamente las acciones necesarias sobre el modelo requerido.","Incluir en las variables de entorno de la función la clave de acceso y la clave secreta de un usuario administrador.","Compartir una sola clave de acceso de larga duración entre todas las funciones y servicios.","Otorgar permisos de administrador amplios a la función para evitar errores de configuración."],"answers":[0],"explain":"El principio de privilegio mínimo se aplica con un rol de IAM y una política que conceda solo las acciones y los recursos necesarios. Las claves de larga duración incorporadas en el código o compartidas son un riesgo de filtración, y los permisos de administrador amplían innecesariamente el alcance de un posible incidente."},{"id":58,"domain":5,"task":"5.1","type":"mc","stem":"Una aseguradora debe garantizar que el tráfico entre su VPC y Amazon Bedrock no atraviese internet. ¿Qué opción es la más adecuada?","options":["Configurar AWS PrivateLink para establecer conectividad privada entre la VPC y el servicio.","Publicar el endpoint del modelo en internet y protegerlo con autenticación básica.","Guardar los prompts en Amazon S3 y reenviarlos después por correo electrónico.","Cifrar los datos en reposo y enviarlos por internet en texto claro."],"answers":[0],"explain":"AWS PrivateLink permite acceder al servicio mediante una conexión privada dentro de la red de AWS, sin exponer el tráfico a internet. Exponer el endpoint con autenticación básica mantiene el tráfico en la red pública, el reenvío por correo no protege la información y cifrar solo en reposo deja el transporte desprotegido."},{"id":59,"domain":5,"task":"5.1","type":"mc","stem":"Un asistente bancario genera respuestas en texto libre que se muestran directamente al cliente. El equipo quiere evitar que se divulguen datos confidenciales de otros clientes. ¿Qué control es el más directo?","options":["Aplicar filtros y validaciones sobre la salida que detecten y bloqueen contenido no permitido antes de mostrarlo.","Aumentar la temperatura para diversificar las respuestas y diluir los datos sensibles.","Reducir la longitud máxima de la respuesta para que quepan menos datos.","Reentrenar el modelo cada noche con los datos de producción."],"answers":[0],"explain":"El filtrado y la validación de salidas actúan justo antes de la entrega y son el control más directo para impedir que se muestre contenido sensible. La temperatura y la longitud de la respuesta no impiden filtraciones, y reentrenar a diario con datos de producción no bloquea una respuesta indebida."},{"id":60,"domain":5,"task":"5.1","type":"mc","stem":"Un banco quiere reducir el riesgo de que su asistente invente cifras al resumir informes de riesgo. ¿Qué enfoque es el más adecuado?","options":["Fundamentar las respuestas con generación aumentada por recuperación (RAG) y exigir que se citen las fuentes recuperadas.","Elevar la temperatura para que el modelo explore más alternativas.","Aumentar la longitud máxima de salida para incluir más detalle.","Cambiar a un modelo multimodal con mayor ventana de contexto."],"answers":[0],"explain":"Fundamentar las respuestas en documentos recuperados y exigir citas permite verificar cada dato y reduce las invenciones. La temperatura alta aumenta la variabilidad, ampliar la longitud de salida no aporta evidencia y un modelo multimodal o con más contexto sigue siendo capaz de inventar si no se le obliga a basarse en las fuentes."},{"id":61,"domain":5,"task":"5.1","type":"mr","stem":"El equipo de seguridad de un banco diseña controles para el asistente generativo que procesa información financiera confidencial. ¿Cuáles DOS controles protegen mejor la confidencialidad de los datos? (Selecciona dos.)","options":["Cifrar los datos en reposo y en tránsito con claves administradas en AWS KMS.","Usar Amazon Macie para descubrir y clasificar datos personales almacenados en Amazon S3.","Elevar la temperatura del modelo para anonimizar las respuestas.","Duplicar los datos en varias cuentas para reducir el riesgo de exposición.","Desactivar los registros de auditoría para evitar que los datos se copien."],"answers":[0,1],"explain":"El cifrado protege la información en reposo y en tránsito, y el descubrimiento de datos personales permite saber dónde están y aplicar controles adecuados. La temperatura no anonimiza, duplicar datos amplía la superficie de exposición y desactivar los registros elimina la trazabilidad sin proteger la información."},{"id":62,"domain":5,"task":"5.2","type":"mc","stem":"El área de auditoría de un banco necesita obtener informes de cumplimiento y acuerdos de AWS para sustentar una revisión regulatoria. ¿Qué servicio le proporciona esa documentación?","options":["AWS Artifact.","AWS CloudTrail.","AWS Config.","Amazon CloudWatch."],"answers":[0],"explain":"AWS Artifact concentra informes de cumplimiento y acuerdos de AWS que las organizaciones usan como evidencia ante auditores. CloudTrail registra llamadas a la API, Config evalúa configuraciones de recursos y CloudWatch monitorea métricas y registros operativos; ninguno entrega informes de cumplimiento de AWS."},{"id":63,"domain":5,"task":"5.2","type":"mc","stem":"Un banco quiere verificar de forma continua que las cuentas que alojan sus cargas de IA cumplen las reglas internas de configuración y recibir alertas cuando algo se desvía. ¿Qué servicio es el más adecuado?","options":["AWS Config.","Amazon Inspector.","AWS Artifact.","AWS Trusted Advisor."],"answers":[0],"explain":"AWS Config evalúa y registra la configuración de los recursos frente a reglas definidas y notifica los desvíos. Amazon Inspector busca vulnerabilidades en las cargas de trabajo, Artifact entrega informes de cumplimiento y Trusted Advisor ofrece recomendaciones de mejores prácticas; ninguno sustituye la evaluación continua de reglas de configuración."},{"id":64,"domain":5,"task":"5.2","type":"mc","stem":"Un banco debe asegurar que los datos de clientes procesados por el asistente permanezcan en el país y que se eliminen al término del periodo de retención definido. ¿Qué práctica de gobernanza cubre ambos requisitos?","options":["Definir políticas de residencia y retención de datos y aplicarlas a todo el ciclo de vida de la información que usa el sistema de IA.","Ampliar la ventana de contexto del modelo para conservar más datos históricos por más tiempo.","Permitir que cada equipo decida dónde procesar los datos y cuánto tiempo conservarlos.","Copiar los datos a regiones adicionales para mejorar la disponibilidad del asistente."],"answers":[0],"explain":"Las políticas de residencia y retención establecen dónde puede procesarse la información y cuándo debe eliminarse, y deben aplicarse de forma consistente en todo el ciclo de vida. Delegar la decisión a cada equipo, copiar datos a otras regiones o ampliar la ventana de contexto agravan el problema en lugar de resolverlo."},{"id":65,"domain":5,"task":"5.2","type":"mc","stem":"Un grupo financiero quiere clasificar sus iniciativas de IA generativa según su nivel de exposición de datos y de riesgo, para aplicar controles proporcionales a cada caso. ¿Qué referencia de AWS es la más apropiada?","options":["La matriz de alcance de seguridad para IA generativa (Generative AI Security Scoping Matrix) de AWS.","Las tarjetas de modelo (SageMaker Model Cards) del proveedor del modelo.","Los informes de cumplimiento disponibles en AWS Artifact.","Las recomendaciones de costos de AWS Cost Explorer."],"answers":[0],"explain":"La matriz de alcance de seguridad para IA generativa clasifica los casos de uso según la exposición de datos y el riesgo, y sugiere controles acordes a cada alcance. Las tarjetas de modelo documentan un modelo, Artifact entrega informes de cumplimiento y Cost Explorer analiza el gasto; ninguno clasifica iniciativas por nivel de riesgo."}]},{"id":"D","name":"Examen 4 — Salud, industria y sector público","desc":"Hospitales, laboratorios, manufactura, energía, gobierno y universidades.","level":"facil","questions":[{"id":1,"domain":1,"task":"1.1","type":"mc","stem":"Un hospital implementa un sistema que analiza radiografías de tórax y resalta las zonas con posibles anomalías para que un radiólogo las revise. ¿Qué área de la inteligencia artificial describe esta capacidad?","options":["Procesamiento de lenguaje natural (NLP)","Visión por computadora (computer vision)","Análisis de series de tiempo","Aprendizaje por refuerzo (reinforcement learning)"],"answers":[1],"explain":"La visión por computadora se ocupa de interpretar imágenes y video, como las radiografías, para detectar y localizar patrones dentro de ellas. El procesamiento de lenguaje natural trabaja con texto y el aprendizaje por refuerzo aprende a base de prueba y error con recompensas, por lo que no describen esta capacidad."},{"id":2,"domain":1,"task":"1.1","type":"mc","stem":"Una planta de manufactura entrena un modelo con miles de piezas que los inspectores ya clasificaron como conformes o defectuosas, para que aprenda a etiquetar piezas nuevas. ¿Qué tipo de aprendizaje describe este enfoque?","options":["Aprendizaje no supervisado (unsupervised learning)","Aprendizaje por refuerzo (reinforcement learning)","Aprendizaje supervisado (supervised learning)","Aprendizaje en contexto (in-context learning)"],"answers":[2],"explain":"El aprendizaje supervisado usa ejemplos ya etiquetados, aquí el resultado del inspector, para aprender a predecir la etiqueta de casos nuevos. El aprendizaje no supervisado buscaría patrones sin etiquetas previas y el aprendizaje por refuerzo aprendería de recompensas por acciones, no de ejemplos clasificados."},{"id":3,"domain":1,"task":"1.1","type":"mc","stem":"Una empresa de servicios públicos ejecuta cada noche un proceso que puntúa 2 millones de lecturas históricas de medidores y guarda los resultados para el día siguiente. Ningún usuario espera la respuesta. ¿Qué tipo de inferencia corresponde a este escenario?","options":["Inferencia en tiempo real (real-time inference)","Inferencia asíncrona (asynchronous inference)","Inferencia sin servidor (serverless inference)","Inferencia por lotes (batch inference)"],"answers":[3],"explain":"La inferencia por lotes procesa grandes volúmenes de datos de una sola vez, sin requisitos de baja latencia, como este proceso nocturno. La inferencia en tiempo real debe responder de inmediato a cada solicitud y la asíncrona atiende peticiones individuales de larga duración, por lo que ninguna de las dos se ajusta mejor que el procesamiento por lotes."},{"id":4,"domain":1,"task":"1.1","type":"mc","stem":"Un laboratorio de análisis clínicos tiene un conjunto de datos en el que cada muestra histórica está acompañada del resultado positivo o negativo de cierta prueba. ¿Cómo se describe ese conjunto de datos?","options":["Datos etiquetados (labeled data)","Datos no etiquetados (unlabeled data)","Datos no estructurados (unstructured data)","Datos sintéticos generados por un modelo fundacional"],"answers":[0],"explain":"Un conjunto es etiquetado cuando cada ejemplo incluye la respuesta de referencia que el modelo debe aprender a predecir. No etiquetado sería un conjunto sin ese resultado, la falta de estructura se refiere al formato del contenido y no a la presencia de etiquetas, y los datos sintéticos se generarían artificialmente en lugar de provenir de muestras reales."},{"id":5,"domain":1,"task":"1.2","type":"mc","stem":"Un organismo público debe calcular el aguinaldo de cada empleado aplicando tabuladores y reglas sindicales fijos que no cambian con el tiempo. ¿Cuál es la recomendación más adecuada?","options":["Entrenar un modelo supervisado con los aguinaldos de años anteriores","Resolverlo con lógica de negocio determinista, porque no se requiere aprender a partir de datos","Usar un modelo fundacional con temperatura alta y ejemplos en el prompt","Aplicar agrupamiento (clustering) sobre los tabuladores salariales"],"answers":[1],"explain":"El aprendizaje automático aporta valor cuando existen patrones complejos que descubrir en los datos; aquí las reglas son explícitas y deterministas, así que una implementación con lógica de negocio es más simple de auditar y de explicar. Entrenar un modelo agregaría costo, opacidad y riesgo de error sin ninguna ventaja sobre reglas conocidas."},{"id":6,"domain":1,"task":"1.2","type":"mc","stem":"Un gobierno local quiere estimar el volumen de agua que consumirá cada hogar el próximo mes para planear su distribución, y la respuesta debe ser una cantidad numérica. ¿Qué tipo de problema de aprendizaje automático es?","options":["Clasificación (classification)","Agrupamiento (clustering)","Regresión (regression)","Detección de anomalías"],"answers":[2],"explain":"La regresión predice valores numéricos continuos, como el volumen de agua esperado por hogar. La clasificación asignaría categorías discretas, el agrupamiento formaría grupos sin etiquetas previas y la detección de anomalías buscaría casos atípicos, no el valor previsto de cada hogar."},{"id":7,"domain":1,"task":"1.2","type":"mc","stem":"Una red de clínicas graba las llamadas de su centro de atención telefónica y necesita un archivo de texto buscable de cada conversación, en español y en inglés. ¿Qué servicio gestionado de AWS es el más adecuado?","options":["Amazon Transcribe","Amazon Polly","Amazon Translate","Amazon Textract"],"answers":[0],"explain":"Amazon Transcribe convierte voz en texto, que es exactamente la transcripción buscable que se necesita. Amazon Polly hace lo contrario, texto a voz, Amazon Translate traduce texto ya escrito y Amazon Textract extrae texto de documentos escaneados, ninguno transcribe audio de conversaciones."},{"id":8,"domain":1,"task":"1.2","type":"mc","stem":"Un equipo de una planta industrial compara dos opciones para clasificar reportes de mantenimiento: un modelo entrenado con sus datos históricos etiquetados y un modelo fundacional al que se le dan instrucciones y algunos ejemplos en el prompt. ¿Qué afirmación es correcta?","options":["El modelo tradicional requiere datos etiquetados y entrenamiento para la tarea específica, mientras que el modelo fundacional puede adaptarse con instrucciones y ejemplos en el prompt","El modelo fundacional siempre es más barato y más preciso que cualquier modelo tradicional","El modelo tradicional no necesita datos históricos para aprender la tarea","Un modelo fundacional no puede especializarse en una tarea concreta, solo sostener conversaciones generales"],"answers":[0],"explain":"Los modelos tradicionales se entrenan para una tarea definida con ejemplos etiquetados, mientras que un modelo fundacional ya viene preentrenado y puede resolver tareas nuevas con instrucciones y ejemplos en el prompt, lo que se conoce como aprendizaje en contexto. La afirmación de que el modelo fundacional siempre es más barato y preciso es falsa porque el costo y el desempeño dependen del caso de uso."},{"id":9,"domain":1,"task":"1.2","type":"mr","stem":"Un hospital construye un asistente telefónico. El equipo ya cuenta con la transcripción de voz a texto y con acceso a los historiales, pero necesita (1) interpretar la intención del paciente y gestionar el diálogo y (2) responder con voz sintetizada natural. ¿Qué dos servicios gestionados de AWS debe usar? (Selecciona dos.)","options":["Amazon Rekognition","Amazon Textract","Amazon Lex","Amazon Translate","Amazon Polly"],"answers":[2,4],"explain":"Amazon Lex interpreta la intención del usuario y administra el flujo de la conversación, y Amazon Polly convierte el texto de la respuesta en voz natural. Amazon Rekognition analiza imágenes y Amazon Textract extrae información de documentos escaneados, por lo que ninguno aporta las capacidades de diálogo ni de síntesis de voz solicitadas."},{"id":10,"domain":1,"task":"1.3","type":"order","stem":"Un equipo de una universidad ordena las etapas de su primer proyecto de aprendizaje automático para predecir la deserción estudiantil. Coloca las etapas en la secuencia correcta.","items":["Definir el objetivo de negocio y los criterios de éxito","Recopilar, limpiar y preparar los datos","Entrenar el modelo y ajustar sus parámetros","Evaluar el modelo contra los criterios definidos","Desplegar el modelo y monitorear su desempeño en producción"],"explain":"Un proyecto de aprendizaje automático comienza por el objetivo de negocio y sus criterios de éxito, continúa con la preparación de los datos y el entrenamiento, y solo despliega cuando la evaluación confirma que se cumplen los criterios. El monitoreo en producción, que incluye reintrenar cuando el desempeño se degrada, cierra el ciclo; entrenar antes de preparar los datos o desplegar antes de evaluar produce resultados poco confiables."},{"id":11,"domain":1,"task":"1.3","type":"mc","stem":"Un modelo de una agencia de salud pública identifica pacientes con alto riesgo de reingreso hospitalario. El equipo acepta generar más falsos positivos con tal de no dejar sin identificar a ningún paciente de riesgo. ¿Qué métrica de modelo corresponde a esa prioridad?","options":["Precisión (precision)","Recuperación o exhaustividad (recall)","Exactitud (accuracy)","Retorno de inversión (ROI)"],"answers":[1],"explain":"La recuperación mide la proporción de casos positivos reales que el modelo logró identificar, y aumenta cuando se toleran más falsos positivos. La precisión priorizaría que las alertas emitidas sean correctas, la exactitud mezcla aciertos de ambas clases y el ROI es una métrica de negocio, no de desempeño del modelo."},{"id":12,"domain":1,"task":"1.3","type":"mc","stem":"El comité directivo de una empresa de energía pregunta si vale la pena mantener su asistente generativo para técnicos de campo. ¿Cuál de las siguientes es una métrica de negocio y no una métrica de desempeño del modelo?","options":["Puntuación F1 del modelo","Exactitud del modelo en el conjunto de prueba","Recuperación del modelo en preguntas frecuentes","Costo por interacción y horas de trabajo ahorradas por los técnicos"],"answers":[3],"explain":"Las métricas de negocio expresan valor o costo para la organización, como el costo por interacción o el ahorro de horas de trabajo. F1, exactitud y recuperación describen la calidad técnica del modelo y, por sí solas, no indican si el proyecto genera valor para la empresa."},{"id":13,"domain":1,"task":"1.3","type":"mc","stem":"Un equipo de una planta de manufactura necesita versionar modelos y datos, automatizar reintrenamientos periódicos y detectar cuándo el desempeño se degrada en producción. ¿Qué práctica agrupa estas capacidades?","options":["MLOps","Ingeniería de prompts (prompt engineering)","Ingeniería de contexto (context engineering)","Ajuste fino (fine-tuning)"],"answers":[0],"explain":"MLOps reúne las prácticas y automatizaciones para construir, desplegar, monitorear y mantener modelos en producción, incluidos el versionado y los reintrenamientos. La ingeniería de prompts y de contexto mejoran las interacciones con un modelo fundacional, pero no administran el ciclo de vida ni detectan la degradación en producción."},{"id":14,"domain":2,"task":"2.1","type":"match","stem":"Un equipo de una universidad prepara una capacitación interna sobre IA generativa. Relaciona cada concepto con su descripción.","pairs":[["Token","Unidad mínima de texto que el modelo procesa y que suele determinar el consumo facturado"],["Incrustación (embedding)","Representación numérica en un espacio vectorial que captura el significado de un texto"],["Fragmentación (chunking)","División de documentos extensos en segmentos que caben en la ventana de contexto"],["Modelo multimodal","Modelo que procesa y genera más de un tipo de contenido, como texto e imágenes"],["Modelo de difusión (diffusion model)","Modelo generativo que crea imágenes a partir de ruido y lo refina en pasos sucesivos"]],"explain":"Cada concepto cubre una pieza distinta del trabajo con modelos fundacionales: el token es la unidad de procesamiento y de cobro, la incrustación convierte texto en vectores para búsquedas semánticas y la fragmentación prepara documentos largos para la recuperación. Los modelos multimodales combinan modalidades y los de difusión generan imágenes refinando ruido; confundir incrustación con fragmentación es frecuente, pero la primera es una representación numérica y la segunda una división del contenido."},{"id":15,"domain":2,"task":"2.1","type":"mc","stem":"Una universidad usa un modelo fundacional a través de una API y observa que el costo mensual crece según la extensión de los prompts y de las respuestas generadas. ¿Qué unidad de consumo explica ese cobro?","options":["Las solicitudes por segundo","Las horas de instancia consumidas","Los tokens procesados","Los gigabytes almacenados"],"answers":[2],"explain":"Los modelos fundacionales expuestos por API suelen cobrarse por token de entrada y de salida, de modo que prompts y respuestas más largos cuestan más. Las horas de instancia aplican a modelos autoalojados, y las solicitudes por segundo o el almacenamiento corresponden a dimensiones de otros servicios, no al consumo del modelo."},{"id":16,"domain":2,"task":"2.1","type":"mc","stem":"Un ayuntamiento pide a su asistente que resuma un acta de 300 páginas en una sola petición y el modelo no puede procesarla completa. ¿Qué concepto explica esta limitación?","options":["La temperatura configurada","El número de incrustaciones almacenadas","El rendimiento aprovisionado (provisioned throughput)","La ventana de contexto del modelo"],"answers":[3],"explain":"La ventana de contexto es la cantidad máxima de tokens que el modelo puede considerar en una sola petición, por lo que un documento muy extenso no cabe completo. La temperatura solo afecta la variabilidad de la respuesta y el rendimiento aprovisionado se relaciona con la capacidad de procesamiento simultáneo, no con el tamaño de la entrada."},{"id":17,"domain":2,"task":"2.1","type":"mc","stem":"Un laboratorio quiere que su agente consulte en tiempo real el sistema de inventario de reactivos y ejecute acciones mediante una interfaz estandarizada que cualquier modelo compatible pueda entender. ¿Qué concepto describe esta necesidad?","options":["Ajuste fino del modelo con ejemplos etiquetados del inventario","Uso de herramientas (tool use) mediante una interfaz estandarizada como Model Context Protocol (MCP)","Destilación del modelo en uno más pequeño","Aumento de la temperatura para habilitar acciones externas"],"answers":[1],"explain":"El uso de herramientas permite que el agente invoque sistemas externos, y MCP es un protocolo estandarizado para exponer herramientas y fuentes de contexto a los modelos. El ajuste fino cambia el comportamiento del modelo, pero no le da acceso a sistemas en vivo, y la temperatura solo influye en la variabilidad del texto generado."},{"id":18,"domain":2,"task":"2.1","type":"mc","stem":"Una universidad diseña un flujo donde un agente redacta resúmenes de investigación, otro verifica que las citas existan y un componente central coordina el trabajo y conserva el historial de la conversación. ¿Qué concepto describe esta arquitectura?","options":["Orquestación de múltiples agentes con memoria compartida","Inferencia por lotes","Cadena de pensamiento (chain-of-thought)","Incrustaciones y búsqueda vectorial"],"answers":[0],"explain":"La arquitectura descrita reparte responsabilidades entre agentes especializados y necesita un orquestador y memoria para coordinar turnos e intercambiar resultados. La inferencia por lotes se refiere a cómo se procesan las solicitudes, la cadena de pensamiento es una técnica de prompt en un solo modelo y las incrustaciones sirven para búsqueda semántica, no para coordinar agentes."},{"id":19,"domain":2,"task":"2.1","type":"mc","stem":"¿Cuál de los siguientes casos de uso aprovecha mejor la IA generativa en lugar del aprendizaje automático tradicional?","options":["Predecir el monto de la colegiatura que pagará cada estudiante","Agrupar alumnos según su patrón de consumo en la cafetería","Redactar un borrador de resumen de expedientes académicos extensos en lenguaje natural","Detectar transacciones fraudulentas con datos históricos etiquetados"],"answers":[2],"explain":"La IA generativa destaca en crear contenido nuevo en lenguaje natural, como un borrador de resumen a partir de documentos extensos. Predecir un monto, agrupar alumnos por comportamiento o detectar fraude son tareas clásicas de predicción y segmentación que el aprendizaje automático tradicional resuelve con datos numéricos o históricos."},{"id":20,"domain":2,"task":"2.1","type":"mc","stem":"Un organismo público digitalizó contratos con firmas y sellos escaneados, y quiere que el modelo analice tanto el texto como las imágenes de cada documento. ¿Qué característica del modelo fundacional es indispensable?","options":["Que tenga la temperatura más alta disponible","Que sea multimodal, capaz de procesar texto e imágenes","Que haya sido entrenado solo con texto en inglés","Que se ejecute únicamente en instancias autoalojadas"],"answers":[1],"explain":"Un modelo multimodal acepta más de una modalidad de entrada, en este caso texto e imágenes de sellos y firmas. La temperatura solo regula la variabilidad de la salida, un modelo entrenado solo con texto no podría interpretar las imágenes y el modo de despliegue, gestionado o autoalojado, no determina la capacidad de entender imágenes."},{"id":21,"domain":2,"task":"2.1","type":"mc","stem":"Un equipo de salud observa que su asistente responde mucho mejor cuando en el prompt se incluyen solo los fragmentos del expediente relevantes para la pregunta, bien ordenados, en lugar de todo el historial del paciente. ¿Qué práctica está aplicando?","options":["Ajuste fino supervisado","Preentrenamiento continuo","Destilación de modelos (model distillation)","Ingeniería de contexto (context engineering)"],"answers":[3],"explain":"La ingeniería de contexto consiste en seleccionar y ordenar la información que se coloca en el prompt para maximizar la calidad de la respuesta, justo lo que hace el equipo al elegir fragmentos relevantes. El ajuste fino y el preentrenamiento continuo modifican los pesos del modelo con datos de entrenamiento y la destilación transfiere conocimiento a un modelo menor, ninguna de las cuales ocurre aquí."},{"id":22,"domain":2,"task":"2.2","type":"mc","stem":"Un hospital pilota un asistente que responde dudas de pacientes sobre la preparación de estudios. En una prueba, el asistente indicó un ayuno, mencionó un medicamento que no existe y sugirió llegar dos horas antes de lo que indica el protocolo oficial. ¿Qué desventaja de la IA generativa ilustra el caso?","options":["Sobreajuste (overfitting)","Alucinaciones: contenido plausible pero incorrecto","Fuga de datos confidenciales","Latencia excesiva"],"answers":[1],"explain":"Una alucinación es una respuesta fluida y creíble que no está respaldada por hechos ni por las fuentes, como el medicamento inexistente. El sobreajuste se refiere a la brecha entre el desempeño en entrenamiento y en datos nuevos, la fuga de datos implica exponer información sensible y la latencia es un problema de tiempo de respuesta, no de veracidad."},{"id":23,"domain":2,"task":"2.2","type":"mc","stem":"Una institución de salud debe elegir un modelo fundacional para un asistente de triage. Requiere que los datos se procesen en una región específica, que la respuesta llegue en menos de dos segundos y que el costo por consulta sea sostenible. ¿Qué conjunto de factores debe priorizar en la selección del modelo?","options":["Cumplimiento y residencia de datos, latencia y costo","Únicamente el número de parámetros del modelo","La cantidad de ejemplos que se incluirán en el prompt","El proveedor con más publicaciones técnicas"],"answers":[0],"explain":"La selección de modelo debe equilibrar requisitos de cumplimiento, como la residencia de los datos, con el desempeño en latencia y el costo total, que son las restricciones explícitas del caso. Elegir solo por tamaño de parámetros ignora esas restricciones, y el número de ejemplos del prompt se define después, durante el diseño del prompt, no como criterio de selección."},{"id":24,"domain":2,"task":"2.2","type":"mc","stem":"La dirección de una empresa de servicios públicos pide justificar la inversión en un asistente generativo para atención a clientes. ¿Qué métrica es una medida de valor de negocio?","options":["La exactitud del modelo en el conjunto de validación","El número de parámetros del modelo elegido","El retorno de inversión (ROI) calculado con el ahorro de costos y los ingresos adicionales","La temperatura configurada en producción"],"answers":[2],"explain":"El ROI traduce el desempeño técnico a impacto económico, que es lo que la dirección necesita para decidir la inversión. La exactitud es una métrica de modelo, y los parámetros o la temperatura son detalles de configuración que no expresan valor para el negocio."},{"id":25,"domain":2,"task":"2.2","type":"mr","stem":"El comité de riesgos de un hospital revisa la adopción de IA generativa para documentación clínica. ¿Qué dos características de estos modelos deben gestionarse de forma explícita por su impacto en la atención al paciente? (Selecciona dos.)","options":["La imposibilidad de usar texto no estructurado como entrada","La variación de las respuestas ante la misma entrada","La ausencia total de costos variables en los servicios gestionados","La posibilidad de que el modelo genere información incorrecta aunque suene creíble","La obligación de entrenar el modelo desde cero antes de usarlo"],"answers":[1,3],"explain":"La falta de determinismo, es decir, respuestas distintas ante la misma entrada, y las alucinaciones o afirmaciones incorrectas pero creíbles son riesgos intrínsecos de los modelos generativos y exigen verificación humana y evaluación continua. Los modelos fundacionales sí procesan texto no estructurado, los servicios gestionados sí tienen costos variables por consumo y no requieren entrenar el modelo desde cero."},{"id":26,"domain":2,"task":"2.3","type":"mc","stem":"Una empresa de manufactura quiere experimentar con modelos fundacionales de varios proveedores a través de una API gestionada, sin administrar servidores ni infraestructura de inferencia. ¿Qué servicio de AWS es el más adecuado?","options":["Amazon SageMaker AI","Amazon Rekognition","Amazon EMR","Amazon Bedrock"],"answers":[3],"explain":"Amazon Bedrock ofrece acceso por API a modelos fundacionales de distintos proveedores como servicio totalmente gestionado, sin administrar infraestructura. Amazon SageMaker AI es la plataforma para construir y operar modelos propios, Amazon Rekognition es un servicio de análisis de imágenes ya entrenado y Amazon EMR procesa grandes volúmenes de datos."},{"id":27,"domain":2,"task":"2.3","type":"mc","stem":"Un grupo de analistas de una universidad quiere explorar un catálogo de modelos abiertos preentrenados y desplegarlos dentro de la cuenta de AWS de la institución, con control sobre el tipo de instancia y el escalado. ¿Qué opción se ajusta mejor?","options":["Amazon SageMaker JumpStart","Amazon Quick","Amazon Comprehend","Amazon Textract"],"answers":[0],"explain":"SageMaker JumpStart proporciona un catálogo de modelos preentrenados y plantillas que se despliegan en la propia cuenta con control de la infraestructura. Amazon Comprehend y Amazon Textract son servicios gestionados con funciones ya definidas de análisis de texto y extracción documental, y Amazon Quick es una herramienta de análisis de negocio; ninguno permite desplegar modelos abiertos propios."},{"id":28,"domain":2,"task":"2.3","type":"mc","stem":"Una empresa de energía prevé un volumen alto y constante de solicitudes a su asistente generativo y necesita capacidad reservada con costo predecible. ¿Qué opción de Amazon Bedrock corresponde?","options":["Pagar por token en la modalidad bajo demanda","Comprar instancias reservadas de Amazon EC2 para hospedar el modelo","Adquirir capacidad aprovisionada (provisioned throughput) para el modelo","Habilitar el almacenamiento en caché de Amazon CloudFront"],"answers":[2],"explain":"La capacidad aprovisionada reserva unidades de procesamiento para el modelo, lo que brinda mayor capacidad y un costo predecible ante tráfico alto y sostenido. El pago por token bajo demanda es flexible pero menos predecible, las instancias reservadas de EC2 solo aplicarían si el modelo se alojara en la cuenta y la caché de CloudFront únicamente distribuye contenido."},{"id":29,"domain":2,"task":"2.3","type":"mc","stem":"Un equipo necesita ejecutar agentes de IA en producción con sesiones aisladas, identidad administrada y límites de acción definidos, sin construir su propia infraestructura de orquestación. ¿Qué servicio de AWS se diseñó para esta necesidad?","options":["Strands Agents","Amazon Bedrock AgentCore","Amazon Quick","AWS Transform"],"answers":[1],"explain":"Amazon Bedrock AgentCore reúne capacidades gestionadas para desplegar y operar agentes, como el aislamiento de sesiones, la identidad y los controles sobre las acciones permitidas. Strands Agents es un marco de trabajo de código abierto para construir agentes, pero no aporta la infraestructura gestionada de ejecución, y Amazon Quick y AWS Transform son servicios de análisis y de transformación, no de operación de agentes."},{"id":30,"domain":3,"task":"3.1","type":"order","stem":"Un laboratorio de investigación implementa generación aumentada por recuperación (RAG) para responder preguntas sobre sus protocolos internos. Ordena las etapas del flujo de trabajo.","items":["Fragmentar los documentos de protocolos en segmentos (chunks)","Generar las incrustaciones (embeddings) de cada segmento y almacenarlas en un almacén vectorial","Recuperar los segmentos más similares a la pregunta del usuario","Enviar la pregunta junto con los segmentos recuperados al modelo para redactar la respuesta"],"explain":"RAG primero indexa el conocimiento fragmentando los documentos y generando sus incrustaciones, después recupera los segmentos más relevantes para la consulta y finalmente los entrega al modelo como contexto para redactar la respuesta. Recuperar antes de haber generado las incrustaciones, o enviar la consulta al modelo antes de recuperar el contexto, impediría fundamentar la respuesta en los documentos."},{"id":31,"domain":3,"task":"3.1","type":"mc","stem":"Un equipo de una universidad quiere que su asistente que resume normativa universitaria sea muy consistente y apegado a los documentos, con poca variación entre ejecuciones. ¿Qué ajuste de inferencia ayuda a lograrlo?","options":["Aumentar la temperatura","Aumentar la longitud máxima de salida","Habilitar la destilación del modelo","Reducir la temperatura"],"answers":[3],"explain":"Una temperatura baja hace que el modelo elija con mayor frecuencia las palabras más probables, lo que reduce la variación y favorece respuestas consistentes. Subir la temperatura aumenta la creatividad y la variabilidad, la longitud máxima de salida solo limita cuántos tokens se generan y la destilación es una técnica de entrenamiento, no un parámetro de inferencia."},{"id":32,"domain":3,"task":"3.1","type":"mc","stem":"Un servicio de salud envía en cada petición el mismo manual de procedimientos de 40 páginas como contexto y quiere reducir el tiempo de respuesta y el costo de reprocesarlo una y otra vez. ¿Qué característica de la inferencia debe evaluar?","options":["El almacenamiento en caché de prompts (prompt caching)","Aumentar la temperatura para acelerar la generación","Reducir la longitud máxima de salida al mínimo","Mover el modelo a instancias de Amazon EC2"],"answers":[0],"explain":"El almacenamiento en caché de prompts permite reutilizar el procesamiento del prefijo repetido, lo que reduce la latencia y el costo cuando un mismo contexto extenso se reutiliza en muchas peticiones. Aumentar la temperatura afecta la variabilidad y no el reprocesamiento, y recortar la longitud de salida no evita procesar el manual completo como entrada."},{"id":33,"domain":3,"task":"3.1","type":"mc","stem":"Una entidad pública necesita que su asistente cite las políticas vigentes, que se actualizan cada mes, y quiere evitar reentrenar el modelo con cada cambio. ¿Qué enfoque de personalización es el más adecuado?","options":["Ajuste fino (fine-tuning) con cada versión actualizada de las políticas","Generación aumentada por recuperación (RAG) sobre las políticas actualizadas","Preentrenamiento del modelo desde cero con el nuevo corpus","Destilación de un modelo más pequeño a partir del modelo actual"],"answers":[1],"explain":"Con RAG el conocimiento vive en los documentos que se recuperan en cada consulta, así que actualizarlos no exige tocar el modelo y las respuestas pueden citar la fuente. El ajuste fino obligaría a reentrenar con cada cambio, el preentrenamiento desde cero sería aún más costoso y la destilación reduce el tamaño del modelo, sin actualizar su conocimiento."},{"id":34,"domain":3,"task":"3.1","type":"mc","stem":"Un laboratorio modela relaciones entre compuestos, genes y enfermedades, y necesita recorrer ese grafo y recuperar relaciones relevantes para alimentar a su asistente. ¿Qué base de datos de AWS es la más adecuada como almacén de recuperación?","options":["Amazon DynamoDB","Amazon S3","Amazon Neptune","Amazon ElastiCache"],"answers":[2],"explain":"Amazon Neptune es un servicio de base de datos de grafos que representa y consulta relaciones entre entidades y admite búsqueda vectorial para la recuperación. DynamoDB trabaja con pares clave-valor y documentos, S3 es almacenamiento de objetos y ElastiCache ofrece caché en memoria, ninguno está pensado para recorrer relaciones complejas entre entidades."},{"id":35,"domain":3,"task":"3.1","type":"mc","stem":"Un hospital quiere que su asistente responda citando sus protocolos clínicos sin construir por su cuenta la ingesta, la fragmentación, las incrustaciones y la búsqueda. ¿Qué característica de Amazon Bedrock debe usar?","options":["Amazon Bedrock Knowledge Bases","Amazon Bedrock Guardrails","Amazon Comprehend","Amazon SageMaker JumpStart"],"answers":[0],"explain":"Bedrock Knowledge Bases administra el flujo de generación aumentada por recuperación completo: ingesta de documentos, fragmentación, generación de incrustaciones, almacenamiento y recuperación para las consultas. Guardrails aplica políticas sobre el contenido, Comprehend analiza texto con funciones predefinidas y JumpStart ofrece un catálogo de modelos, ninguno realiza recuperación de conocimiento."},{"id":36,"domain":3,"task":"3.1","type":"mc","stem":"Una empresa de energía necesita un modelo mucho más pequeño y económico para clasificar reportes de incidentes, pero quiere conservar el desempeño de un modelo grande ya probado. ¿Qué técnica corresponde?","options":["Preentrenamiento desde cero con los reportes históricos","Inferencia por lotes sobre los reportes","Ingeniería de contexto en el prompt","Destilación de modelos (model distillation)"],"answers":[3],"explain":"La destilación transfiere el comportamiento de un modelo grande, llamado profesor, a uno más pequeño, llamado alumno, para obtener menor costo y latencia conservando buena parte del desempeño. El preentrenamiento desde cero produciría un modelo nuevo y costoso, la inferencia por lotes solo cambia la forma de procesar solicitudes y la ingeniería de contexto mejora los prompts sin reducir el tamaño del modelo."},{"id":37,"domain":3,"task":"3.1","type":"mc","stem":"Un equipo de una universidad necesita adaptar un asistente a un nuevo formato de reportes esta semana, con el menor costo y tiempo posibles, aunque tenga menos control sobre el estilo final del modelo. ¿Qué opción es la más razonable?","options":["Entrenar un modelo desde cero con los reportes nuevos","Aportar contexto e instrucciones con ejemplos en el prompt (aprendizaje en contexto)","Realizar un ajuste fino supervisado con miles de ejemplos etiquetados","Ejecutar preentrenamiento continuo con el corpus institucional"],"answers":[1],"explain":"El aprendizaje en contexto adapta el comportamiento del modelo sin modificar sus pesos y es la opción más rápida y económica para probar un formato nuevo. Entrenar desde cero, el ajuste fino y el preentrenamiento continuo requieren conjuntos de datos, tiempo de cómputo y procesos de evaluación mucho mayores, y no se justifican para una necesidad inmediata y acotada."},{"id":38,"domain":3,"task":"3.2","type":"mr","stem":"Un equipo de una dependencia de gobierno prepara los prompts de un asistente que resume expedientes. ¿Qué dos prácticas mejoran la calidad y la confiabilidad de las respuestas? (Selecciona dos.)","options":["Indicar con claridad el rol, la tarea y el formato de salida esperado","Incluir ejemplos representativos cuando la tarea es ambigua","Confiar únicamente en el nombre del modelo para obtener exactitud","Ocultar el contexto relevante para que el modelo razone por su cuenta","Subir la temperatura al máximo para obtener respuestas más estables"],"answers":[0,1],"explain":"Precisar instrucción, rol y formato reduce la ambigüedad, y unos pocos ejemplos representativos, conocidos como aprendizaje con pocos ejemplos o few-shot, guían al modelo en tareas ambiguas. Una temperatura alta aumenta la variabilidad en lugar de la estabilidad y omitir el contexto obliga al modelo a inventar, lo que eleva el riesgo de alucinaciones."},{"id":39,"domain":3,"task":"3.2","type":"mc","stem":"Una universidad logra que su asistente clasifique correctamente los tipos de documento cuando incluye tres casos resueltos en el prompt, y falla cuando solo da la instrucción. ¿Qué técnica describe el enfoque que funcionó?","options":["Aprendizaje sin ejemplos (zero-shot prompting)","Ajuste fino supervisado","Aprendizaje con pocos ejemplos (few-shot prompting)","Cadena de pensamiento (chain-of-thought)"],"answers":[2],"explain":"El prompt con pocos ejemplos incluye casos resueltos que muestran el patrón esperado y mejora el desempeño en tareas de clasificación. El enfoque sin ejemplos fue justamente el que falló, el ajuste fino modificaría los pesos del modelo y la cadena de pensamiento pide razonamiento paso a paso, útil para problemas de lógica más que para mostrar el formato deseado."},{"id":40,"domain":3,"task":"3.2","type":"mc","stem":"Un equipo de una empresa de manufactura necesita que el asistente resuelva cálculos de tolerancias paso a paso y muestre el razonamiento antes del resultado final. ¿Qué técnica de prompting es la más adecuada?","options":["Cadena de pensamiento (chain-of-thought)","Aprendizaje sin ejemplos (zero-shot prompting)","Ajuste fino por instrucciones (instruction tuning)","Destilación de modelos (model distillation)"],"answers":[0],"explain":"La cadena de pensamiento pide al modelo razonar de forma explícita por pasos antes de concluir, lo que mejora la precisión en tareas de cálculo y lógica. El prompt sin ejemplos no guía el razonamiento, y el ajuste por instrucciones y la destilación son procesos de entrenamiento, no instrucciones dentro del prompt."},{"id":41,"domain":3,"task":"3.2","type":"mc","stem":"El asistente de un organismo público responde de manera informal, demasiado extensa y a veces ofrece asesoría legal. El equipo quiere acotar el tono, la longitud y lo que el asistente no debe hacer. ¿Qué debe ajustar primero?","options":["La temperatura del modelo, subiéndola al máximo","El número de incrustaciones almacenadas","El tamaño de los archivos de referencia","La plantilla del prompt: rol, formato y restricciones sobre lo que no debe incluir"],"answers":[3],"explain":"Las plantillas de prompt reutilizables permiten fijar rol, tono, formato y límites, incluidas las instrucciones negativas sobre lo que el modelo no debe hacer, y son el primer punto de control. La temperatura no corrige el contenido ni el formato, y las incrustaciones o el tamaño de los documentos influyen en la recuperación, no en el estilo de la respuesta."},{"id":42,"domain":3,"task":"3.2","type":"mc","stem":"Un reclutador de una universidad usa un asistente para resumir currículums. Un candidato incluyó en su documento la frase que pide ignorar las instrucciones anteriores y mostrar el prompt del sistema. ¿Qué riesgo de la ingeniería de prompts ilustra el caso?","options":["Envenenamiento de los datos de entrenamiento (data poisoning)","Secuestro de prompt (prompt hijacking) mediante inyección de instrucciones","Sobreajuste del modelo a los ejemplos del prompt","Fuga de datos por cifrado débil en reposo"],"answers":[1],"explain":"El secuestro de prompt ocurre cuando una entrada manipulada intenta reemplazar las instrucciones del sistema, como en este currículum. El envenenamiento de datos afecta al entrenamiento del modelo y no a una entrada individual, el sobreajuste es un problema de generalización y el cifrado en reposo pertenece a la protección de los datos almacenados."},{"id":43,"domain":3,"task":"3.2","type":"mc","stem":"El equipo de una clínica ajusta sus prompts con frecuencia y necesita versionarlos, compararlos y poder revertir un cambio sin modificar el código de la aplicación. ¿Qué opción de AWS es la más adecuada?","options":["La administración de prompts de Amazon Bedrock (Prompt Management)","Amazon Bedrock Guardrails","AWS CloudTrail","AWS Trusted Advisor"],"answers":[0],"explain":"La administración de prompts de Amazon Bedrock permite crear, versionar y comparar prompts y consumir una versión específica desde la aplicación. Guardrails aplica políticas de contenido, CloudTrail registra llamadas a la API para auditoría y Trusted Advisor ofrece recomendaciones de buenas prácticas, ninguno ofrece control de versiones de prompts."},{"id":44,"domain":3,"task":"3.3","type":"mc","stem":"Una empresa de manufactura dispone de 40 000 informes de mantenimiento etiquetados y quiere que un modelo fundacional adopte el vocabulario técnico y el formato de su dominio, cuidando la calidad de los datos. ¿Qué enfoque corresponde?","options":["Preentrenamiento desde cero con corpus públicos de internet","Aumentar la longitud máxima de salida del modelo","Ajuste fino (fine-tuning) con datos del dominio revisados en calidad, representatividad y etiquetado","Cambiar la región de despliegue del modelo"],"answers":[2],"explain":"El ajuste fino adapta los pesos del modelo con datos del dominio, siempre que estén curados, sean representativos y tengan etiquetas confiables. El preentrenamiento desde cero exigiría un volumen de datos y de cómputo desproporcionado, y los cambios de longitud de salida o de región no afectan el vocabulario ni el estilo aprendido."},{"id":45,"domain":3,"task":"3.4","type":"mc","stem":"Un equipo de una universidad quiere comparar automáticamente los resúmenes que genera su modelo con resúmenes de referencia escritos por especialistas, midiendo el traslape de contenido. ¿Qué métrica es la más adecuada?","options":["BLEU","ROUGE","Exactitud (accuracy)","Costo por interacción"],"answers":[1],"explain":"ROUGE compara el resumen generado con resúmenes de referencia midiendo el traslape de n-gramas, por lo que es habitual en tareas de resumen. BLEU se orienta a la calidad de la traducción automática, la exactitud no aplica a texto libre sin una única respuesta correcta y el costo por interacción es una medida de negocio."},{"id":46,"domain":3,"task":"3.4","type":"mc","stem":"Una institución de educación superior necesita comparar dos modelos fundacionales en preguntas abiertas de tutoría, usando preguntas propias y la revisión de docentes como referencia. ¿Qué enfoque es el más apropiado?","options":["Evaluar con Amazon Bedrock Model Evaluation usando un conjunto de datos de referencia propio, con un modelo como juez y revisión humana de una muestra","Comparar únicamente la cantidad de parámetros de cada modelo","Medir solo la latencia promedio de los dos modelos","Elegir el modelo del proveedor comercial más conocido"],"answers":[0],"explain":"Bedrock Model Evaluation permite evaluar modelos con conjuntos de datos propios y combinar métricas automáticas, como el uso de un modelo como juez, con revisión humana de una muestra, que es lo que se necesita para respuestas abiertas sin una única solución correcta. El tamaño del modelo, la latencia o la popularidad del proveedor no miden la calidad de las respuestas de tutoría."},{"id":47,"domain":3,"task":"3.4","type":"mc","stem":"El equipo de un hospital quiere demostrar que su asistente de documentación clínica realmente ayuda al personal médico. ¿Qué métrica de alineación con el negocio es la más pertinente?","options":["Perplejidad del modelo","ROUGE frente a un resumen de referencia","Cantidad de parámetros del modelo desplegado","Tasa de finalización de tareas y satisfacción del personal clínico, junto con el costo por interacción"],"answers":[3],"explain":"Las métricas de alineación de negocio miden si el asistente ayuda a completar el trabajo, si los usuarios están satisfechos y a qué costo por interacción. La perplejidad y ROUGE evalúan aspectos internos del modelo y no revelan si el personal usa realmente la herramienta ni si le resulta útil."},{"id":48,"domain":4,"task":"4.1","type":"mc","stem":"Un modelo de pronóstico de demanda de una empresa eléctrica alcanza 99% de exactitud con los datos de entrenamiento, pero solo 71% en producción. ¿Qué problema describe esta diferencia?","options":["Subajuste (underfitting)","Sobreajuste (overfitting)","Desbalance de clases en el conjunto de datos","Sesgo introducido por las etiquetas"],"answers":[1],"explain":"El sobreajuste ocurre cuando el modelo memoriza particularidades del conjunto de entrenamiento y no generaliza a datos nuevos, de ahí la brecha entre 99% y 71%. El subajuste produciría un desempeño pobre en ambos conjuntos, el desbalance de clases afecta la representación de categorías y el sesgo de etiquetas desvía sistemáticamente las predicciones en ambos entornos."},{"id":49,"domain":4,"task":"4.1","type":"mc","stem":"Una aseguradora de salud observa que su modelo de priorización de casos tiene buena exactitud global, pero comete más errores con pacientes de un grupo de edad específico. ¿Qué práctica de detección de sesgo debe aplicar?","options":["Análisis por subgrupos para cuantificar la diferencia de desempeño entre grupos demográficos","Aumentar la temperatura del modelo para diversificar las respuestas","Eliminar del conjunto de datos los registros del grupo afectado","Revisar únicamente la exactitud global del modelo"],"answers":[0],"explain":"El análisis por subgrupos mide el desempeño de cada grupo y revela disparidades que el promedio global oculta, y conviene complementarlo con la revisión de la calidad de las etiquetas históricas. Aumentar la temperatura no modifica el sesgo del modelo y eliminar los registros de un grupo empeora la representatividad de los datos en lugar de corregir el problema."},{"id":50,"domain":4,"task":"4.1","type":"mc","stem":"Una universidad comparará modelos para su asistente de investigación y quiere reducir el impacto ambiental de su elección sin sacrificar los requisitos funcionales. ¿Qué consideración es la más adecuada?","options":["Elegir siempre el modelo más grande disponible para no repetir el trabajo","Duplicar el despliegue en varias regiones aunque no haya usuarios allí","Preferir modelos más pequeños o destilados que cumplan los requisitos, y usar de forma eficiente la infraestructura y la región","Ampliar el conjunto de datos de entrenamiento sin límite para mejorar la precisión"],"answers":[2],"explain":"El consumo energético crece con el tamaño del modelo y con la infraestructura ociosa, así que elegir el modelo más pequeño que cumpla los requisitos y aprovechar de forma eficiente la capacidad y la región reduce el impacto ambiental. Elegir siempre el modelo mayor, duplicar despliegues innecesarios o entrenar sin límite aumentan el consumo sin garantizar un mejor resultado."},{"id":51,"domain":4,"task":"4.1","type":"mc","stem":"El área legal de una editorial universitaria advierte que el material generado con un modelo fundacional podría reproducir fragmentos de obras protegidas. ¿Qué riesgo legal y de confianza debe atender el equipo?","options":["Exceso de latencia en las respuestas del modelo","Infracción de propiedad intelectual en el contenido generado, con pérdida de confianza de los autores","Falta de determinismo en las respuestas","Costo elevado por token de salida"],"answers":[1],"explain":"El riesgo de propiedad intelectual surge cuando el contenido generado reproduce material protegido sin autorización, y puede dañar la confianza de autores y lectores. La latencia, la variabilidad de las respuestas y el costo por token son consideraciones operativas y de costo, no riesgos legales sobre el contenido publicado."},{"id":52,"domain":4,"task":"4.1","type":"mr","stem":"Una clínica entrena un modelo de apoyo al diagnóstico y quiere mejorar la inclusividad y la equidad de su conjunto de datos. ¿Qué dos acciones debe priorizar? (Selecciona dos.)","options":["Auditar la calidad de las etiquetas históricas y el desempeño del modelo por subgrupos","Excluir a los grupos minoritarios para equilibrar los conteos","Revisar la representatividad y diversidad de los grupos demográficos incluidos","Ampliar el conjunto de datos sin revisar la procedencia ni el consentimiento","Confiar en que el modelo corrija el sesgo por sí solo"],"answers":[0,2],"explain":"Un conjunto inclusivo requiere representatividad de los grupos afectados y auditorías de la calidad de las etiquetas, que suelen arrastrar sesgos de decisiones humanas previas. Excluir grupos minoritarios o cargar datos sin revisar su procedencia reintroduce sesgos o vulnera requisitos legales, y ningún modelo corrige el sesgo de forma autónoma sin evaluación."},{"id":53,"domain":4,"task":"4.2","type":"match","stem":"Una entidad de salud pública documenta sus criterios sobre explicabilidad de modelos. Relaciona cada elemento con su descripción.","pairs":[["Modelo transparente","Su lógica interna puede inspeccionarse y explicarse a las personas afectadas"],["Modelo opaco","Alcanza buen desempeño, pero su razonamiento es difícil de interpretar"],["Amazon SageMaker Model Cards","Documenta el propósito previsto, las limitaciones y la información de evaluación del modelo"],["Modelo de código abierto","Sus pesos y su licencia permiten revisarlo y adaptarlo bajo las condiciones definidas"],["Retroalimentación del usuario","Mecanismo para que las personas cuestionen un resultado y soliciten revisión humana"]],"explain":"La explicabilidad se documenta combinando el tipo de modelo, su documentación y los canales de retroalimentación: los modelos transparentes se explican por su lógica, los opacos exigen documentación y controles adicionales, las Model Cards describen propósito y limitaciones y el modelo de código abierto se rige por su licencia. La retroalimentación del usuario cierra el ciclo al permitir corregir decisiones erróneas."},{"id":54,"domain":4,"task":"4.2","type":"mc","stem":"Un hospital debe elegir entre un modelo muy preciso pero opaco y otro más simple y explicable con menor precisión. ¿Qué enfoque refleja una práctica de IA responsable?","options":["Elegir el modelo más preciso y no documentar sus limitaciones","Elegir el modelo más explicable aunque su desempeño insuficiente ponga en riesgo a los pacientes","Ocultar a los usuarios que la decisión fue asistida por IA","Documentar el compromiso entre desempeño y explicabilidad, evaluar el impacto clínico y mantener la revisión humana"],"answers":[3],"explain":"La práctica responsable reconoce el compromiso entre precisión y transparencia, lo documenta, mide el impacto en las personas y conserva la supervisión humana. Ignorar las limitaciones u ocultar el uso de IA afecta la confianza y puede incumplir requisitos de transparencia, mientras que elegir un modelo con desempeño insuficiente también sería inaceptable desde el punto de vista clínico."},{"id":55,"domain":4,"task":"4.2","type":"mc","stem":"Una agencia de beneficios sociales notifica a los ciudadanos que una decisión sobre su solicitud fue asistida por un sistema de IA. ¿Qué práctica es coherente con los principios de transparencia de decisiones?","options":["Publicar los pesos del modelo y el prompt del sistema","Explicar en lenguaje claro qué factores se consideraron y cómo solicitar una revisión humana","Omitir el uso de IA en la notificación para evitar dudas","Publicar el código completo de un modelo comercial de terceros"],"answers":[1],"explain":"La transparencia de decisiones busca que la persona entienda qué se evaluó y cómo puede impugnar el resultado, en un lenguaje comprensible. Publicar pesos, prompts internos o el código de un modelo de terceros no aporta a esa comprensión y puede exponer propiedad intelectual o información sensible, mientras que ocultar el uso de IA contradice la transparencia."},{"id":56,"domain":4,"task":"4.2","type":"mc","stem":"Una universidad quiere adaptar un modelo de código
