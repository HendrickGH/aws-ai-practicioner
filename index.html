<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="utf-8">
<title>Simuladores AIF-C01 · AWS Certified AI Practitioner</title>
<style>
    *{box-sizing:border-box}
    :root{--r:12px;--r-sm:9px;
      --fuente:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",sans-serif}
    html[data-tema="oscuro"]{
      --fondo:#0b0e14;--panel:#141922;--panel2:#1b2230;--borde:#2a3444;--borde2:#3d4a5c;
      --texto:#eef2f8;--texto2:#a7b4c6;--acento:#ff9900;--acento-tinta:#1a1200;
      --acento-suave:rgba(255,153,0,.15);--ok:#3ecf8e;--ok-suave:rgba(62,207,142,.14);
      --mal:#ff7070;--mal-suave:rgba(255,112,112,.15);--aviso:#f2b134;
      --sombra:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.30)}
    html[data-tema="claro"]{
      --fondo:#e9eef6;--panel:#ffffff;--panel2:#f3f6fb;--borde:#cfd9e6;--borde2:#aebdce;
      --texto:#0f1826;--texto2:#48586e;--acento:#b85c00;--acento-tinta:#ffffff;
      --acento-suave:rgba(255,153,0,.18);--ok:#0a7245;--ok-suave:rgba(10,114,69,.12);
      --mal:#a8231c;--mal-suave:rgba(168,35,28,.10);--aviso:#8a5a00;
      --sombra:0 1px 2px rgba(16,24,40,.07),0 10px 26px rgba(16,24,40,.10)}
    body{margin:0;background:var(--fondo);color:var(--texto);font-family:var(--fuente);
      font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
    ::selection{background:var(--acento-suave)}
    :focus-visible{outline:2px solid var(--acento);outline-offset:2px;border-radius:6px}
    .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
      padding:9px 16px;background:color-mix(in srgb,var(--fondo) 88%,transparent);
      backdrop-filter:blur(8px);border-bottom:1px solid var(--borde)}
    .marca{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--texto2);font-weight:650}
    .marca b{color:var(--texto);letter-spacing:0}
    .app{max-width:960px;margin:0 auto;padding:20px 16px 60px}
    h1{font-size:21px;line-height:1.25;margin:0 0 4px;letter-spacing:-.01em}
    h2{font-size:15px;margin:0 0 10px;letter-spacing:.01em}
    .muted{color:var(--texto2);font-size:13px}
    .card{border:1px solid var(--borde);border-radius:var(--r);padding:16px 18px;
      background:var(--panel);box-shadow:var(--sombra);margin:12px 0}
    button{font-family:inherit;font-size:14px;cursor:pointer;border:1px solid var(--borde);
      background:var(--panel2);color:var(--texto);border-radius:var(--r-sm);padding:9px 15px;
      transition:background .15s,border-color .15s,filter .15s}
    button:hover{border-color:var(--borde2)}
    button.primary{background:var(--acento);color:var(--acento-tinta);border-color:transparent;font-weight:650}
    button.primary:hover{filter:brightness(1.07)}
    button.ghost{background:transparent}
    button.mini{padding:6px 11px;font-size:13px}
    button:disabled{opacity:.4;cursor:not-allowed}
    .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
    .spacer{flex:1}
    .tag{font-size:12px;color:var(--texto2);border:1px solid var(--borde);border-radius:999px;
      padding:3px 10px;background:var(--panel2);white-space:nowrap}
    .timer{font-variant-numeric:tabular-nums;font-weight:750;font-size:16px}
    .timer.low{color:var(--mal)}
    .barra{position:sticky;top:44px;z-index:15;margin:-4px -2px 12px;padding:10px 12px;
      border:1px solid var(--borde);border-radius:var(--r);background:color-mix(in srgb,var(--panel) 94%,transparent);
      backdrop-filter:blur(8px);box-shadow:var(--sombra)}
    .seg{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--borde);border-radius:12px;background:var(--panel2)}
    .seg-btn{border-color:transparent;background:transparent;border-radius:9px;padding:8px 14px}
    .seg-btn.active{background:var(--panel);border-color:var(--acento);font-weight:650}
    .examcard{position:relative;border:1px solid var(--borde);border-radius:var(--r);padding:13px 16px 13px 18px;
      margin:9px 0;cursor:pointer;background:var(--panel2);transition:border-color .15s,background .15s}
    .examcard:hover{border-color:var(--borde2)}
    .examcard.on{border-color:var(--acento);background:var(--acento-suave)}
    .examcard.on::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;
      border-radius:3px;background:var(--acento)}
    .opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--borde);border-radius:var(--r-sm);
      padding:11px 13px;margin:8px 0;cursor:pointer;background:var(--panel2);transition:border-color .15s,background .15s}
    .opt:hover{border-color:var(--borde2)}
    .opt .idx{display:inline-flex;align-items:center;justify-content:center;flex:0 0 25px;height:25px;border-radius:7px;
      background:var(--fondo);border:1px solid var(--borde);font-weight:750;font-size:12.5px;color:var(--texto2)}
    .opt.sel{border-color:var(--acento);background:var(--acento-suave)}
    .opt.sel .idx{background:var(--acento);color:var(--acento-tinta);border-color:transparent}
    .opt.correct{border-color:var(--ok);background:var(--ok-suave)}
    .opt.incorrect{border-color:var(--mal);background:var(--mal-suave)}
    .palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
    .pbtn{padding:7px 0;font-size:13px;text-align:center;background:var(--panel2)}
    .pbtn.done{border-color:var(--acento);font-weight:750;color:var(--acento)}
    .pbtn.flag{border-color:var(--aviso);color:var(--aviso)}
    .pbtn.cur{outline:2px solid var(--acento);outline-offset:1px}
    table{border-collapse:collapse;width:100%;font-size:14px}
    th,td{border-bottom:1px solid var(--borde);padding:9px 10px;text-align:left;vertical-align:top}
    th{font-weight:650;color:var(--texto2);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
    tr:hover td{background:var(--panel2)}
    .anillo{--c:var(--acento);width:136px;height:136px;flex:0 0 136px;border-radius:50%;
      background:conic-gradient(var(--c) calc(var(--p)*1%),var(--borde) 0);display:grid;place-items:center}
    .anillo.ok{--c:var(--ok)} .anillo.bad{--c:var(--mal)}
    .anillo>div{width:108px;height:108px;border-radius:50%;background:var(--panel);
      display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
    .score{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
    .veredicto{font-size:19px;font-weight:750;letter-spacing:.02em}
    .pass{color:var(--ok)} .fail{color:var(--mal)}
    .exp{border-left:3px solid var(--acento);padding:6px 0 6px 13px;margin-top:12px;font-size:14px;color:var(--texto2)}
    .exp strong{color:var(--texto)}
    select{font-family:inherit;font-size:14px;padding:8px 10px;border-radius:var(--r-sm);
      border:1px solid var(--borde);background:var(--panel2);color:var(--texto);max-width:100%}
    .pair{display:grid;grid-template-columns:1fr 1fr;gap:11px;align-items:center;margin:8px 0}
    .pair>span:first-child{font-size:14px}
    .seqitem{display:flex;gap:11px;align-items:center;border:1px solid var(--borde);border-radius:var(--r-sm);
      padding:10px 13px;margin:7px 0;cursor:pointer;background:var(--panel2);transition:border-color .15s,background .15s}
    .seqitem:hover{border-color:var(--borde2)}
    .seqitem.picked{border-color:var(--acento);background:var(--acento-suave)}
    .slot{display:inline-flex;align-items:center;justify-content:center;flex:0 0 25px;height:25px;border-radius:7px;
      background:var(--fondo);border:1px solid var(--borde);font-weight:750;font-size:12.5px;color:var(--texto2)}
    .seqitem.picked .slot{background:var(--acento);color:var(--acento-tinta);border-color:transparent}
    .pill{display:inline-block;font-size:11.5px;font-weight:650;border-radius:999px;padding:2px 10px;
      border:1px solid var(--borde);color:var(--texto2)}
    .pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-suave)}
    .pill.bad{color:var(--mal);border-color:var(--mal);background:var(--mal-suave)}
    .banner{border:1px solid var(--aviso);border-radius:var(--r-sm);padding:11px 13px;font-size:13.5px;margin:12px 0;color:var(--texto)}
    textarea{width:100%;min-height:96px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
      padding:10px;border-radius:var(--r-sm);border:1px solid var(--borde);background:var(--panel2);color:var(--texto)}
    ul{margin:6px 0 0 18px;padding:0} li{margin:3px 0}
    .bar{height:9px;border-radius:99px;background:var(--borde);overflow:hidden;min-width:90px}
    .bar>i{display:block;height:100%;border-radius:99px;background:var(--acento)}
    .bar.ok>i{background:var(--ok)} .bar.bad>i{background:var(--mal)}
    .prog{display:flex;gap:6px;flex-wrap:wrap}
    .prog span{font-size:12px;font-variant-numeric:tabular-nums;border:1px solid var(--borde);border-radius:999px;
      padding:3px 10px;background:var(--panel2)}
    .prog span.ok{border-color:var(--ok);color:var(--ok)} .prog span.bad{border-color:var(--mal);color:var(--mal)}
    hr{border:0;border-top:1px solid var(--borde);margin:16px 0}
    @media (max-width:640px){.pair{grid-template-columns:1fr}.card{padding:14px}.barra{top:40px}
      .anillo{width:112px;height:112px;flex-basis:112px}.anillo>div{width:88px;height:88px}.score{font-size:24px}}
</style>
</head>
<body>
<div class="topbar">
  <span class="marca">AWS Certified AI Practitioner · <b>AIF-C01</b></span>
  <span class="spacer"></span>
  <button id="btnTema" class="mini ghost" title="Cambiar entre tema claro y oscuro">Tema</button>
</div>
<div class="app" id="app"></div>
<script>
const EXAMS = [{"id":"A","name":"Examen 1 — Escenarios mixtos","desc":"Empresas y equipos variados; cubre el blueprint completo sin un sector dominante.","questions":[{"id":1,"domain":1,"task":"1.1","type":"mc","stem":"Un equipo explica a las partes interesadas cómo se relacionan entre sí las tecnologías de IA. ¿Cuál afirmación es correcta?","options":["El aprendizaje profundo (deep learning) es un subconjunto del aprendizaje automático (machine learning), y el aprendizaje automático es un subconjunto de la IA.","El aprendizaje automático es un subconjunto del aprendizaje profundo, y el aprendizaje profundo es un subconjunto de la IA.","La IA es un subconjunto del aprendizaje automático que utiliza únicamente redes neuronales con muchas capas.","La IA generativa es un subconjunto del aprendizaje profundo que requiere datos etiquetados para cada tarea."],"answers":[0],"explain":"El aprendizaje profundo utiliza redes neuronales de múltiples capas y es un subconjunto del aprendizaje automático, que a su vez forma parte del campo más amplio de la IA. La IA generativa produce contenido nuevo y no requiere datos etiquetados para cada tarea."},{"id":2,"domain":1,"task":"1.1","type":"mc","stem":"¿Qué descripción define mejor la IA agéntica (agentic AI)?","options":["Un sistema que devuelve una sola respuesta a un solo mensaje, sin interacción externa.","Un sistema en el que un modelo planifica, usa herramientas y ejecuta acciones en varios pasos para alcanzar un objetivo.","Un modelo que se entrena con datos sin etiquetar para agrupar registros similares.","Un modelo estadístico que predice un valor numérico a partir de datos tabulares históricos."],"answers":[1],"explain":"La IA agéntica va más allá de un único intercambio de pregunta y respuesta: el modelo descompone un objetivo, selecciona y llama herramientas o API, conserva memoria de los resultados intermedios e itera hasta completar la tarea. Un sistema que solo responde a un mensaje, o un modelo que únicamente agrupa registros, no actúa de forma autónoma."},{"id":3,"domain":1,"task":"1.2","type":"mc","stem":"Una empresa minorista quiere agrupar a sus clientes según su comportamiento de compra para diseñar campañas de marketing. No se dispone de etiquetas previas de clientes. ¿Qué enfoque debería utilizar?","options":["Aprendizaje supervisado con un modelo de regresión.","Aprendizaje no supervisado con un modelo de agrupamiento (clustering).","Aprendizaje supervisado con un modelo de clasificación.","Aprendizaje por refuerzo (reinforcement learning) con una función de recompensa."],"answers":[1],"explain":"Al no haber etiquetas disponibles, la tarea es no supervisada y el agrupamiento encuentra grupos naturales en los datos. La clasificación y la regresión supervisadas requieren ejemplos de entrenamiento etiquetados, que en este caso no existen."},{"id":4,"domain":1,"task":"1.1","type":"mc","stem":"Un robot autónomo de almacén mejora su ruta por prueba y error: recibe una penalización cuando choca y una recompensa cuando entrega una tarima rápidamente. ¿Qué tipo de aprendizaje se está utilizando?","options":["Aprendizaje supervisado.","Aprendizaje no supervisado.","Aprendizaje por refuerzo (reinforcement learning).","Aprendizaje por transferencia (transfer learning)."],"answers":[2],"explain":"Aprender con recompensas y penalizaciones mientras se interactúa con un entorno es aprendizaje por refuerzo. Al agente no se le entregan ejemplos etiquetados del comportamiento correcto, por lo que no se trata de aprendizaje supervisado."},{"id":5,"domain":1,"task":"1.1","type":"mc","stem":"Una empresa de medios debe transcribir cinco años de grabaciones archivadas durante un fin de semana. Los resultados se revisan el lunes siguiente y no se requiere una respuesta interactiva. ¿Qué tipo de inferencia es más apropiado?","options":["Inferencia por lotes (batch).","Inferencia en tiempo real.","Inferencia asíncrona.","Inferencia sin servidor (serverless)."],"answers":[0],"explain":"La inferencia por lotes procesa un gran volumen de solicitudes acumuladas y no exige un requisito de latencia. La inferencia en tiempo real y la asíncrona atienden solicitudes bajo demanda de las aplicaciones, que no es lo que pide este escenario."},{"id":6,"domain":1,"task":"1.1","type":"mc","stem":"Una aplicación envía una solicitud que tarda varios minutos en generar un video. El cliente no puede mantener la conexión abierta y espera recibir una notificación cuando el resultado esté listo. ¿Qué tipo de inferencia se ajusta mejor?","options":["Inferencia por lotes (batch).","Inferencia en tiempo real.","Inferencia asíncrona.","Inferencia en el dispositivo del cliente (edge)."],"answers":[2],"explain":"La inferencia asíncrona acepta solicitudes de larga duración: la solicitud se pone en cola, se procesa y el resultado se almacena para recuperarlo después, de modo que el cliente no se bloquea. La inferencia por lotes se usa con grandes conjuntos de datos sin un disparador por solicitud."},{"id":7,"domain":1,"task":"1.3","type":"mc","stem":"El modelo de detección de fraude de un banco debe detectar la mayor cantidad posible de transacciones fraudulentas, aun cuando eso implique marcar algunas transacciones legítimas para revisión manual. ¿Qué métrica debería priorizarse?","options":["Exactitud (accuracy).","Precisión (precision).","Exhaustividad (recall).","Error cuadrático medio (root mean squared error)."],"answers":[2],"explain":"La exhaustividad (recall) mide cuántos de los casos positivos reales se detectaron. Cuando pasar por alto un fraude es costoso y las falsas alarmas son tolerables, la métrica que conviene maximizar es el recall. La exactitud resulta engañosa con datos desbalanceados y la precisión favorece evitar falsos positivos."},{"id":8,"domain":1,"task":"1.3","type":"mc","stem":"¿Cuál de las siguientes es una métrica de negocio y no una métrica de rendimiento del modelo en una solución de IA?","options":["El puntaje F1 del clasificador.","La exhaustividad (recall) del modelo de predicción de abandono de clientes.","El retorno de la inversión (ROI) del programa de IA.","El área bajo la curva de precisión y exhaustividad."],"answers":[2],"explain":"Las métricas de negocio, como el ROI, el costo por usuario y los comentarios de los clientes, miden el valor entregado a la organización. El puntaje F1, el recall y las medidas basadas en curvas describen únicamente el comportamiento del modelo."},{"id":9,"domain":1,"task":"1.2","type":"mc","stem":"¿Qué escenario es el MENOS apropiado para una solución de aprendizaje automático (machine learning)?","options":["Pronosticar la demanda de productos de temporada del próximo trimestre.","Calcular un monto de impuestos exigido por ley que debe ser exacto, auditable y determinista.","Marcar patrones inusuales en millones de transacciones financieras.","Resumir conversaciones largas de atención al cliente para los agentes."],"answers":[1],"explain":"Cuando se requiere un resultado específico, exacto y auditable, lo correcto es una implementación determinista basada en reglas. El aprendizaje automático es apropiado cuando la tarea implica predicción o reconocimiento de patrones en datos demasiado grandes o variables para reglas fijas."},{"id":10,"domain":1,"task":"1.3","type":"mc","stem":"Seis meses después del despliegue, un modelo de pronóstico de demanda pierde exactitud de forma notoria porque el comportamiento de compra de los clientes cambió. ¿Qué práctica de MLOps atiende este problema?","options":["Aumentar el tamaño de la instancia de inferencia.","Supervisar el modelo para detectar desviación de datos (data drift) y reentrenarlo con datos recientes.","Reducir la temperatura del modelo.","Volver a ejecutar el experimento de entrenamiento inicial sin cambios."],"answers":[1],"explain":"Supervisar las entradas y las salidas en producción permite detectar la desviación, y el reentrenamiento periódico con datos actuales restaura la exactitud. Escalar la infraestructura no corrige un modelo desactualizado y repetir el experimento original reproduce los mismos patrones obsoletos."},{"id":11,"domain":1,"task":"1.2","type":"mc","stem":"Una entidad financiera regulada necesita un modelo de decisión cuyo razonamiento pueda explicarse por completo a los auditores. El conjunto de datos disponible es modesto y el requisito de exactitud es moderado. ¿Qué enfoque es más apropiado?","options":["Ajustar finamente (fine-tuning) un modelo fundacional multimodal grande con los datos de la entidad.","Usar un modelo de aprendizaje automático tradicional e interpretable en lugar de un modelo fundacional.","Aplicar generación aumentada por recuperación (RAG) con un modelo fundacional.","Usar un modelo fundacional con una temperatura más alta."],"answers":[1],"explain":"Los requisitos regulatorios de explicabilidad, los datos limitados y una necesidad moderada de exactitud favorecen los modelos tradicionales interpretables. Los modelos fundacionales son preferibles cuando las tareas son abiertas, intensivas en lenguaje o modalidades, o requieren una capacidad de generalización amplia."},{"id":12,"domain":1,"task":"1.3","type":"order","stem":"Ordene las etapas de un flujo de trabajo (pipeline) de IA/ML de la primera a la última actividad.","items":["Recopilar datos de los sistemas de origen","Explorar y preprocesar los datos","Construir y registrar las variables (features)","Entrenar y evaluar el modelo","Desplegar y supervisar el modelo"],"explain":"El flujo comienza con la recopilación de datos, continúa con el análisis exploratorio y el preprocesamiento, sigue con la ingeniería y el registro de variables, después con el entrenamiento y la evaluación, y termina con el despliegue y la supervisión continua para detectar desviaciones."},{"id":13,"domain":1,"task":"1.2","type":"match","stem":"Relacione cada servicio de IA administrado de AWS con la capacidad que ofrece.","pairs":[["Amazon Transcribe","Convertir voz en texto"],["Amazon Comprehend","Extraer entidades y sentimiento a partir de texto"],["Amazon Lex","Crear interfaces conversacionales de voz y chat"],["Amazon Polly","Convertir texto en voz de sonido natural"],["Amazon Rekognition","Detectar objetos y rostros en imágenes y video"],["Amazon Textract","Extraer texto y datos de formularios de documentos escaneados"]],"explain":"Estos servicios administrados ofrecen capacidades de IA preconstruidas para no entrenar modelos desde cero: voz a texto (Transcribe), análisis de texto (Comprehend), bots conversacionales (Lex), texto a voz (Polly), análisis de imágenes y video (Rekognition) y extracción de documentos (Textract)."},{"id":14,"domain":2,"task":"2.1","type":"mc","stem":"¿Qué afirmación define mejor un modelo fundacional (foundation model)?","options":["Un modelo entrenado con un conjunto de datos limitado para una única tarea que nunca se reutiliza.","Un modelo grande preentrenado con datos amplios que puede adaptarse a muchas tareas posteriores.","Un motor de reglas que codifica decisiones de expertos como enunciados condicionales.","Un tablero que visualiza las predicciones generadas por otros sistemas."],"answers":[1],"explain":"Los modelos fundacionales se preentrenan con datos generales amplios y después se adaptan mediante instrucciones (prompting), generación aumentada por recuperación (RAG) o ajuste fino para muchas tareas distintas, lo que los hace reutilizables. Un modelo de una sola tarea y un motor de reglas no tienen esa capacidad de adaptación."},{"id":15,"domain":2,"task":"2.1","type":"mc","stem":"¿Qué es un token en el contexto de un modelo de lenguaje grande (LLM)?","options":["Una unidad de texto, aproximadamente una palabra o parte de una palabra, que el modelo procesa y en la que se basa la facturación.","Una imagen individual usada para entrenar un modelo multimodal.","Una credencial de cuenta de usuario utilizada para llamar a la API del modelo.","Un punto de control que guarda los pesos del modelo durante el entrenamiento."],"answers":[0],"explain":"El texto se divide en tokens antes de procesarse. Tanto los tokens de entrada como los de salida consumen la ventana de contexto del modelo y determinan el costo de la inferencia."},{"id":16,"domain":2,"task":"2.1","type":"mc","stem":"Un equipo quiere una búsqueda semántica sobre descripciones de productos para que los resultados coincidan por significado y no por palabras clave exactas. ¿Qué debe generar y almacenar?","options":["Incrustaciones (embeddings) de las descripciones almacenadas en un almacén de vectores.","Miniaturas comprimidas de las imágenes de los productos.","Políticas de acceso a nivel de fila para la tabla de productos.","Un valor hash de cada descripción para la coincidencia exacta."],"answers":[0],"explain":"Las incrustaciones son vectores numéricos que capturan el significado, de modo que los registros con significado similar quedan cerca unos de otros en el espacio vectorial. Almacenarlas en un almacén de vectores se habilita la búsqueda por similitud en lugar de la coincidencia por palabras clave."},{"id":17,"domain":2,"task":"2.1","type":"mc","stem":"¿Por qué se utiliza la fragmentación (chunking) al preparar documentos para la generación aumentada por recuperación (RAG)?","options":["Para comprimir los documentos y que consuman menos tokens al archivarlos.","Para dividir los documentos en pasajes más pequeños, de modo que solo se recupere el contenido más relevante y quepa en la ventana de contexto.","Para cifrar los documentos antes de almacenarlos en una base de datos vectorial.","Para traducir los documentos al idioma del modelo."],"answers":[1],"explain":"La recuperación funciona mejor con fragmentos pequeños y semánticamente coherentes. La fragmentación mejora la precisión de las coincidencias y mantiene el contexto recuperado dentro de los límites de la ventana de contexto del modelo."},{"id":18,"domain":2,"task":"2.1","type":"mc","stem":"Un modelo acepta tanto imágenes como texto y puede responder preguntas sobre el contenido de un diagrama enviado. ¿Qué término describe a este modelo?","options":["Un modelo fundacional multimodal.","Un modelo de pronóstico de series de tiempo.","Un modelo de filtrado colaborativo.","Un sistema experto basado en reglas."],"answers":[0],"explain":"Un modelo capaz de procesar más de una modalidad de entrada, como texto e imágenes, es multimodal. Así se habilita la comprensión de diagramas, documentos y capturas de pantalla."},{"id":19,"domain":2,"task":"2.1","type":"mc","stem":"¿Qué tipo de modelo se usa más comúnmente para generar imágenes fotorrealistas a partir de una descripción de texto?","options":["Un modelo de difusión (diffusion model).","Un modelo de recomendaciones.","Un modelo de agrupamiento (clustering).","Un modelo de detección de anomalías."],"answers":[0],"explain":"Los modelos de difusión generan imágenes eliminando progresivamente el ruido de un punto de partida aleatorio, guiados por el prompt de texto. Los LLM basados en transformadores se encargan de la generación de texto, no de imágenes fotorrealistas."},{"id":20,"domain":2,"task":"2.2","type":"mc","stem":"Un asistente de IA generativa cita con seguridad una política de la empresa que no existe en ninguno de los documentos de la compañía. ¿Qué limitación ilustra esto?","options":["Alucinación (hallucination).","Desviación de datos (data drift).","Subajuste (underfitting).","Caché de prompts (prompt caching)."],"answers":[0],"explain":"Una alucinación es una afirmación fluida pero incorrecta o inventada. Fundamentar las respuestas en documentos fuente recuperados y validar las salidas reduce este riesgo, mientras que la caché de prompts solo acelera respuestas repetidas."},{"id":21,"domain":2,"task":"2.2","type":"mc","stem":"Después de aumentar el parámetro de temperatura, el mismo prompt devuelve respuestas notablemente distintas en cada ejecución y en ocasiones incluye detalles incorrectos. ¿Qué controla el parámetro de temperatura?","options":["La aleatoriedad y la creatividad de la respuesta generada.","La cantidad de documentos recuperados del almacén de vectores.","La longitud de la ventana de contexto del modelo.","El cifrado de los datos en reposo."],"answers":[0],"explain":"La temperatura controla qué tan determinista es el muestreo. Los valores bajos producen salidas más consistentes y factuales; los valores altos generan salidas más variadas y creativas a costa de la consistencia."},{"id":22,"domain":2,"task":"2.2","type":"mc","stem":"¿Qué afirmación describe una ventaja clave de la IA generativa frente a un modelo de aprendizaje automático tradicional específico para una tarea?","options":["Siempre produce una salida determinista e idéntica para la misma entrada.","Puede adaptarse a nuevas tareas con pocos o ningún dato de entrenamiento específico de la tarea.","Nunca requiere revisión humana de su salida.","Elimina la necesidad de controlar el acceso a los datos de la empresa."],"answers":[1],"explain":"Los modelos fundacionales generalizan: el mismo modelo puede resumir, traducir, clasificar o redactar cambiando el prompt, en lugar de requerir un nuevo conjunto de datos etiquetados y un nuevo ciclo de entrenamiento para cada tarea. Además, su salida es no determinista, por lo que la revisión humana sigue siendo necesaria."},{"id":23,"domain":2,"task":"2.2","type":"mc","stem":"Un asistente de cara al cliente debe responder en menos de un segundo y la normativa exige que todos los datos permanezcan en un país específico. ¿Qué factores son más importantes al seleccionar un modelo y un enfoque de despliegue?","options":["La latencia, la disponibilidad regional y los requisitos de cumplimiento.","La cantidad de parámetros del modelo más grande disponible.","El tamaño del conjunto de datos usado para preentrenar el modelo.","El lenguaje de programación que usa la aplicación cliente."],"answers":[0],"explain":"La selección de un modelo equilibra requisitos de rendimiento (latencia), restricciones (disponibilidad en la Región y residencia de datos) y cumplimiento normativo. Los modelos más grandes o más preentrenados no son automáticamente los más adecuados para el caso de uso."},{"id":24,"domain":2,"task":"2.2","type":"mc","stem":"¿Qué métricas demuestran mejor el valor de negocio de un asistente de atención al cliente con IA generativa?","options":["Las puntuaciones ROUGE y BLEU.","El costo por interacción y la tasa de finalización de tareas.","La cantidad de parámetros del modelo y el tamaño de la ventana de contexto.","La cantidad de vectores almacenados en la base de datos vectorial."],"answers":[1],"explain":"El valor de negocio de un asistente en producción se mide con métricas operativas y de resultado, como el costo por interacción, la tasa de finalización de tareas, la satisfacción del usuario y la tasa de resolución sin agente. ROUGE y BLEU son métricas de calidad de texto que se usan durante la evaluación del modelo, no indicadores de negocio."},{"id":25,"domain":2,"task":"2.3","type":"mc","stem":"¿Por qué un prompt más largo, junto con una respuesta generada más larga, aumenta el costo de una invocación de Amazon Bedrock?","options":["Porque el costo se basa en la cantidad de tokens de entrada y de salida procesados.","Porque el costo se basa en la cantidad de claves de API usadas en la solicitud.","Porque el costo se basa en el tamaño del conjunto de datos de entrenamiento del modelo.","Porque el costo se basa en la cantidad de Regiones que usa la cuenta."],"answers":[0],"explain":"El precio bajo demanda de Amazon Bedrock sigue un modelo basado en tokens: los tokens de entrada y los de salida se facturan por separado. Reducir el contexto del prompt y limitar la longitud de la respuesta reduce directamente el costo."},{"id":26,"domain":2,"task":"2.1","type":"mc","stem":"¿Qué actividad implica la ingeniería de contexto (context engineering) en una aplicación con modelos fundacionales?","options":["Seleccionar y estructurar todo lo que se coloca en el contexto del modelo, como instrucciones, documentos recuperados, resultados de herramientas e historial de conversación.","Compilar el código de la aplicación que llama a la API del modelo.","Diseñar el esquema relacional de la base de datos transaccional.","Elegir el tipo de instancia que aloja el front end de la aplicación."],"answers":[0],"explain":"La ingeniería de contexto es la gestión deliberada de lo que el modelo puede ver en el momento de la inferencia. Como la ventana de contexto es limitada, decidir qué incluir, resumir u omitir afecta directamente la calidad de la salida y el costo."},{"id":27,"domain":2,"task":"2.1","type":"mc","stem":"¿Cuál es el papel del Protocolo de Contexto de Modelo (MCP) en las aplicaciones de IA agéntica?","options":["Proporciona una forma estándar para que los agentes se conecten con herramientas, fuentes de datos y servicios externos.","Cifra los pesos del modelo en reposo.","Reemplaza la necesidad de gestión de identidades y accesos para los agentes.","Ajusta finamente el modelo de forma automática después de cada conversación."],"answers":[0],"explain":"MCP estandariza la forma en que los agentes descubren y llaman capacidades externas, lo que reduce el trabajo de integración personalizado para cada nueva herramienta o fuente de datos y hace más portátiles los flujos multiagente. No sustituye la gestión de identidades ni modifica los pesos del modelo."},{"id":28,"domain":2,"task":"2.3","type":"mc","stem":"Un equipo de desarrollo quiere un entorno de desarrollo impulsado por IA que convierta especificaciones en código funcional mediante un flujo de trabajo agéntico y estructurado. ¿Qué oferta está diseñada para esto?","options":["Kiro.","Amazon Polly.","AWS Artifact.","Amazon Macie."],"answers":[0],"explain":"Kiro es el entorno de desarrollo agéntico de AWS que parte de especificaciones para generar y mantener código. Las otras opciones son servicios de síntesis de voz, de documentación de cumplimiento y de descubrimiento de datos sensibles."},{"id":29,"domain":2,"task":"2.3","type":"mr","stem":"¿Qué TRES ofertas de AWS puede usar un equipo para crear aplicaciones de IA generativa? (Selecciona tres.)","options":["Amazon Bedrock","Amazon SageMaker AI","Strands Agents","AWS Artifact","AWS Glue DataBrew"],"answers":[0,1,2],"explain":"Amazon Bedrock ofrece acceso administrado a modelos fundacionales, Amazon SageMaker AI cubre todo el ciclo de desarrollo y despliegue de modelos, y Strands Agents es un marco para crear agentes. AWS Artifact proporciona informes de cumplimiento y AWS Glue DataBrew es una herramienta de preparación de datos, no un componente para crear aplicaciones de IA generativa."},{"id":30,"domain":3,"task":"3.1","type":"mc","stem":"¿Qué afirmación describe mejor la generación aumentada por recuperación (RAG)?","options":["Recuperar documentos relevantes y agregarlos al prompt para que el modelo responda con información actual y específica del dominio.","Reentrenar todos los pesos del modelo cada noche con los documentos más recientes de la empresa.","Comprimir el modelo para que quepa en una instancia de inferencia más pequeña.","Almacenar en caché los prompts de los usuarios para que las preguntas idénticas respondan al instante."],"answers":[0],"explain":"RAG mantiene el modelo sin cambios y le entrega contenido fuente relevante en el momento de la inferencia. Así se fundamentan las respuestas en los datos de la organización sin el costo de un entrenamiento; reentrenar los pesos cada noche sería mucho más caro y lento."},{"id":31,"domain":3,"task":"3.1","type":"mc","stem":"Una empresa quiere usar RAG administrado sobre su documentación interna sin construir su propio flujo de incrustaciones, indexación y recuperación. ¿Qué capacidad debería usar?","options":["Knowledge Bases for Amazon Bedrock.","Amazon Bedrock Guardrails.","Amazon Bedrock Model Evaluation.","AWS CloudTrail."],"answers":[0],"explain":"Knowledge Bases for Amazon Bedrock se encarga de la ingesta, la fragmentación, la generación de incrustaciones, el almacenamiento y la recuperación, y conecta los pasajes recuperados con el modelo. Guardrails filtra contenido, Model Evaluation califica las salidas y CloudTrail registra la actividad de las API."},{"id":32,"domain":3,"task":"3.1","type":"mc","stem":"¿Qué servicio de AWS puede funcionar como el almacén de vectores que contiene las incrustaciones usadas para la recuperación semántica?","options":["Amazon OpenSearch Service.","Amazon Macie.","AWS Glue DataBrew.","Amazon S3 Glacier."],"answers":[0],"explain":"Amazon OpenSearch Service admite búsqueda vectorial para incrustaciones. Amazon Aurora, Amazon Neptune y Amazon RDS for PostgreSQL también ofrecen capacidades vectoriales, mientras que Macie, AWS Glue DataBrew y Amazon S3 Glacier tienen propósitos distintos."},{"id":33,"domain":3,"task":"3.1","type":"mc","stem":"Un equipo debe darle a un modelo fundacional conocimiento de un pequeño conjunto de documentos internos que cambia cada semana. ¿Qué enfoque suele ser el más eficiente en costos?","options":["Preentrenar un modelo fundacional nuevo desde cero.","Preentrenamiento continuo del modelo existente.","Generación aumentada por recuperación (RAG) o aprendizaje en contexto (in-context learning) con los documentos actuales.","Ajuste fino (fine-tuning) completo de todos los pesos del modelo cada semana."],"answers":[2],"explain":"RAG y el aprendizaje en contexto incorporan conocimiento actualizado en el momento de la inferencia sin costo de entrenamiento y con vigencia inmediata. El preentrenamiento, el preentrenamiento continuo y el ajuste fino completo son mucho más caros y lentos de actualizar."},{"id":34,"domain":3,"task":"3.3","type":"mc","stem":"Un equipo quiere un modelo más pequeño y económico que reproduzca la mayor parte de la calidad de un modelo mucho más grande en una tarea específica. ¿Qué técnica debería aplicar?","options":["Destilación de modelos (model distillation).","Aumentar el parámetro de temperatura.","Agregar más registros al almacén de vectores.","Habilitar la caché de prompts."],"answers":[0],"explain":"La destilación de modelos entrena un modelo compacto para imitar el comportamiento de un modelo maestro más grande, lo que reduce el costo de inferencia y la latencia conservando la mayor parte de la calidad en la tarea. Agregar vectores o usar caché no cambia el tamaño del modelo."},{"id":35,"domain":3,"task":"3.1","type":"mc","stem":"Una aplicación debe producir respuestas muy consistentes y factuales para un caso de uso de soporte técnico. ¿Qué cambio en los parámetros de inferencia lo favorece mejor?","options":["Reducir la temperatura.","Aumentar la temperatura.","Aumentar la cantidad máxima de tokens de salida.","Aumentar sin límite la cantidad de documentos recuperados."],"answers":[0],"explain":"Una temperatura más baja reduce la aleatoriedad del muestreo, con lo que las respuestas son más repetibles y enfocadas. Aumentar la temperatura incrementa la variación y agregar contexto sin límite puede introducir contenido irrelevante."},{"id":36,"domain":3,"task":"3.1","type":"mc","stem":"¿Qué parámetro de inferencia limita la longitud de la respuesta generada por el modelo?","options":["La configuración de tokens máximos de salida.","La configuración de temperatura.","La configuración de top-p.","La configuración de rendimiento aprovisionado (provisioned throughput)."],"answers":[0],"explain":"El parámetro de tokens máximos de salida limita la longitud de la respuesta. La temperatura y top-p afectan la aleatoriedad, y el rendimiento aprovisionado influye en la capacidad y el precio, no en la longitud de la respuesta."},{"id":37,"domain":3,"task":"3.2","type":"mc","stem":"Un prompt incluye una instrucción y dos ejemplos del formato de entrada y salida deseado antes de la solicitud real. ¿Qué técnica se está usando?","options":["Instrucción con pocos ejemplos (few-shot prompting).","Instrucción sin ejemplos (zero-shot prompting).","Cadena de pensamiento (chain-of-thought prompting).","Prompt negativo (negative prompting)."],"answers":[0],"explain":"Incluir una pequeña cantidad de ejemplos en el prompt es few-shot prompting. Resulta eficaz cuando el formato o el patrón de razonamiento requerido es más fácil de mostrar que de describir, mientras que zero-shot no incluye ejemplos."},{"id":38,"domain":3,"task":"3.2","type":"mc","stem":"¿Qué técnica de ingeniería de prompts pide al modelo que recorra pasos intermedios de razonamiento antes de producir la respuesta final?","options":["Cadena de pensamiento (chain-of-thought prompting).","Prompt negativo (negative prompting).","Plantillas de prompts (prompt templating).","Caché de prompts (prompt caching)."],"answers":[0],"explain":"La cadena de pensamiento mejora los resultados en tareas analíticas de varios pasos porque hace explícito el razonamiento intermedio. Los prompts negativos excluyen contenido no deseado y las plantillas reutilizan la estructura del prompt."},{"id":39,"domain":3,"task":"3.2","type":"mc","stem":"Un equipo quiere reutilizar el mismo prompt en varias aplicaciones, comparar revisiones y revertir un cambio que degradó la calidad. ¿Qué capacidad debería usar?","options":["Prompt Management de Amazon Bedrock.","Amazon Bedrock Guardrails.","AWS Config.","Amazon Inspector."],"answers":[0],"explain":"Prompt Management de Amazon Bedrock almacena los prompts de forma centralizada y admite versiones, de modo que los equipos pueden probar, comparar y revertir cambios en los prompts de forma independiente de los despliegues de la aplicación. Guardrails filtra contenido y no versiona prompts."},{"id":40,"domain":3,"task":"3.2","type":"mc","stem":"Un usuario pega en un chatbot de atención al cliente un texto que le indica al bot ignorar sus reglas y revelar su prompt de sistema y su configuración interna. ¿Qué riesgo representa esto?","options":["Inyección de prompts (prompt injection).","Desviación de datos (data drift).","Subajuste (underfitting).","Destilación de modelos (model distillation)."],"answers":[0],"explain":"La inyección de prompts es un intento de anular las instrucciones de la aplicación mediante entradas manipuladas. Las defensas incluyen validación de entradas, barreras de protección (guardrails) y filtrado de la salida; además, el prompt de sistema nunca debe tratarse como un secreto."},{"id":41,"domain":3,"task":"3.2","type":"mc","stem":"Un atacante inserta instrucciones ocultas en documentos que un sistema de RAG recupera después y envía al modelo. ¿Qué riesgo ilustra esto?","options":["Envenenamiento de prompts (prompt poisoning).","Desbalance de etiquetas.","Sobreajuste (overfitting).","Desbordamiento de tokens (token overflow)."],"answers":[0],"explain":"Como el contenido recuperado entra en el prompt, los documentos no confiables se convierten en una superficie de ataque. El envenenamiento de prompts explota esa ruta, por lo que conviene curar las fuentes documentales y tratar el contenido recuperado como datos no confiables."},{"id":42,"domain":3,"task":"3.4","type":"mc","stem":"¿Qué métrica está diseñada para evaluar la calidad de un resumen midiendo la coincidencia entre el texto generado y uno o más resúmenes de referencia?","options":["ROUGE.","BLEU.","El error cuadrático medio (root mean squared error).","El área bajo la curva."],"answers":[0],"explain":"ROUGE se centra en la recuperación del contenido de referencia y se usa comúnmente para evaluar resúmenes. BLEU se originó para la traducción automática, y las otras métricas corresponden a modelos de regresión o de clasificación."},{"id":43,"domain":3,"task":"3.1","type":"mc","stem":"¿Qué afirmación describe el papel de los agentes de IA en tareas de negocio de varios pasos?","options":["Planifican el trabajo, llaman herramientas o API y usan los resultados intermedios para alcanzar un objetivo con supervisión humana limitada.","Reemplazan toda la toma de decisiones humanas y no requieren supervisión.","Solo clasifican texto en categorías predefinidas.","Generan una sola respuesta y no pueden usar sistemas externos."],"answers":[0],"explain":"Los agentes descomponen un objetivo, seleccionan herramientas, ejecutan pasos y se adaptan según los resultados. La supervisión humana sigue siendo necesaria y el diseño debe incluir límites sobre las acciones que el agente puede realizar."},{"id":44,"domain":3,"task":"3.4","type":"mc","stem":"¿Qué capacidad de AWS ofrece evaluación integrada de modelos fundacionales mediante conjuntos de datos curados y calificación automatizada, como un LLM como juez (LLM-as-a-judge)?","options":["Amazon Bedrock Model Evaluation.","AWS Trusted Advisor.","Amazon Lex.","AWS Budgets."],"answers":[0],"explain":"Amazon Bedrock Model Evaluation ejecuta evaluaciones automáticas y humanas con conjuntos de datos integrados o personalizados, lo que ayuda a comparar modelos y detectar regresiones antes del despliegue. AWS Trusted Advisor ofrece recomendaciones y AWS Budgets controla el gasto."},{"id":45,"domain":3,"task":"3.1","type":"mr","stem":"¿Qué DOS técnicas añaden información nueva al comportamiento de un modelo fundacional en el momento de la inferencia SIN cambiar los pesos del modelo? (Selecciona dos.)","options":["Generación aumentada por recuperación (RAG)","Aprendizaje en contexto (in-context learning)","Ajuste fino por instrucciones (instruction fine-tuning)","Preentrenamiento continuo","Destilación de modelos (model distillation)"],"answers":[0,1],"explain":"RAG entrega contenido recuperado en el prompt y el aprendizaje en contexto entrega instrucciones y ejemplos en el prompt. Ambos dejan el modelo sin cambios; el ajuste fino, el preentrenamiento continuo y la destilación modifican o producen pesos del modelo."},{"id":46,"domain":3,"task":"3.1","type":"order","stem":"Ordene los pasos de una solicitud de generación aumentada por recuperación (RAG) en el orden correcto.","items":["Convertir la consulta del usuario en una incrustación (embedding)","Recuperar del almacén de vectores los fragmentos de documento más relevantes","Agregar los fragmentos recuperados al prompt como contexto","Enviar el prompt aumentado al modelo fundacional","Devolver la respuesta fundamentada con las citas de las fuentes"],"explain":"La consulta se convierte en una incrustación, se recuperan los fragmentos similares, esos fragmentos se agregan al prompt, el modelo genera a partir del contexto aumentado y la respuesta se devuelve con citas que permiten al usuario verificar las fuentes."},{"id":47,"domain":3,"task":"3.2","type":"match","stem":"Relacione cada técnica de ingeniería de prompts con su descripción.","pairs":[["Instrucción sin ejemplos (zero-shot)","Una instrucción a la que no se le proporcionan ejemplos"],["Instrucción con pocos ejemplos (few-shot)","Una instrucción con algunos pares de ejemplo de entrada y salida"],["Cadena de pensamiento (chain-of-thought)","Una solicitud de razonar paso a paso antes de responder"],["Prompt negativo","Una especificación de lo que no debe aparecer en la salida"],["Plantilla de prompt","Una estructura de prompt reutilizable con marcadores de posición para variables"]],"explain":"Zero-shot y few-shot se diferencian por la presencia de ejemplos, la cadena de pensamiento guía el razonamiento, los prompts negativos excluyen contenido no deseado y las plantillas hacen que los prompts sean reutilizables entre solicitudes."},{"id":48,"domain":4,"task":"4.1","type":"mc","stem":"Un modelo de contratación tiene un buen desempeño general, pero produce resultados notablemente peores para un grupo demográfico. ¿Qué característica de la IA responsable se está incumpliendo?","options":["Equidad (fairness).","Latencia.","Escalabilidad.","Idempotencia."],"answers":[0],"explain":"La equidad exige que un sistema evite impactos dispares injustificados entre grupos. El análisis por subgrupos y los datos de entrenamiento representativos se usan para detectar y reducir este tipo de sesgo."},{"id":49,"domain":4,"task":"4.1","type":"mc","stem":"Una empresa quiere bloquear contenido dañino, denegar temas específicos y ocultar información de identificación personal en una aplicación de IA generativa. ¿Qué capacidad debería usar?","options":["Amazon Bedrock Guardrails.","AWS Budgets.","Amazon CloudWatch Logs Insights.","AWS Trusted Advisor."],"answers":[0],"explain":"Amazon Bedrock Guardrails aplica filtros configurables, temas denegados, filtros de palabras y ocultamiento de información sensible tanto en la entrada como en la salida, de forma independiente del modelo subyacente. AWS Budgets controla el gasto y Trusted Advisor ofrece recomendaciones."},{"id":50,"domain":4,"task":"4.1","type":"mc","stem":"Un modelo generativo produce textos de marketing que reproducen de cerca pasajes de material fuente protegido por derechos de autor. ¿Qué riesgo legal representa esto?","options":["Reclamaciones por infracción de propiedad intelectual.","Incumplimiento de la residencia de datos.","Agotamiento del rendimiento aprovisionado.","Desbordamiento de tokens (token overflow)."],"answers":[0],"explain":"La salida generativa puede reproducir sin intención contenido protegido y exponer a la organización a reclamaciones por propiedad intelectual. Las mitigaciones incluyen revisar la procedencia de los datos de entrenamiento, aplicar filtros de contenido y realizar revisión humana antes de publicar."},{"id":51,"domain":4,"task":"4.1","type":"mc","stem":"¿Qué característica del conjunto de datos reduce más el riesgo de un comportamiento sesgado del modelo?","options":["Que el conjunto de datos sea representativo de las poblaciones que el modelo afectará y esté equilibrado entre los grupos relevantes.","Que el conjunto de datos contenga solo registros que confirman el resultado esperado.","Que el conjunto de datos sea lo más pequeño posible para reducir el tiempo de entrenamiento.","Que el conjunto de datos contenga solo los campos que fueron más fáciles de recopilar."],"answers":[0],"explain":"La representatividad y el equilibrio entre los grupos afectados son las características principales que reducen el sesgo. Filtrar solo registros que confirman lo esperado o reducir los datos al mínimo amplifica el sesgo y perjudica la generalización."},{"id":52,"domain":4,"task":"4.1","type":"mc","stem":"¿Qué práctica ayuda a un equipo a detectar sesgo en un modelo en producción?","options":["Realizar análisis por subgrupos y auditorías humanas periódicas sobre las salidas del modelo.","Aumentar la cantidad máxima de tokens de salida.","Cambiar el almacén de vectores a otro motor.","Reducir la cantidad de Regiones que usa la cuenta."],"answers":[0],"explain":"Comparar resultados entre subgrupos, auditar con revisores humanos muestras de salidas reales y evaluar la calidad de las etiquetas son las formas prácticas de detectar sesgo. Las otras opciones afectan el costo o la capacidad, no la equidad."},{"id":53,"domain":4,"task":"4.2","type":"mc","stem":"¿Qué herramienta ayuda a documentar el uso previsto de un modelo, las características de los datos de entrenamiento y los resultados de la evaluación, para que los revisores entiendan cómo se construyó el modelo?","options":["Amazon SageMaker Model Cards.","AWS Cost Explorer.","Amazon CloudFront.","AWS Secrets Manager."],"answers":[0],"explain":"Las tarjetas de modelo (Model Cards) de Amazon SageMaker AI registran el uso previsto, el linaje de los datos y los resultados de la evaluación en un documento estándar, lo que respalda la transparencia y la revisión. AWS Secrets Manager y AWS Cost Explorer tienen propósitos distintos."},{"id":54,"domain":4,"task":"4.2","type":"mc","stem":"Una empresa publica los pesos de un modelo y todos los detalles de su entrenamiento para maximizar la transparencia. ¿Qué riesgo aumenta de forma más directa?","options":["Que actores malintencionados que obtengan el modelo puedan usarlo indebidamente o manipularlo.","Que el modelo ya no pueda producir salida de texto.","Que aumente el precio por token cobrado por el proveedor.","Que la disponibilidad del modelo por Región se restrinja de forma automática."],"answers":[0],"explain":"Existe una tensión real entre transparencia y seguridad: publicar los pesos y los detalles permite el escrutinio externo, pero también elimina barreras para el uso indebido, como el ajuste fino del modelo con fines dañinos."},{"id":55,"domain":4,"task":"4.1","type":"mc","stem":"Un modelo logra una exactitud casi perfecta con los datos de entrenamiento, pero tiene un desempeño deficiente con datos nuevos que nunca vio. ¿Qué está ocurriendo?","options":["El modelo se está sobreajustando (overfitting) a los datos de entrenamiento.","El modelo se está subajustando (underfitting) a los datos de entrenamiento.","El modelo tiene varianza baja y sesgo alto.","El modelo necesita una ventana de contexto más grande."],"answers":[0],"explain":"El sobreajuste significa que el modelo memorizó el ruido y las particularidades del conjunto de entrenamiento en lugar de patrones generalizables. Las soluciones incluyen más datos o datos más variados, regularización y modelos más simples. El subajuste es el síntoma contrario: resultados deficientes tanto con los datos de entrenamiento como con datos nuevos."},{"id":56,"domain":4,"task":"4.2","type":"mc","stem":"¿Qué práctica de diseño respalda una IA explicable centrada en las personas en una herramienta de apoyo a las decisiones?","options":["Mostrar los factores detrás de cada recomendación y ofrecer a los usuarios una forma de dar retroalimentación sobre las decisiones.","Ocultar el razonamiento del modelo para no confundir al operador.","Eliminar toda revisión humana para acelerar el procesamiento.","Mostrar solo el puntaje de confianza del modelo, sin contexto."],"answers":[0],"explain":"La explicabilidad centrada en las personas presenta el razonamiento en términos sobre los que el usuario puede actuar y cierra el ciclo con la retroalimentación del usuario, de modo que los operadores puedan cuestionar el sistema cuando algo parezca incorrecto."},{"id":57,"domain":5,"task":"5.1","type":"mc","stem":"Una aplicación que se ejecuta en Amazon EC2 debe invocar Amazon Bedrock. ¿Qué enfoque sigue el principio de menor privilegio?","options":["Adjuntar a la instancia un rol de IAM con una política que permita únicamente las acciones necesarias sobre el modelo de Amazon Bedrock.","Almacenar claves de acceso de larga duración en el código fuente de la aplicación.","Otorgar a la instancia acceso de administrador a la cuenta de AWS.","Compartir las credenciales de un solo usuario de IAM en todos los entornos."],"answers":[0],"explain":"Un rol de IAM limitado al modelo y a las acciones específicas cumple el principio de menor privilegio y evita credenciales de larga duración. Las claves codificadas, el acceso de administrador y las credenciales compartidas amplían el alcance del impacto y dificultan la auditoría."},{"id":58,"domain":5,"task":"5.1","type":"mc","stem":"Un equipo necesita descubrir si los buckets de Amazon S3 que alimentan un flujo de RAG contienen información de identificación personal. ¿Qué servicio debería usar?","options":["Amazon Macie.","Amazon Polly.","AWS Config.","Amazon Lex."],"answers":[0],"explain":"Amazon Macie usa coincidencia de patrones y aprendizaje automático para descubrir y clasificar datos sensibles, como la información de identificación personal, en Amazon S3. AWS Config supervisa el cumplimiento de la configuración de los recursos, no el contenido de los datos."},{"id":59,"domain":5,"task":"5.1","type":"mc","stem":"¿Qué combinación describe correctamente la protección de los datos de un sistema de IA en reposo y en tránsito?","options":["Usar claves de AWS KMS para cifrar los datos almacenados y TLS para cifrar los datos en tránsito.","Usar TLS para los datos almacenados y AWS KMS para los datos en tránsito.","Usar Amazon CloudFront tanto para los datos almacenados como para los datos en tránsito.","Usar solo políticas de IAM, sin cifrado."],"answers":[0],"explain":"AWS KMS administra las claves para el cifrado en reposo, mientras que TLS protege los datos en tránsito. IAM controla el acceso pero no cifra los datos, y el almacenamiento en caché de una red de entrega de contenido no tiene relación con el cifrado."},{"id":60,"domain":5,"task":"5.1","type":"mc","stem":"Una auditoría requiere un registro de cada llamada a la API de Amazon Bedrock, incluido qué principal hizo la solicitud y cuándo. ¿Qué servicio proporciona esto?","options":["AWS CloudTrail.","AWS Trusted Advisor.","Amazon Comprehend.","AWS Artifact."],"answers":[0],"explain":"AWS CloudTrail registra la actividad de las API con la identidad, la marca de tiempo y los detalles de la solicitud, lo que respalda las pistas de auditoría y las investigaciones. AWS Artifact proporciona informes de cumplimiento y AWS Trusted Advisor entrega recomendaciones."},{"id":61,"domain":5,"task":"5.1","type":"mc","stem":"Los agentes que se ejecutan en producción deben autenticarse ante herramientas externas y recursos de AWS sin usar credenciales de larga duración incrustadas en el código. ¿Qué capacidad resuelve esto?","options":["Amazon Bedrock AgentCore Identity.","Los tableros de Amazon CloudWatch.","Amazon Textract.","AWS Budgets."],"answers":[0],"explain":"Amazon Bedrock AgentCore Identity proporciona gestión de identidades y credenciales diseñada para agentes y cargas de trabajo automatizadas, de modo que los agentes obtienen credenciales de alcance limitado y corta duración en lugar de secretos codificados."},{"id":62,"domain":5,"task":"5.1","type":"mc","stem":"Un equipo de seguridad debe aplicar reglas deterministas sobre las acciones que los agentes pueden realizar, evaluadas en cada solicitud que pasa por una puerta de enlace, sin importar lo que decida el modelo. ¿Qué capacidad debería usar?","options":["Las políticas (Policy) en Amazon Bedrock AgentCore.","Una configuración de temperatura más alta.","El versionado de Amazon Bedrock Prompt Management.","Amazon Personalize."],"answers":[0],"explain":"Las políticas en Amazon Bedrock AgentCore interceptan el tráfico de los agentes en la puerta de enlace y evalúan cada solicitud contra políticas deterministas administradas de forma centralizada, lo que brinda control independiente del comportamiento del modelo. Las instrucciones en el prompt son orientación, no aplicación de reglas."},{"id":63,"domain":5,"task":"5.1","type":"mc","stem":"Un asistente de cara al cliente debe resistir intentos de extraer datos sensibles mediante entradas manipuladas y no debe devolver contenido inseguro. ¿Qué combinación de controles es más apropiada?","options":["Validación de entradas, barreras de protección (guardrails) y filtrado o validación de la salida antes de devolver la respuesta.","Aumentar la cantidad máxima de tokens de salida del modelo.","Deshabilitar el registro para que los atacantes no puedan leer los registros.","Guardar el prompt de sistema en el repositorio de código fuente de la aplicación."],"answers":[0],"explain":"La defensa en profundidad para aplicaciones generativas combina validación de entradas, aplicación de guardrails y filtrado de la salida. El registro debe permanecer habilitado para la detección, y el prompt de sistema no debe tratarse como un secreto."},{"id":64,"domain":5,"task":"5.2","type":"mr","stem":"¿Qué DOS servicios de AWS ayudan a una organización a demostrar gobernanza y cumplimiento normativo de sus cargas de trabajo de IA? (Selecciona dos.)","options":["AWS CloudTrail","AWS Config","Amazon Polly","Amazon Rekognition","Amazon Bedrock Guardrails"],"answers":[0,1],"explain":"AWS CloudTrail registra quién hizo qué y cuándo, y AWS Config evalúa la configuración de los recursos contra reglas y rastrea los cambios a lo largo del tiempo, lo que respalda las auditorías. Guardrails protege el contenido, pero no aporta evidencia de cumplimiento, y Amazon Polly y Amazon Rekognition no tienen un rol de gobernanza."},{"id":65,"domain":5,"task":"5.2","type":"mc","stem":"¿Qué práctica respalda mejor la gobernanza consistente de un portafolio creciente de casos de uso de IA generativa?","options":["Aplicar un marco y una periodicidad de revisión definidos, asignar responsables y clasificar cada caso de uso por riesgo antes del despliegue.","Aprobar cada caso de uso nuevo por mensaje de chat y sin documentación.","Permitir que cada equipo defina sus propias reglas de retención y registro sin revisión.","Desplegar todos los casos de uso a la vez para acortar el ciclo de revisión."],"answers":[0],"explain":"La gobernanza escala mediante un marco documentado y una periodicidad de revisión, responsabilidades claras y clasificación de cada caso de uso por riesgo. Las aprobaciones improvisadas y las políticas por equipo sin revisión crean brechas que las auditorías detectarán más adelante."}]},{"id":"B","name":"Examen 2 — Comercio, logística y retail","desc":"Tiendas, marketplaces, almacenes, catálogos y reparto de última milla.","questions":[{"id":1,"domain":1,"task":"1.1","type":"mc","stem":"Una cadena de supermercados con 200 tiendas calcula cada noche las previsiones de demanda del día siguiente para todo su catálogo. Los resultados se publican a las 6:00 a. m. y los gerentes los consultan durante la mañana. La empresa quiere minimizar el costo del proceso. ¿Qué tipo de inferencia debe usar?","options":["Inferencia en tiempo real, que responde cada solicitud en milisegundos a medida que llega.","Inferencia asíncrona, que acepta solicitudes grandes y responde cerca del tiempo real.","Inferencia sin servidor, que escala a cero entre solicitudes individuales.","Inferencia por lotes (batch), que procesa el conjunto completo de datos en una ejecución programada."],"answers":[3],"explain":"La inferencia por lotes procesa grandes volúmenes en una sola ejecución programada, que es el patrón nocturno descrito, y evita el costo de mantener un endpoint activo todo el día. La inferencia en tiempo real y la asíncrona están pensadas para solicitudes interactivas o cercanas al tiempo real, y la inferencia sin servidor está orientada a tráfico intermitente por solicitud, no a un cálculo masivo programado."},{"id":2,"domain":1,"task":"1.1","type":"mc","stem":"Un marketplace reúne millones de reseñas escritas por clientes, transcripciones de chats de soporte y fotografías de productos dañados. El equipo debe clasificar estos datos para elegir los servicios de IA adecuados. ¿Cómo se clasifican?","options":["Como datos etiquetados, porque cada registro está asociado a un cliente identificado.","Como series temporales, porque cada registro tiene una fecha de creación.","Como datos no estructurados, porque incluyen texto libre e imágenes que no siguen un esquema tabular fijo.","Como datos estructurados, porque se almacenan en Amazon S3."],"answers":[2],"explain":"La clasificación de los datos depende de su esquema, no del lugar donde se almacenan: el texto libre, las transcripciones y las imágenes son datos no estructurados. Guardarlos en Amazon S3 no los convierte en estructurados, y tener un cliente o una fecha asociada tampoco define un esquema tabular ni una serie temporal."},{"id":3,"domain":1,"task":"1.1","type":"mc","stem":"El equipo de datos de una tienda departamental ajustó un modelo de clasificación durante varias semanas con datos históricos de devoluciones y ahora lo usa para etiquetar las devoluciones que llegan cada día. ¿Cómo se denominan estas dos fases?","options":["Las dos fases son inferencia, porque el modelo ya se usa en producción.","La primera fase es el entrenamiento (training) y la segunda es la inferencia (inference).","La primera fase es la inferencia y la segunda es el entrenamiento.","Las dos fases son entrenamiento, porque el modelo sigue aprendiendo con cada devolución nueva."],"answers":[1],"explain":"El entrenamiento es la fase en la que el algoritmo ajusta los parámetros del modelo con datos históricos, y la inferencia es el uso del modelo ya entrenado para generar predicciones sobre datos nuevos. Etiquetar devoluciones nuevas no actualiza los parámetros del modelo, así que esa actividad no es entrenamiento."},{"id":4,"domain":1,"task":"1.1","type":"mr","stem":"Una empresa de reparto de última milla evalúa cuatro iniciativas para mejorar su operación. ¿Cuáles dos iniciativas corresponden a aprendizaje supervisado? (Selecciona dos.)","options":["Entrenar un agente que aprende a elegir rutas al recibir recompensas por cada entrega a tiempo.","Predecir el tiempo de entrega de un pedido usando entregas históricas en las que se registró el tiempo real como etiqueta.","Clasificar los correos de proveedores en categorías predefinidas usando correos que el equipo administrativo ya etiquetó.","Agrupar rutas de reparto con patrones similares sin usar ninguna etiqueta.","Detectar entregas inusuales sin contar con ejemplos de anomalías etiquetados."],"answers":[1,2],"explain":"El aprendizaje supervisado necesita ejemplos con la respuesta correcta conocida: el tiempo real de entrega o la categoría asignada por el equipo funcionan como etiquetas que el modelo aprende a predecir. El agrupamiento y la detección de anomalías sin etiquetas pertenecen al aprendizaje no supervisado, y el aprendizaje por refuerzo (reinforcement learning) aprende por recompensas y no por etiquetas."},{"id":5,"domain":1,"task":"1.2","type":"mc","stem":"El área de compras de un supermercado debe decidir si aprueba órdenes de compra. La política interna es fija: toda orden mayor a 10 000 USD requiere la firma del gerente regional, sin excepciones, y no existen datos históricos que sugieran patrones adicionales. ¿Cuál es la recomendación más adecuada?","options":["Entrenar un modelo supervisado con las órdenes aprobadas del último año.","Usar un modelo fundacional para decidir si la orden se aprueba o se rechaza.","Aplicar un modelo de agrupamiento para descubrir qué órdenes necesitan firma.","Implementar la regla como lógica determinista, porque una política fija no requiere aprendizaje automático."],"answers":[3],"explain":"El aprendizaje automático aporta valor cuando existe un patrón que aprender a partir de datos; una política fija, sin excepciones y sin datos históricos, se implementa mejor como una regla determinista y auditable. Entrenar un modelo o usar un modelo fundacional añadiría costo, latencia y variabilidad sin mejorar el criterio de negocio."},{"id":6,"domain":1,"task":"1.2","type":"mc","stem":"Un marketplace quiere prever el monto de ventas de cada día de la próxima semana para planear su presupuesto de reparto. Cuenta con tres años de ventas diarias registradas con su valor real. ¿Qué técnica corresponde?","options":["Un modelo de agrupamiento, porque agrupa los días con volúmenes de venta parecidos.","Un agente de aprendizaje por refuerzo (reinforcement learning), porque optimiza decisiones de inventario.","Un modelo de regresión, porque la salida esperada es un valor numérico continuo.","Un modelo de clasificación, porque cada día se puede etiquetar como de ventas altas o bajas."],"answers":[2],"explain":"La regresión predice valores numéricos continuos, como el monto de ventas de un día. La clasificación devolvería una categoría (ventas altas o bajas) en lugar del monto, el agrupamiento genera grupos sin usar el valor objetivo y el aprendizaje por refuerzo aprende por recompensas, sin entregar una estimación numérica."},{"id":7,"domain":1,"task":"1.2","type":"mc","stem":"Un operador logístico recibe facturas de proveedores en PDF con formatos distintos y necesita extraer automáticamente el número de factura, la fecha y los totales para alimentar su sistema de cuentas por pagar. ¿Qué servicio de AWS es el más adecuado?","options":["AWS Glue DataBrew, porque limpia y prepara archivos de datos tabulares.","Amazon Textract, porque extrae texto, formularios y tablas de los documentos.","Amazon Comprehend, porque detecta entidades como fechas y montos en el texto.","Amazon Rekognition, porque analiza el contenido visual de las imágenes."],"answers":[1],"explain":"Amazon Textract está diseñado para extraer contenido estructurado (texto, formularios y tablas) de documentos, incluso escaneados, que es lo que se necesita para leer facturas de formatos distintos. Amazon Comprehend analiza texto que ya está en formato digital y no extrae contenido de documentos, Rekognition trabaja con reconocimiento de imágenes y DataBrew con datos tabulares."},{"id":8,"domain":1,"task":"1.2","type":"mc","stem":"Un equipo de atención al cliente quiere un asistente que redacte respuestas a quejas complejas, resuma el historial del pedido y adapte el tono al cliente, pero no cuenta con datos etiquetados propios ni tiene tiempo de recolectarlos. ¿Qué enfoque encaja mejor?","options":["Usar un modelo fundacional, porque realiza tareas variadas de lenguaje natural sin entrenamiento específico.","Entrenar desde cero un modelo de clasificación con las quejas históricas.","Entrenar un modelo de regresión que prediga la satisfacción del cliente.","Aplicar un modelo de agrupamiento a los textos de las quejas para redactar respuestas."],"answers":[0],"explain":"Los modelos fundacionales se adaptan a tareas de lenguaje natural (redactar, resumir, cambiar el tono) mediante instrucciones, sin necesidad de un conjunto de datos etiquetado propio. Entrenar un clasificador desde cero requeriría justamente los datos etiquetados que no existen, y ni la regresión ni el agrupamiento generan texto de respuesta."},{"id":9,"domain":1,"task":"1.2","type":"mc","stem":"Una tienda en línea con un catálogo amplio quiere mostrar recomendaciones personalizadas a cada visitante en la página de inicio, aprovechando su historial de compras y de clics. ¿Qué servicio de AWS debe usar?","options":["Amazon Lex, porque entiende las solicitudes de los visitantes en el chat.","Amazon Translate, porque adapta el catálogo al idioma de cada visitante.","AWS Glue, porque prepara los datos de clics para el análisis.","Amazon Personalize, porque genera recomendaciones a partir de la actividad de los usuarios."],"answers":[3],"explain":"Amazon Personalize genera recomendaciones personalizadas, como los productos que un cliente probablemente compre, a partir de datos históricos de interacciones. Amazon Lex construye asistentes conversacionales, Amazon Translate traduce texto y AWS Glue prepara y cataloga datos; ninguno produce recomendaciones por sí mismo."},{"id":10,"domain":1,"task":"1.3","type":"mc","stem":"Antes de entrenar un modelo, un equipo de logística debe combinar archivos de ventas y de entregas de varias fuentes, eliminar duplicados y registrar el resultado en un catálogo para que otras áreas lo descubran. ¿Qué servicio de AWS cubre esta etapa del ciclo de vida?","options":["Amazon SageMaker AI, porque entrena y despliega los modelos.","Amazon Bedrock, porque invoca modelos fundacionales por API.","AWS Glue, porque ejecuta trabajos de transformación de datos y mantiene el catálogo de datos.","Amazon Redshift, porque almacena y analiza datos ya preparados."],"answers":[2],"explain":"AWS Glue cubre la etapa de preparación: ejecuta trabajos de extracción, transformación y carga, y publica los conjuntos de datos en el catálogo de datos. Amazon Redshift analiza datos que ya están preparados, mientras que SageMaker AI y Amazon Bedrock corresponden a las etapas de entrenamiento, despliegue e inferencia."},{"id":11,"domain":1,"task":"1.3","type":"mc","stem":"El equipo de datos de un supermercado reporta que su modelo de previsión tiene un error promedio bajo, pero la dirección quiere saber si el proyecto se justifica económicamente. ¿Qué métrica debe presentar el equipo?","options":["El error absoluto medio del modelo, porque mide la desviación de las predicciones.","El retorno de la inversión (ROI) del proyecto, porque relaciona el beneficio económico con el costo.","La exactitud (accuracy) del modelo, porque mide el porcentaje de aciertos.","La puntuación F1, porque combina precisión y exhaustividad."],"answers":[1],"explain":"Las métricas del modelo (exactitud, F1 o error absoluto medio) describen la calidad técnica de las predicciones, no el beneficio para el negocio. Para justificar la inversión se usan métricas de negocio como el ROI, el costo por pedido o el ahorro logrado."},{"id":12,"domain":1,"task":"1.3","type":"order","stem":"Ordena las etapas del ciclo de vida del modelo de previsión de demanda de una cadena de supermercados, desde el inicio del proyecto hasta la operación continua.","items":["Recopilar los datos históricos de ventas y validar su calidad.","Preparar y transformar los datos para el entrenamiento.","Entrenar el modelo con los datos preparados.","Evaluar el modelo con métricas de error y compararlo con el criterio de aceptación.","Desplegar el modelo y supervisar su desempeño para decidir cuándo reentrenarlo."],"explain":"El ciclo comienza con la recopilación y validación de datos, continúa con la preparación, el entrenamiento y la evaluación del modelo, y termina con el despliegue y la supervisión continua, que alimenta la decisión de reentrenar. Sin la evaluación previa, el despliegue no tendría un criterio de aceptación."},{"id":13,"domain":1,"task":"1.3","type":"match","stem":"Relaciona cada servicio de AWS con la etapa del ciclo de vida de IA/ML que cubre en un proyecto de previsión de demanda.","pairs":[["Amazon S3","Almacenar los conjuntos de datos y los artefactos generados por el modelo"],["Amazon SageMaker AI","Entrenar, ajustar y desplegar modelos en un entorno administrado"],["Amazon Bedrock","Acceder a modelos fundacionales mediante una API administrada"],["Amazon CloudWatch","Supervisar las métricas y los registros de la aplicación de IA en producción"],["AWS Glue DataBrew","Preparar y limpiar datos con una interfaz visual, sin escribir código"]],"explain":"Cada servicio cubre una etapa distinta del ciclo: el almacenamiento de datos y artefactos, el entrenamiento y despliegue de modelos, el acceso a modelos fundacionales, la supervisión en producción y la preparación visual de datos. Confundir SageMaker AI con Bedrock es el error más frecuente: el primero entrena y despliega modelos propios, el segundo ofrece acceso administrado a modelos fundacionales de terceros."},{"id":14,"domain":2,"task":"2.1","type":"mc","stem":"Un marketplace quiere que la búsqueda de su sitio encuentre productos similares aunque el cliente use palabras distintas a las de la ficha del producto, por ejemplo cuando escribe 'sudadera con gorro' en lugar de 'hoodie con capucha'. ¿Qué concepto de IA generativa hace posible esta búsqueda semántica?","options":["El ajuste fino (fine-tuning), que actualiza los pesos del modelo con las búsquedas anteriores.","El truncamiento del prompt al tamaño de la ventana de contexto.","Las incrustaciones (embeddings), que representan el significado del texto como vectores numéricos comparables.","La tokenización, que divide el texto en unidades mínimas para procesarlo y facturarlo."],"answers":[2],"explain":"Las incrustaciones convierten el texto en vectores que capturan su significado, de modo que dos expresiones equivalentes quedan cerca en el espacio vectorial aunque no compartan palabras. La tokenización solo fragmenta el texto, el ajuste fino cambia el comportamiento del modelo y el truncamiento recorta la entrada; ninguno de los tres crea una búsqueda por similitud semántica."},{"id":15,"domain":2,"task":"2.1","type":"mc","stem":"Un equipo de una cadena de ferreterías va a indexar 4 000 manuales de producto de más de 100 páginas cada uno en una base de conocimientos que el modelo consultará en cada pregunta. ¿Por qué es necesario dividir los manuales en fragmentos (chunks)?","options":["Porque los fragmentos se usan para reentrenar el modelo con cada consulta.","Porque en cada consulta se envían solo los fragmentos relevantes y el contenido debe caber en la ventana de contexto.","Porque los modelos fundacionales no pueden procesar documentos que contengan tablas.","Porque dividir el texto reduce el precio por token que cobra el proveedor del modelo."],"answers":[1],"explain":"La ventana de contexto limita cuánto texto recibe el modelo en una invocación; por eso se indexan fragmentos y se recuperan solo los más relevantes para cada pregunta. El precio por token no cambia por dividir el documento, y el contenido recuperado se usa en el prompt, no para reentrenar el modelo."},{"id":16,"domain":2,"task":"2.1","type":"mc","stem":"Una tienda de muebles quiere generar imágenes fotorrealistas de una sala amueblada a partir de una descripción de texto, para mostrarlas en su catálogo antes de fabricar los muebles. ¿Qué tipo de modelo se usa habitualmente para esta tarea?","options":["Un modelo de difusión (diffusion model), que genera la imagen a partir de ruido guiado por la descripción.","Un modelo de incrustaciones, que convierte la descripción en vectores.","Un modelo de regresión, que estima el precio de la sala descrita.","Un clasificador de imágenes, que etiqueta las fotografías existentes."],"answers":[0],"explain":"Los modelos de difusión generan imágenes nuevas al reconstruirlas desde ruido, guiados por el texto de entrada. Los modelos de incrustaciones representan texto como vectores, la regresión estima valores numéricos y los clasificadores etiquetan contenido existente; ninguna de esas opciones produce una imagen nueva."},{"id":17,"domain":2,"task":"2.1","type":"mc","stem":"Un cliente envía desde la aplicación la fotografía del producto dañado junto con la explicación escrita del problema, y el asistente debe analizar ambos elementos para resolver la devolución. ¿Qué característica del modelo se requiere?","options":["Que tenga la ventana de contexto más pequeña posible para reducir el costo.","Que esté entrenado únicamente con texto para evitar interpretaciones ambiguas.","Que use una temperatura alta para producir respuestas más creativas.","Que sea multimodal, capaz de procesar texto e imágenes en la misma solicitud."],"answers":[3],"explain":"Un modelo multimodal acepta más de un tipo de contenido (por ejemplo, texto e imagen) en la misma solicitud, lo que permite evaluar juntos la fotografía y el relato del cliente. Una ventana de contexto menor, un modelo solo de texto o una temperatura alta no aportan la capacidad de interpretar la imagen."},{"id":18,"domain":2,"task":"2.1","type":"mc","stem":"El área financiera de una tienda en línea revisa la factura del servicio de modelos fundacionales y encuentra un cargo calculado según los tokens de entrada y de salida. ¿Qué es un token en este contexto?","options":["Un registro de auditoría que se genera por cada respuesta del modelo.","Un descuento por volumen que se aplica a los clientes recurrentes.","Una unidad de texto, como una palabra o parte de ella, que el modelo procesa y que sirve para medir el consumo.","Una credencial temporal que autoriza cada llamada a la API."],"answers":[2],"explain":"Los modelos fundacionales dividen el texto en tokens (palabras cortas o fragmentos de palabras) y facturan según los tokens de entrada y de salida. Un token no es una credencial de acceso, ni un registro de auditoría, ni un descuento por volumen."},{"id":19,"domain":2,"task":"2.1","type":"mc","stem":"Un asistente de seguimiento de pedidos consulta el inventario y la base de datos de envíos mediante APIs internas y luego usa esos resultados para responder al cliente. ¿Qué capacidad del agente se describe?","options":["La tokenización, que divide la consulta del cliente en unidades de texto.","El uso de herramientas (tool use), que permite al modelo invocar funciones o APIs externas.","El ajuste fino (fine-tuning), que actualiza los pesos del modelo con cada pedido consultado.","La destilación de modelos (model distillation), que transfiere el conocimiento a un modelo menor."],"answers":[1],"explain":"El uso de herramientas permite que el modelo llame funciones o APIs definidas y utilice sus resultados para completar la tarea, en lugar de responder solo con lo aprendido durante el entrenamiento. El ajuste fino y la destilación modifican los pesos del modelo, y la tokenización es un paso previo de procesamiento del texto."},{"id":20,"domain":2,"task":"2.1","type":"mc","stem":"En cada consulta, un equipo debe decidir qué instrucciones del sistema incluir, cuántos ejemplos adjuntar, qué fragmentos recuperados enviar y cómo resumir la conversación previa sin exceder el límite del modelo. ¿Qué práctica describe este trabajo?","options":["La ingeniería de contexto (context engineering), que selecciona y organiza la información que recibe el modelo en cada invocación.","El preentrenamiento del modelo con todo el contenido de la empresa.","La destilación del modelo en una versión más pequeña.","La selección de la región de AWS donde se ejecuta la inferencia."],"answers":[0],"explain":"La ingeniería de contexto decide qué información entra en la ventana de contexto en cada invocación: instrucciones, ejemplos, resultados de recuperación y resumen del historial. El preentrenamiento y la destilación actúan sobre los pesos o el tamaño del modelo, y la región de AWS afecta la latencia y el cumplimiento, no el contenido del prompt."},{"id":21,"domain":2,"task":"2.1","type":"mr","stem":"Una cadena de supermercados diseña un asistente interno con varios agentes: uno consulta el inventario, otro redacta los correos a proveedores y un orquestador coordina el trabajo. ¿Cuáles dos afirmaciones describen correctamente este patrón multiagente? (Selecciona dos.)","options":["El orquestador puede dividir una tarea compleja en subtareas y combinar los resultados de los agentes.","El patrón elimina la necesidad de supervisar las decisiones finales.","El sistema garantiza que no habrá alucinaciones porque hay más de un agente.","Todos los agentes deben compartir exactamente el mismo prompt y las mismas herramientas.","Cada agente puede especializarse en un conjunto acotado de herramientas y responsabilidades."],"answers":[0,4],"explain":"En un patrón multiagente conviene que cada
