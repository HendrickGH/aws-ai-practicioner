agente tenga un alcance y herramientas bien definidos y que un orquestador reparta el trabajo y consolide los resultados. El patrón no elimina la supervisión humana ni garantiza la ausencia de alucinaciones, y obligar a todos los agentes a usar el mismo prompt anularía la especialización."},{"id":22,"domain":2,"task":"2.2","type":"mc","stem":"Un asistente de una tienda en línea informó a un cliente que un producto tenía garantía de por vida, cuando la póliza real cubre un año. El equipo busca el término para describir este comportamiento en el informe del incidente. ¿Cuál es?","options":["Deriva de datos (data drift), porque las políticas cambiaron después del entrenamiento.","Sesgo de selección, porque la muestra de entrenamiento no fue representativa.","Alucinación, porque el modelo generó información incorrecta que no está respaldada por los datos de la empresa.","Sobreajuste (overfitting), porque el modelo memorizó los datos de entrenamiento."],"answers":[2],"explain":"La alucinación es la generación de contenido plausible pero incorrecto o inventado, como una garantía que la empresa no ofrece. El sobreajuste y el sesgo de selección son problemas del entrenamiento, y la deriva de datos describe el cambio en la distribución de los datos de producción, no una afirmación inventada por el modelo."},{"id":23,"domain":2,"task":"2.2","type":"mc","stem":"Dos ejecuciones del mismo prompt, con los mismos parámetros y la misma entrada, devolvieron resúmenes distintos de las reseñas de un producto. ¿Qué característica de los modelos fundacionales explica esta situación?","options":["El cifrado de las respuestas en tránsito.","El no determinismo, porque la generación es probabilística y puede variar entre ejecuciones.","La falta de datos de entrenamiento suficientes sobre ese producto.","El exceso de tokens en la ventana de contexto."],"answers":[1],"explain":"Los modelos generativos eligen el siguiente token según una distribución de probabilidad, así que el mismo prompt puede producir salidas distintas entre ejecuciones; por eso las pruebas y la evaluación deben repetirse. Más datos, la ventana de contexto o el cifrado no cambian el hecho de que la generación es probabilística."},{"id":24,"domain":2,"task":"2.2","type":"mc","stem":"Una empresa de logística procesa contratos con datos personales de clientes y debe garantizar que el contenido no salga de su región ni se use para mejorar modelos de otros. ¿Qué factor de selección del modelo es determinante para cumplir estos requisitos?","options":["Los requisitos de cumplimiento y residencia de datos, porque limitan dónde y cómo se puede procesar la información.","La cantidad de parámetros del modelo, porque un modelo más grande siempre es más seguro.","El tono de las respuestas del modelo, porque debe ser formal.","La longitud de la ventana de contexto, porque debe admitir documentos extensos."],"answers":[0],"explain":"Cuando existen obligaciones legales sobre dónde se procesan los datos y cómo se usan, el cumplimiento y la residencia son criterios que pueden descartar modelos antes de comparar calidad o precio. El tamaño del modelo, el tono y la ventana de contexto son criterios válidos, pero no resuelven la obligación regulatoria del escenario."},{"id":25,"domain":2,"task":"2.2","type":"mc","stem":"El equipo de marketing de un supermercado en línea quiere medir el valor total que un cliente aporta durante toda su relación con la empresa, para decidir cuánto invertir en retenerlo. ¿Qué métrica debe usar?","options":["El ingreso promedio por usuario (ARPU), que mide los ingresos de un periodo determinado.","La tasa de conversión, que mide la proporción de visitantes que compran.","El costo por interacción del asistente virtual.","El valor de vida del cliente (CLV), que estima los ingresos que generará el cliente a lo largo de la relación."],"answers":[3],"explain":"El CLV proyecta el valor económico de un cliente a lo largo de toda la relación, que es lo que se necesita para decidir cuánto invertir en retenerlo. El ARPU mide los ingresos de un periodo, la tasa de conversión mide la efectividad de una visita y el costo por interacción es una métrica de eficiencia del canal."},{"id":26,"domain":2,"task":"2.3","type":"mc","stem":"Una cadena de tiendas quiere usar modelos fundacionales de distintos proveedores mediante una sola API, sin administrar servidores ni infraestructura de machine learning, y con la opción de evaluar varios modelos. ¿Qué servicio de AWS debe usar?","options":["AWS Glue, que prepara los datos que consumen los modelos.","Amazon Comprehend, que ofrece análisis de texto preentrenado.","Amazon Bedrock, que ofrece acceso por API a modelos fundacionales de varios proveedores de forma administrada.","Amazon SageMaker JumpStart, que permite desplegar modelos en la propia cuenta y administrar los recursos de inferencia."],"answers":[2],"explain":"Amazon Bedrock proporciona acceso administrado por API a modelos fundacionales de varios proveedores, sin que el equipo administre la infraestructura de inferencia. Con SageMaker JumpStart el modelo se despliega en la cuenta del cliente y el equipo es responsable de la configuración y la capacidad; Glue y Comprehend no dan acceso general a modelos fundacionales de distintos proveedores."},{"id":27,"domain":2,"task":"2.3","type":"mc","stem":"Un marketplace quiere llevar a producción un asistente con agentes que necesitan memoria entre sesiones, identidad propia para llamar a sistemas internos y aislamiento por usuario. ¿Qué servicio de AWS está pensado para estas necesidades en agentes?","options":["Amazon Lex, que crea flujos conversacionales con intenciones y respuestas.","Amazon Bedrock AgentCore, que proporciona capacidades como identidad, memoria y aislamiento de sesiones para agentes.","Strands Agents, que es un marco de trabajo para escribir el código del agente.","Amazon Comprehend, que extrae entidades del texto de los mensajes."],"answers":[1],"explain":"Amazon Bedrock AgentCore reúne capacidades para operar agentes en producción, incluidas identidad, memoria y aislamiento de sesiones. Strands Agents es un marco para desarrollar el agente, y ni Comprehend ni Lex ofrecen esas capacidades de operación: Lex construye flujos conversacionales y Comprehend analiza texto."},{"id":28,"domain":2,"task":"2.3","type":"mc","stem":"Una cadena de supermercados ejecuta un asistente interno con tráfico alto y estable durante todo el día y necesita capacidad garantizada para los modelos de uno de sus proveedores. ¿Qué modalidad de costo debe evaluar en el servicio de modelos fundacionales?","options":["El throughput aprovisionado (provisioned throughput), que reserva capacidad para un modelo y sostiene el tráfico constante.","El pago por token bajo demanda, que cobra solo por el consumo y favorece el tráfico variable.","Las instancias reservadas de Amazon EC2 para el endpoint del modelo.","El almacenamiento de bajo costo en Amazon S3 Glacier para los registros del asistente."],"answers":[0],"explain":"El throughput aprovisionado reserva capacidad para el modelo y es la opción adecuada cuando el tráfico es alto y predecible, porque evita depender de la capacidad compartida bajo demanda. El pago por token conviene con volúmenes variables o bajos; las instancias reservadas de EC2 solo aplican a cargas que el cliente ejecuta en sus propias instancias, y S3 Glacier es almacenamiento de archivos, no capacidad de inferencia."},{"id":29,"domain":2,"task":"2.3","type":"mc","stem":"Un analista de negocio de un marketplace quiere hacer preguntas en lenguaje natural sobre las ventas del trimestre y obtener respuestas y paneles sin escribir consultas ni código. ¿Qué servicio de AWS debe usar?","options":["Kiro, que es un entorno de desarrollo con asistencia de IA para escribir código.","Strands Agents, que es un marco para construir agentes personalizados.","Amazon SageMaker JumpStart, que publica modelos fundacionales listos para desplegar.","Amazon Quick, que permite explorar datos y crear análisis y paneles con lenguaje natural."],"answers":[3],"explain":"Amazon Quick está orientado al análisis de negocio: permite consultar datos con lenguaje natural y compartir paneles con usuarios no técnicos. Kiro es un entorno para desarrolladores, Strands Agents sirve para construir agentes y SageMaker JumpStart es un catálogo de modelos, no una herramienta de análisis de negocio."},{"id":30,"domain":3,"task":"3.1","type":"mc","stem":"Un equipo de catálogo necesita que las descripciones de productos mantengan el mismo tono y la misma estructura en ejecuciones repetidas, con la mínima variación posible. ¿Qué ajuste de inferencia debe aplicar?","options":["Aumentar la longitud máxima de salida para que la respuesta incluya más detalles.","Aumentar la longitud del prompt con el catálogo completo de productos.","Reducir la temperatura para que el modelo elija con mayor frecuencia la opción más probable.","Aumentar la temperatura para que el modelo explore respuestas más diversas."],"answers":[2],"explain":"La temperatura controla la aleatoriedad de la generación: al bajarla, el modelo elige con más frecuencia los tokens más probables y las salidas son más consistentes. Subir la temperatura aumenta la variedad, y ni la longitud de la salida ni la del prompt controlan el grado de variación entre ejecuciones."},{"id":31,"domain":3,"task":"3.1","type":"mc","stem":"Un asistente de atención al cliente responde con políticas de devolución desactualizadas. La empresa quiere que consulte siempre la documentación vigente y cite el documento en el que se basa, sin reentrenar el modelo cada semana. ¿Qué enfoque debe usar?","options":["Incluir el manual completo de políticas en cada prompt.","Generación aumentada por recuperación (RAG) con Amazon Bedrock Knowledge Bases, que recupera documentos actualizados y los incluye en el prompt.","Un ajuste fino (fine-tuning) semanal del modelo con las políticas nuevas.","Subir la temperatura del modelo para que combine mejor la información."],"answers":[1],"explain":"RAG recupera los documentos más relevantes de una base de conocimientos y los envía al modelo en el prompt, así que basta con actualizar el índice para reflejar los cambios y además se pueden citar las fuentes. El ajuste fino exige reentrenar y no garantiza la citación, y enviar el manual completo no cabe en la ventana de contexto ni permite identificar la fuente de cada afirmación."},{"id":32,"domain":3,"task":"3.1","type":"mc","stem":"Un fabricante de electrodomésticos quiere que su asistente responda preguntas que requieren recorrer relaciones de varios saltos entre proveedores, componentes, almacenes y pedidos, y además almacenar las representaciones vectoriales de esos datos. ¿Qué servicio encaja mejor como almacén?","options":["Amazon Neptune, que modela entidades y relaciones en un grafo y admite búsqueda vectorial.","Amazon OpenSearch Service, que indexa vectores de alta dimensión para búsqueda semántica.","Amazon RDS for PostgreSQL, que organiza la información en tablas relacionales.","Amazon S3, que guarda los documentos y sus vectores como objetos."],"answers":[0],"explain":"Amazon Neptune combina un modelo de grafo, que permite recorrer relaciones de varios saltos entre entidades, con capacidad de búsqueda vectorial, que es justo lo que pide el escenario. OpenSearch Service destaca en la búsqueda por similitud, RDS for PostgreSQL organiza los datos en tablas con relaciones definidas de antemano y S3 es almacenamiento de objetos sin capacidades de consulta por sí mismo."},{"id":33,"domain":3,"task":"3.1","type":"mc","stem":"El equipo de comunicación de un marketplace quiere que el modelo redacte correos internos con el formato y el vocabulario de la empresa. Solo dispone de 30 ejemplos aprobados y de un presupuesto limitado; reunir miles de ejemplos etiquetados tomaría meses. ¿Qué enfoque es el más adecuado?","options":["El preentrenamiento de un modelo desde cero con los 30 ejemplos disponibles.","El ajuste fino (fine-tuning) con los 30 ejemplos para que el modelo memorice el formato.","La destilación de modelos (model distillation) con los correos históricos.","El aprendizaje en contexto (in-context learning), incluyendo los ejemplos aprobados en el prompt."],"answers":[3],"explain":"El aprendizaje en contexto obtiene el formato y el vocabulario deseados incluyendo unos pocos ejemplos en el prompt, sin actualizar los pesos del modelo ni reunir miles de ejemplos. El preentrenamiento y la destilación exigen volúmenes de datos y cómputo mucho mayores, y el ajuste fino con 30 ejemplos no basta para que el modelo generalice el estilo."},{"id":34,"domain":3,"task":"3.1","type":"mc","stem":"Una tienda en línea quiere reducir el costo de inferencia de su clasificador de reseñas: el modelo actual es grande y preciso, pero necesita un modelo más pequeño y rápido que conserve un desempeño similar en esa tarea específica. ¿Qué técnica debe aplicar?","options":["Aumento de la temperatura del modelo grande para generar más datos.","Ampliación de la ventana de contexto del modelo grande.","Destilación de modelos (model distillation), en la que un modelo pequeño se entrena para imitar las salidas del modelo grande.","Preentrenamiento desde cero con las reseñas históricas."],"answers":[2],"explain":"La destilación transfiere el comportamiento de un modelo grande a uno más pequeño que aprende a reproducir sus salidas, con lo que se reduce el costo y la latencia manteniendo el desempeño en la tarea. El preentrenamiento desde cero es más costoso, el aumento de temperatura solo introduce variabilidad y la ventana de contexto no reduce el tamaño del modelo."},{"id":35,"domain":3,"task":"3.1","type":"mc","stem":"Un equipo compara dos modelos fundacionales para analizar informes de producto que combinan texto y gráficos de resultados. Un modelo solo admite texto y el otro admite texto e imágenes. ¿Qué criterio de selección determina la elección?","options":["El estilo de las respuestas, porque deben ser formales.","La modalidad, porque las entradas del caso incluyen imágenes además de texto.","El precio por token, porque el modelo que admite imágenes siempre cuesta menos.","La longitud máxima de salida, porque los informes son extensos."],"answers":[1],"explain":"El caso requiere procesar texto y gráficos en la misma solicitud, así que la modalidad del modelo es un criterio eliminatorio: un modelo solo de texto no puede interpretar las imágenes. El precio, la longitud de salida y el estilo son criterios válidos, pero no resuelven la limitación de la modalidad."},{"id":36,"domain":3,"task":"3.1","type":"order","stem":"Ordena, del primero al último, los pasos que sigue el asistente de una cadena de ferretería: comienza cuando el equipo carga el manual técnico de productos en la base de conocimiento y termina cuando el cliente recibe una respuesta sobre garantías y repuestos.","items":["Dividir los documentos de origen en fragmentos (chunks) y generar sus incrustaciones (embeddings).","Almacenar los vectores en un almacén de vectores e indexar los documentos de origen.","Convertir la pregunta del usuario en una incrustación y recuperar los fragmentos más similares.","Enviar al modelo la pregunta junto con los fragmentos recuperados.","Generar la respuesta con las citas de los fragmentos utilizados."],"explain":"El proceso empieza por preparar el conocimiento (fragmentar los documentos y generar incrustaciones), sigue con el almacenamiento e indexación de los vectores, después recupera los fragmentos relevantes para la pregunta, los envía al modelo junto con la consulta y termina generando la respuesta con sus citas."},{"id":37,"domain":3,"task":"3.1","type":"match","stem":"Asocia cada técnica de adaptación de un modelo fundacional con la forma en que actúa sobre el modelo.","pairs":[["Aprendizaje en contexto (in-context learning)","Se incluyen ejemplos e instrucciones en el prompt sin modificar los pesos del modelo"],["Ajuste fino (fine-tuning)","Se actualizan los pesos del modelo con un conjunto de datos del dominio"],["Generación aumentada por recuperación (RAG)","Se incorporan fragmentos recuperados de una base de conocimiento en el prompt"],["Destilación de modelos (model distillation)","Un modelo pequeño se entrena para reproducir el comportamiento de uno más grande"],["Preentrenamiento","Se entrena un modelo desde cero con grandes volúmenes de datos sin etiquetar"]],"explain":"Cada técnica modifica o complementa el modelo en un punto distinto: el aprendizaje en contexto y RAG actúan sobre el prompt, el ajuste fino y el preentrenamiento sobre los pesos, y la destilación sobre el tamaño del modelo que se pone en producción. La diferencia clave entre RAG y el ajuste fino es que RAG no toca los pesos: solo cambia lo que el modelo ve en cada consulta."},{"id":38,"domain":3,"task":"3.2","type":"mc","stem":"El asistente de una tienda de electrodomésticos clasifica las solicitudes de soporte, pero devuelve el resultado como párrafo cuando la aplicación espera un formato específico. Al agregar al prompt tres ejemplos de solicitud con el formato deseado, el problema desaparece. ¿Qué técnica se aplicó?","options":["Ajuste fino (fine-tuning), porque se actualizaron los pesos con tres ejemplos.","Destilación de modelos (model distillation), porque se copió el estilo de otro modelo.","Aprendizaje con pocos ejemplos (few-shot), porque se incluyen ejemplos del resultado esperado en el prompt.","Cadena de pensamiento (chain-of-thought), porque el modelo razona paso a paso."],"answers":[2],"explain":"El aprendizaje con pocos ejemplos (few-shot) muestra al modelo ejemplos de entrada y salida esperadas dentro del prompt, sin reentrenar, y es la forma habitual de fijar un formato. La cadena de pensamiento mejora el razonamiento en tareas de varios pasos, y ni el ajuste fino ni la destilación se realizan con tres ejemplos escritos en el prompt."},{"id":39,"domain":3,"task":"3.2","type":"mc","stem":"El asistente de un comercio electrónico calcula descuentos acumulables y comete errores de aritmética cuando responde de inmediato. Al pedirle que muestre el razonamiento paso a paso antes de dar el total, la exactitud mejora. ¿Qué técnica describe esta mejora?","options":["Aumento de la temperatura para explorar más caminos de solución.","Cadena de pensamiento (chain-of-thought), que guía al modelo a resolver el problema por pasos intermedios.","Instrucciones negativas, que indican lo que el modelo no debe hacer.","Plantillas de prompt, que estandarizan el formato de la respuesta."],"answers":[1],"explain":"La cadena de pensamiento solicita pasos intermedios explícitos, lo que mejora el desempeño en tareas de razonamiento y cálculo. Las instrucciones negativas y las plantillas ordenan el contenido o el formato, pero no guían el razonamiento aritmético, y subir la temperatura añade variación en lugar de precisión."},{"id":40,"domain":3,"task":"3.2","type":"mc","stem":"Un cliente del chat de una tienda en línea logró que el asistente le mostrara el texto completo del prompt del sistema, que contiene la lógica de negocio y las reglas internas. ¿Qué riesgo de la ingeniería de prompts se materializó?","options":["La exposición del prompt, que revela a terceros las instrucciones internas.","El envenenamiento de datos, porque se alteraron los datos de entrenamiento.","El sobreajuste del modelo a las preguntas frecuentes.","La deriva de datos, porque cambió la distribución de las consultas."],"answers":[0],"explain":"La exposición del prompt ocurre cuando el usuario consigue que el modelo revele la plantilla o las instrucciones internas, que suelen considerarse propiedad intelectual y pueden facilitar otros abusos. El envenenamiento actúa sobre los datos o el contenido que alimenta al modelo, el sobreajuste es un problema de entrenamiento y la deriva de datos describe un cambio en la distribución de las entradas."},{"id":41,"domain":3,"task":"3.2","type":"mc","stem":"La dirección de una tienda en línea exige que el asistente nunca ofrezca descuentos ni prometa fechas exactas de entrega, porque esas decisiones dependen de otras áreas. ¿Qué elemento de la ingeniería de prompts debe incluir el equipo?","options":["Una temperatura más alta para que el modelo evite esos temas por sí solo.","Una ventana de contexto más grande para incluir el reglamento completo.","Ejemplos de descuentos aplicados por otros equipos.","Instrucciones negativas que indiquen explícitamente lo que el modelo no debe hacer ni prometer."],"answers":[3],"explain":"Las instrucciones negativas señalan de forma explícita los comportamientos prohibidos, como no ofrecer descuentos ni comprometer fechas, y se combinan con la validación de las salidas. Subir la temperatura no restringe temas, ampliar el contexto no prohíbe nada por sí mismo e incluir ejemplos de descuentos reforzaría justamente el comportamiento que se quiere evitar."},{"id":42,"domain":3,"task":"3.2","type":"mc","stem":"El equipo de un marketplace mantiene más de 40 prompts en producción y necesita comparar versiones, revertir cambios que degradan la calidad y publicar una versión aprobada sin editar los prompts a mano en el código. ¿Qué debe usar?","options":["AWS Config, que registra los cambios de configuración de los recursos.","Amazon SageMaker Model Cards, que documentan el uso previsto del modelo.","Amazon Bedrock Prompt Management, que permite crear, versionar y comparar prompts de forma centralizada.","Amazon CloudWatch, que reúne los prompts en paneles de métricas."],"answers":[2],"explain":"Amazon Bedrock Prompt Management ofrece un repositorio central para crear, versionar y comparar prompts, de modo que se puede volver a una versión estable sin tocar el código de la aplicación. CloudWatch y AWS Config supervisan métricas y configuraciones de recursos, y las Model Cards documentan modelos, no plantillas de prompts."},{"id":43,"domain":3,"task":"3.2","type":"mr","stem":"Una tienda departamental está por publicar un asistente que responde preguntas sobre pedidos y políticas. ¿Cuáles dos prácticas reducen el riesgo de que el asistente revele información interna o acepte instrucciones maliciosas? (Selecciona dos.)","options":["Aumentar la temperatura para que el modelo responda de formas distintas ante intentos de manipulación.","Confiar en que el modelo rechazará por sí solo cualquier intento de manipulación.","Definir en el prompt del sistema límites explícitos sobre los temas y las acciones permitidas.","Validar y filtrar tanto la entrada del usuario como el contenido recuperado antes de enviarlos al modelo.","Publicar el prompt del sistema en el centro de ayuda para que los clientes lo conozcan."],"answers":[2,3],"explain":"La defensa en profundidad combina instrucciones claras en el prompt del sistema con la validación del contenido que entra y sale del modelo, incluidos los documentos recuperados, que podrían contener instrucciones ocultas. Publicar el prompt, confiar solo en el modelo o aumentar la temperatura no son controles de seguridad y pueden empeorar el riesgo."},{"id":44,"domain":3,"task":"3.3","type":"mc","stem":"Una empresa de logística quiere que las respuestas de su asistente se alineen con las preferencias de los agentes humanos, que comparan pares de respuestas y señalan cuál es mejor. ¿Qué técnica de entrenamiento describe este enfoque?","options":["El aprendizaje por refuerzo con retroalimentación humana (RLHF), que usa las preferencias humanas como señal de recompensa.","El preentrenamiento continuo con los documentos internos de la empresa.","La destilación de modelos en una versión más pequeña.","La generación aumentada por recuperación (RAG) con la base de conocimientos."],"answers":[0],"explain":"RLHF parte de un modelo ya ajustado y lo optimiza con una señal de recompensa construida a partir de las preferencias de personas que comparan respuestas. El preentrenamiento continuo añade conocimiento, la destilación reduce el tamaño del modelo y RAG solo aporta contexto en el prompt; ninguno aprende de preferencias humanas."},{"id":45,"domain":3,"task":"3.4","type":"mc","stem":"El equipo de contenido de un marketplace genera resúmenes automáticos de reseñas y quiere medir de forma automática qué tan parecidos son a resúmenes de referencia escritos por editores. ¿Qué métrica es la más adecuada?","options":["La exactitud (accuracy), que mide el porcentaje de clasificaciones correctas.","El error absoluto medio, que mide la desviación promedio de un valor numérico.","El número de tokens de salida, que mide la longitud del resumen.","ROUGE, que compara el resumen generado con el de referencia según la coincidencia de fragmentos de texto."],"answers":[3],"explain":"ROUGE compara un texto generado con uno o varios textos de referencia para evaluar resúmenes, considerando la coincidencia de n-gramos y secuencias. La exactitud y el error absoluto medio corresponden a clasificación y regresión, y contar tokens solo mide la longitud, no la calidad del contenido."},{"id":46,"domain":3,"task":"3.4","type":"mc","stem":"Un equipo debe comparar cuatro modelos fundacionales con sus propios datos de preguntas y respuestas, y además aplicar evaluaciones automáticas administradas por AWS, antes de elegir el modelo del asistente. ¿Qué servicio le permite hacerlo?","options":["AWS Trusted Advisor, que revisa la cuenta frente a las buenas prácticas.","Amazon Inspector, que detecta vulnerabilidades en las cargas de trabajo.","Amazon Bedrock Model Evaluations, que permite evaluar y comparar modelos con datos propios o con evaluaciones administradas.","Amazon SageMaker Model Cards, que documentan el propósito y las limitaciones de un modelo."],"answers":[2],"explain":"Bedrock Model Evaluations permite ejecutar evaluaciones automáticas o con datos propios para comparar modelos antes de decidir cuál se usa en producción. Las Model Cards son documentación, Trusted Advisor revisa la configuración general de la cuenta e Inspector busca vulnerabilidades; ninguna de las tres compara modelos con los datos del cliente."},{"id":47,"domain":3,"task":"3.4","type":"mc","stem":"El equipo de experiencia del cliente quiere medir si los clientes logran resolver su trámite completo con el asistente virtual sin escalar a un agente humano. ¿Qué métrica corresponde a este objetivo de negocio?","options":["El número de parámetros del modelo desplegado.","La tasa de finalización de tareas (task completion rate), que mide la proporción de casos resueltos con el asistente.","La puntuación ROUGE de los resúmenes del asistente.","La latencia de la primera respuesta del modelo."],"answers":[1],"explain":"La tasa de finalización de tareas mide si el usuario consigue completar su objetivo con la aplicación de IA, que es el criterio de alineación con el negocio en este escenario. ROUGE evalúa resúmenes, la latencia mide velocidad y el número de parámetros describe el modelo, no el resultado para el cliente."},{"id":48,"domain":4,"task":"4.1","type":"mc","stem":"El modelo de previsión de demanda de una cadena de supermercados acierta casi a la perfección con los datos históricos de los últimos tres años, pero sus predicciones para las semanas nuevas tienen errores muy grandes. ¿Qué problema describe esta situación?","options":["Sobreajuste (overfitting), porque el modelo se ajustó al ruido de los datos de entrenamiento y no generaliza.","Subajuste (underfitting), porque el modelo no capturó la relación entre las variables.","Sesgo de etiquetado, porque las etiquetas históricas son incorrectas.","Falta de datos no estructurados en el entrenamiento."],"answers":[0],"explain":"El sobreajuste aparece cuando el modelo memoriza los detalles y el ruido del conjunto de entrenamiento y pierde capacidad de generalizar a datos nuevos, que es exactamente el síntoma descrito. El subajuste produciría errores grandes tanto en el entrenamiento como en producción, y no hay evidencia de etiquetas mal asignadas ni de que falten datos no estructurados."},{"id":49,"domain":4,"task":"4.1","type":"mc","stem":"Una cadena de tiendas sospecha que su modelo de priorización de entregas funciona peor en zonas rurales que en zonas urbanas, aunque las etiquetas de entrenamiento ya fueron verificadas y se consideran correctas. ¿Qué técnica permite confirmarlo?","options":["El análisis de la calidad de las etiquetas de entrenamiento.","Una auditoría de los roles de IAM que usan los sistemas de entrega.","Una prueba A/B del color de los botones en la aplicación de reparto.","El análisis por subgrupos, que compara las métricas de desempeño del modelo entre los distintos segmentos de clientes."],"answers":[3],"explain":"El análisis por subgrupos mide el desempeño del modelo separado por segmentos (por ejemplo, urbano y rural) y es la forma de detectar un trato desigual entre grupos. La revisión de etiquetas se descarta porque el enunciado indica que ya se verificaron, y ni los permisos de IAM ni una prueba de la interfaz miden la equidad del modelo."},{"id":50,"domain":4,"task":"4.1","type":"mc","stem":"Una tienda en línea necesita que su asistente no hable de temas ajenos a la empresa, no use lenguaje ofensivo y no muestre datos personales en las respuestas, sin cambiar el modelo fundacional ni reentrenarlo. ¿Qué debe implementar?","options":["AWS Secrets Manager, que protege las credenciales de la aplicación.","AWS KMS, que administra las claves de cifrado.","Amazon Bedrock Guardrails, que aplica filtros y políticas sobre las entradas y las salidas del modelo.","Amazon Macie, que descubre datos sensibles almacenados en Amazon S3."],"answers":[2],"explain":"Bedrock Guardrails evalúa las solicitudes y las respuestas con políticas de contenido, temas denegados y filtros de información sensible, sin modificar el modelo. Macie descubre datos sensibles almacenados pero no filtra conversaciones, Secrets Manager guarda credenciales y KMS administra claves de cifrado."},{"id":51,"domain":4,"task":"4.1","type":"mc","stem":"Un marketplace publica descripciones de producto generadas por IA y el área legal quiere reducir el riesgo de infringir derechos de autor de terceros. ¿Qué medida es la más adecuada?","options":["Reducir la longitud máxima de salida de las descripciones.","Revisar las condiciones de uso del modelo y del contenido con el que se entrenó, y mantener una revisión humana antes de publicar.","Aumentar la temperatura para que el texto generado sea siempre distinto.","Registrar los prompts en AWS CloudTrail para demostrar que el texto es original."],"answers":[1],"explain":"El riesgo de infracción de propiedad intelectual se gestiona entendiendo el origen y las licencias del modelo y de sus datos, y con un proceso de revisión humana antes de publicar. La temperatura, el registro de prompts y la longitud de salida no determinan la originalidad ni el derecho de uso del contenido."},{"id":52,"domain":4,"task":"4.1","type":"mr","stem":"Un equipo entrena un modelo que prioriza pedidos para reparto y quiere reducir el riesgo de que perjudique a ciertos grupos de clientes. ¿Cuáles dos acciones ayudan a lograrlo? (Selecciona dos.)","options":["Eliminar los registros de los grupos minoritarios para que el modelo no los distinga.","Aumentar la temperatura del modelo para diversificar las decisiones.","Reducir el tamaño del conjunto de datos para simplificar el modelo.","Revisar que el conjunto de datos de entrenamiento represente de forma balanceada a todos los segmentos de clientes.","Realizar auditorías humanas periódicas de las decisiones del modelo y de sus resultados."],"answers":[3,4],"explain":"El sesgo se combate cuidando la representatividad y el balance del conjunto de datos y con auditorías humanas que detecten efectos no previstos en grupos específicos. Eliminar registros de grupos minoritarios agrava el sesgo, y ni la temperatura ni reducir el volumen de datos mejoran la equidad del modelo."},{"id":53,"domain":4,"task":"4.2","type":"mc","stem":"Un auditor pregunta a una cadena de supermercados por qué el modelo rechazó la solicitud de crédito de un proveedor pequeño. El equipo debe explicar la decisión con reglas comprensibles. ¿Qué característica del modelo facilita esta explicación?","options":["Que sea un modelo de caja negra con muchos parámetros internos.","Que tenga una ventana de contexto amplia para incluir más variables.","Que se ejecute en varias regiones de AWS para mayor disponibilidad.","Que sea un modelo transparente, cuyas decisiones se pueden entender y explicar a partir de sus variables de entrada."],"answers":[3],"explain":"Los modelos transparentes permiten rastrear cómo influyen las variables de entrada en la decisión, lo que facilita explicarla ante un auditor o un cliente; los modelos de caja negra son más difíciles de interpretar, aunque tengan buen desempeño. La ventana de contexto y la distribución regional afectan la operación, no la explicabilidad."},{"id":54,"domain":4,"task":"4.2","type":"mc","stem":"Una tienda departamental necesita documentar, para su auditoría interna, el propósito previsto del modelo de previsión de demanda, sus limitaciones, los datos con los que se entrenó y sus métricas de desempeño. ¿Qué herramienta debe usar?","options":["Amazon CloudWatch, que recopila métricas y registros de las aplicaciones.","AWS Well-Architected Tool, que revisa la carga de trabajo frente a buenas prácticas.","Amazon SageMaker Model Cards, que documentan el uso previsto, las limitaciones y el desempeño de un modelo.","AWS Artifact, que proporciona los informes de cumplimiento y las certificaciones de AWS."],"answers":[2],"explain":"Las Model Cards de SageMaker AI reúnen la documentación de gobierno de un modelo: propósito, datos de entrenamiento, métricas y limitaciones conocidas. AWS Artifact contiene los informes de cumplimiento de AWS (no del modelo del cliente), CloudWatch supervisa métricas operativas y Well-Architected Tool evalúa la arquitectura de la carga de trabajo."},{"id":55,"domain":4,"task":"4.2","type":"mc","stem":"Una empresa decide no publicar los detalles internos de su modelo antifraude para dificultar que los atacantes lo evadan, pero eso reduce su capacidad de explicar las decisiones a los clientes afectados. ¿Qué tensión describe esta situación?","options":["El equilibrio entre la residencia de datos y la disponibilidad regional.","El equilibrio entre la seguridad del modelo y la transparencia necesaria para la confianza de los usuarios.","El equilibrio entre el costo por token y la latencia de las respuestas.","El equilibrio entre la precisión y la exhaustividad de las predicciones."],"answers":[1],"explain":"Documentar y publicar los detalles internos facilita la explicabilidad, pero también puede dar ventaja a quien quiera evadir el modelo; por eso las organizaciones buscan un punto medio entre seguridad y transparencia. Los otros pares son compromisos reales (costo y latencia, precisión y exhaustividad, residencia y disponibilidad), pero no describen el dilema del escenario."},{"id":56,"domain":4,"task":"4.2","type":"mc","stem":"El laboratorio de datos de una cadena de tiendas quiere inspeccionar y modificar los pesos del modelo, ejecutarlo en su propia infraestructura y publicar sus mejoras. ¿Qué opción debe elegir?","options":["Un modelo de código abierto (open source) cuya licencia permita inspeccionar, modificar y redistribuir el modelo.","Un modelo propietario al que solo se puede acceder mediante la API del proveedor.","Un modelo de caja negra con documentación limitada.","Un servicio administrado que no expone los pesos del modelo."],"answers":[0],"explain":"Solo un modelo de código abierto con una licencia adecuada permite acceder a los pesos, modificarlos y redistribuir versiones derivadas. Los modelos propietarios y los servicios administrados pueden ser excelentes opciones operativas, pero por definición no entregan los pesos ni permiten publicar modificaciones."},{"id":57,"domain":5,"task":"5.1","type":"mc","stem":"El asistente interno de una empresa de logística solo necesita leer una tabla de Amazon DynamoDB con información de inventario y no debe acceder a ningún otro recurso de la cuenta. ¿Qué mecanismo aplica el principio de mínimo privilegio?","options":["Una clave de acceso de usuario raíz almacenada en el código de la aplicación.","Un certificado TLS instalado en el servidor de aplicaciones.","Una política de ciclo de vida en el bucket de Amazon S3 que guarda los registros.","Un rol de IAM con una política que permite únicamente las acciones necesarias sobre esa tabla."],"answers":[3],"explain":"El principio de mínimo privilegio se implementa con roles de IAM cuyas políticas conceden solo las acciones y los recursos necesarios, de modo que el asistente puede leer la tabla y nada más. Usar credenciales de usuario raíz, un certificado TLS o una política de ciclo de vida no limitan los permisos del asistente."},{"id":58,"domain":5,"task":"5.1","type":"mc","stem":"Una cadena de farmacias procesa información de salud de sus clientes y debe garantizar que el tráfico hacia el modelo fundacional no atraviese la internet pública. ¿Qué recurso de AWS debe configurar?","options":["Amazon S3 Glacier, que archiva los datos después del procesamiento.","AWS Artifact, que entrega informes de auditoría a los clientes.","AWS PrivateLink con un endpoint de VPC, para conectarse al servicio de modelos sin usar la internet pública.","Amazon CloudFront, que distribuye el contenido desde ubicaciones cercanas al usuario."],"answers":[2],"explain":"AWS PrivateLink establece una conexión privada entre la VPC y el servicio de modelos, de modo que el tráfico no sale a la internet pública. CloudFront es una red de distribución de contenido, S3 Glacier es almacenamiento de archivo y AWS Artifact es un portal de informes de cumplimiento; ninguno cambia la ruta del tráfico."},{"id":59,"domain":5,"task":"5.1","type":"mc","stem":"Antes de usar un conjunto de datos de clientes almacenado en Amazon S3 para entrenar un modelo, el equipo de seguridad debe descubrir y clasificar los datos personales que contiene. ¿Qué servicio debe usar?","options":["AWS Artifact, que reúne la documentación de cumplimiento que AWS pone a disposición de sus clientes.","Amazon Macie, que descubre y clasifica datos sensibles almacenados en Amazon S3.","Amazon Inspector, que identifica vulnerabilidades en las cargas de trabajo.","AWS Trusted Advisor, que recomienda mejoras de costo, seguridad y rendimiento."],"answers":[1],"explain":"Amazon Macie analiza el contenido de los buckets de Amazon S3 y clasifica datos sensibles como la información personal, que es exactamente la revisión previa solicitada. Inspector busca vulnerabilidades de software, Trusted Advisor ofrece recomendaciones generales de buenas prácticas y AWS Artifact contiene documentación de cumplimiento."},{"id":60,"domain":5,"task":"5.1","type":"mc","stem":"Un equipo quiere que su asistente responda únicamente con información respaldada por los documentos recuperados, que incluya la fuente de cada afirmación y que reconozca cuando no encuentra respaldo. ¿Qué práctica debe aplicar?","options":["Técnicas de fundamentación (grounding) con recuperación de documentos y citación de fuentes.","Aumentar la temperatura para que el modelo combine varias fuentes.","Aplicar destilación al modelo para que conozca mejor el dominio.","Ampliar la longitud máxima de la respuesta en tokens."],"answers":[0],"explain":"La fundamentación ancla las respuestas en el contenido recuperado, exige citar la fuente y permite responder que no hay información suficiente, lo que reduce las alucinaciones. La temperatura, la destilación y la longitud de la respuesta no garantizan que las afirmaciones estén respaldadas."},{"id":61,"domain":5,"task":"5.1","type":"mr","stem":"Un equipo de una tienda en línea diseña un asistente que procesará datos de pedidos y direcciones de clientes. ¿Cuáles tres controles debe implementar para proteger esa información? (Selecciona tres.)","options":["Registrar y auditar las invocaciones del modelo y el acceso a los datos con AWS CloudTrail.","Validar y filtrar las salidas del modelo para evitar que expongan información personal.","Guardar las claves de API directamente en el código de la aplicación.","Otorgar permisos de administrador a todos los usuarios que usan el asistente.","Cifrar los datos en reposo con AWS KMS y en tránsito con TLS."],"answers":[0,1,4],"explain":"El cifrado en reposo y en tránsito protege el contenido, el registro en CloudTrail permite auditar quién accedió a los datos y qué invocaciones se hicieron, y la validación de las salidas evita que la información personal se filtre en las respuestas. Incrustar claves en el código y repartir permisos de administrador aumentan la superficie de riesgo en lugar de reducirla."},{"id":62,"domain":5,"task":"5.2","type":"mc","stem":"Una empresa de logística debe responder el cuestionario de seguridad que le envió un cliente minorista. El cliente exige evidencia de que el proveedor de nube cuenta con certificaciones e informes de auditores independientes. ¿Dónde obtiene la empresa esos documentos de AWS?","options":["En AWS CloudTrail, que registra la actividad de la cuenta del cliente.","En Amazon Inspector, que detecta vulnerabilidades en las cargas de trabajo.","En AWS Artifact, que ofrece acceso a las certificaciones y a los informes de auditoría de AWS.","En AWS Config, que muestra el estado de configuración de los recursos propios."],"answers":[2],"explain":"AWS Artifact es el repositorio de autoservicio de documentos de cumplimiento de AWS, como certificaciones e informes de auditores externos, que las organizaciones usan para responder cuestionarios y auditorías de sus propios clientes. Config y CloudTrail generan evidencia sobre los recursos de la cuenta (configuración y actividad) e Inspector evalúa vulnerabilidades; ninguno entrega certificaciones de AWS."},{"id":63,"domain":5,"task":"5.2","type":"mc","stem":"El equipo de seguridad necesita detectar y alertar cuando alguien modifica la configuración del bucket de Amazon S3 que contiene los datos de entrenamiento, comparándola con el estado esperado y evaluando reglas de cumplimiento. ¿Qué servicio debe usar?","options":["AWS Artifact, que publica los informes de cumplimiento de AWS.","AWS Config, que registra el estado de los recursos y evalúa su cumplimiento respecto de las reglas definidas.","AWS CloudTrail, que registra las llamadas a la API de la cuenta.","Amazon CloudWatch, que centraliza las métricas y los registros de los recursos."],"answers":[1],"explain":"AWS Config mantiene el inventario y el historial de configuración de los recursos y evalúa si cumplen las reglas definidas, lo que permite detectar cambios no autorizados en el bucket. CloudTrail registra quién hizo el cambio, pero no evalúa la configuración deseada; CloudWatch se centra en métricas y registros, y Artifact en informes de AWS."},{"id":64,"domain":5,"task":"5.2","type":"mc","stem":"Un marketplace opera en varios países y debe garantizar que los datos personales de sus clientes se almacenen y procesen solo en la región del país de origen. ¿Qué concepto de gobernanza de datos describe este requisito?","options":["La residencia de datos, que determina en qué ubicación geográfica pueden almacenarse y procesarse los datos.","El linaje de datos, que rastrea el origen y las transformaciones de los datos.","La retención de datos, que define cuánto tiempo se conservan los datos.","La calidad de los datos, que mide su exactitud y su completitud."],"answers":[0],"explain":"La residencia de datos establece dónde pueden almacenarse y procesarse, y se implementa eligiendo las regiones de AWS adecuadas y servicios que no repliquen la información fuera de ellas. El linaje describe el recorrido y las transformaciones de los datos, la retención define por cuánto tiempo se conservan y la calidad se refiere a su exactitud; ninguno de los tres responde a la ubicación geográfica."},{"id":65,"domain":5,"task":"5.2","type":"mc","stem":"Una empresa quiere clasificar sus aplicaciones de IA generativa según el grado de control que tiene sobre el modelo y el nivel de riesgo asociado, para decidir qué controles de seguridad aplicar a cada una. ¿Qué recurso de AWS es el más adecuado para este propósito?","options":["AWS Well-Architected Tool, que revisa una carga de trabajo frente a las buenas prácticas de sus pilares.","AWS Trusted Advisor, que evalúa la cuenta con recomendaciones automáticas.","AWS Artifact, que entrega los informes de cumplimiento de AWS.","La Generative AI Security Scoping Matrix, que ubica cada aplicación según su alcance y ayuda a definir los controles correspondientes."],"answers":[3],"explain":"La Generative AI Security Scoping Matrix clasifica las aplicaciones de IA generativa según el nivel de control sobre el modelo, desde consumir una API ajena hasta entrenar un modelo propio, y ayuda a definir controles proporcionales al riesgo. Well-Architected Tool revisa cargas de trabajo frente a buenas prácticas generales, Trusted Advisor ofrece recomendaciones de cuenta y Artifact entrega informes de AWS."}]},{"id":"C","name":"Examen 3 — Servicios financieros y regulación","desc":"Bancos, aseguradoras, fintech, auditoría, expedientes legales y cumplimiento.","questions":[{"id":1,"domain":1,"task":"1.1","type":"mc","stem":"Un banco capacita a su área de riesgo y quiere aclarar cómo se relacionan la inteligencia artificial (IA), el aprendizaje automático (machine learning) y el aprendizaje profundo (deep learning). ¿Cuál afirmación es correcta?","options":["El aprendizaje automático es una rama de la inteligencia artificial y el aprendizaje profundo es una rama del aprendizaje automático.","El aprendizaje profundo es la base de la inteligencia artificial y el aprendizaje automático es una rama del aprendizaje profundo.","La inteligencia artificial, el aprendizaje automático y el aprendizaje profundo son sinónimos y se usan de forma indistinta.","La inteligencia artificial es una rama del aprendizaje automático que solo trabaja con imágenes."],"answers":[0],"explain":"La IA es el campo general; el aprendizaje automático es una de sus ramas, en la que el sistema aprende patrones a partir de datos, y el aprendizaje profundo es una subrama del aprendizaje automático basada en redes neuronales de varias capas. La opción que invierte la jerarquía es incorrecta, y la que los presenta como sinónimos ignora que el aprendizaje profundo es solo una técnica dentro del aprendizaje automático."},{"id":2,"domain":1,"task":"1.1","type":"mc","stem":"Una aseguradora integra un modelo de detección de fraude y, al explicarlo al equipo de operaciones, se pide distinguir el entrenamiento de la inferencia. ¿Cuál afirmación describe correctamente esa diferencia?","options":["El entrenamiento ajusta los parámetros del modelo con datos históricos; la inferencia aplica el modelo ya entrenado para generar una predicción sobre casos nuevos.","El entrenamiento aplica el modelo a los casos que llegan en producción; la inferencia ajusta los parámetros con datos históricos.","Ambas etapas son equivalentes, porque el modelo vuelve a ajustar sus parámetros en cada predicción.","La única diferencia es el volumen de datos: la inferencia siempre usa más registros que el entrenamiento."],"answers":[0],"explain":"El entrenamiento es la etapa en la que el modelo aprende de datos históricos y ajusta sus parámetros; la inferencia es el uso del modelo ya entrenado para producir predicciones. La opción que intercambia las definiciones es incorrecta, y la que afirma que el modelo se reajusta en cada predicción confunde la inferencia con un nuevo entrenamiento."},{"id":3,"domain":1,"task":"1.1","type":"mc","stem":"Un despacho legal dispone de 8 000 contratos ya clasificados por abogados como «con cláusula de arbitraje» o «sin cláusula de arbitraje», y quiere automatizar esa clasificación en contratos nuevos. ¿Qué tipo de aprendizaje corresponde?","options":["Aprendizaje supervisado (supervised learning), porque existen ejemplos con la respuesta correcta ya asignada.","Aprendizaje no supervisado (unsupervised learning), porque el modelo debe descubrir agrupaciones por sí mismo.","Aprendizaje por refuerzo (reinforcement learning), porque el modelo recibe una recompensa por cada acierto.","Aprendizaje no supervisado, porque el texto de un contrato es un dato no estructurado."],"answers":[0],"explain":"Al existir etiquetas correctas, el problema es de clasificación supervisada. El aprendizaje no supervisado se usa cuando no hay etiquetas ni variable objetivo, el aprendizaje por refuerzo aprende de recompensas por acciones en un entorno, y el hecho de que el dato sea texto no implica que el aprendizaje deba ser no supervisado."},{"id":4,"domain":1,"task":"1.1","type":"mc","stem":"Un banco de inversión recalcula cada noche el riesgo de 500 000 posiciones y publica los resultados a primera hora del día siguiente; ninguna persona los espera en el momento. ¿Qué tipo de inferencia se ajusta mejor a este caso?","options":["Inferencia por lotes (batch inference), porque procesa un volumen alto de registros de forma programada y no requiere respuesta inmediata.","Inferencia en tiempo real, porque cada posición debe evaluarse en el instante en que se consulta.","Inferencia asíncrona, porque cada solicitud individual devuelve un identificador y el cliente espera unos minutos.","Inferencia serverless, porque no se administran servidores para ejecutar el proceso."],"answers":[0],"explain":"La inferencia por lotes está pensada para procesar grandes volúmenes de datos de forma programada, sin requisito de inmediatez. La inferencia asíncrona aplica a solicitudes individuales de larga duración cuyo cliente no puede mantener la conexión, y la serverless describe el modelo de consumo de la infraestructura, no la forma en que se atiende la carga."},{"id":5,"domain":1,"task":"1.2","type":"mc","stem":"El área de cumplimiento de una casa de bolsa debe calcular una comisión con una fórmula fija establecida en el contrato, que no cambia y no depende de patrones ocultos. ¿Por qué NO conviene resolverlo con machine learning?","options":["Porque la regla ya está definida de forma explícita y determinista, así que no hay ningún patrón que el modelo deba aprender de los datos.","Porque el machine learning no puede procesar datos numéricos estructurados.","Porque se necesitarían más registros históricos de los que existen en el mercado financiero.","Porque el machine learning solo funciona con imágenes y texto."],"answers":[0],"explain":"El aprendizaje automático aporta valor cuando hay que inferir patrones que no están codificados en reglas; una fórmula fija se implementa mejor de forma directa. Las opciones que limitan el machine learning a imágenes y texto, o que niegan su capacidad con datos tabulares, son incorrectas: la clasificación y la regresión trabajan precisamente con datos estructurados."},{"id":6,"domain":1,"task":"1.2","type":"mc","stem":"Una aseguradora quiere estimar el monto esperado de la indemnización de cada siniestro reportado, a partir del tipo de póliza, la antigüedad del asegurado y el historial de reclamaciones. ¿Qué técnica es la más adecuada?","options":["Regresión (regression), porque el objetivo es predecir un valor numérico continuo.","Clasificación (classification), porque el modelo debe asignar cada siniestro a una categoría.","Agrupamiento (clustering), porque el modelo organiza los siniestros en grupos de comportamiento similar.","Detección de anomalías, porque el monto de la indemnización es incierto."],"answers":[0],"explain":"Estimar un importe monetario es un problema de regresión, ya que la salida es un número continuo. La clasificación devuelve una clase discreta, el agrupamiento no supervisado no predice un valor etiquetado y la detección de anomalías busca casos atípicos, no un monto esperado."},{"id":7,"domain":1,"task":"1.2","type":"mc","stem":"Una firma de auditoría necesita extraer el texto y los datos de los campos de formularios de expedientes escaneados en papel, incluidos documentos con diseños distintos. ¿Qué servicio de AWS es el más adecuado para esta tarea?","options":["Amazon Textract.","Amazon Transcribe.","Amazon Translate.","Amazon Polly."],"answers":[0],"explain":"Amazon Textract extrae texto, tablas y campos de formularios a partir de documentos e imágenes. Amazon Transcribe convierte audio en texto, Amazon Translate traduce entre idiomas y Amazon Polly convierte texto en voz, por lo que ninguno resuelve la digitalización de expedientes escaneados."},{"id":8,"domain":1,"task":"1.2","type":"mc","stem":"Una fintech quiere clasificar transacciones como fraudulentas o legítimas con sus propios datos históricos etiquetados, que son tabulares y abundantes. El equipo busca el mejor equilibrio entre costo y precisión para esa tarea específica. ¿Qué enfoque conviene evaluar primero?","options":["Un modelo tradicional de machine learning entrenado con los datos etiquetados.","Un modelo fundacional multimodal, porque siempre supera en precisión a los modelos tradicionales.","Un modelo fundacional sin personalización, porque para clasificar no se necesitan datos etiquetados.","Un modelo de difusión, porque genera datos sintéticos que sustituyen al historial real."],"answers":[0],"explain":"Para una tarea acotada con datos tabulares etiquetados, un modelo tradicional suele ser más económico y preciso que un modelo fundacional, que aporta ventajas en tareas amplias o generativas. Un modelo fundacional sin datos de la organización no aprende la etiqueta del caso, y la difusión genera contenido, como imágenes, no clasificaciones de fraude."},{"id":9,"domain":1,"task":"1.2","type":"mr","stem":"Una institución financiera evalúa iniciativas para las que considera usar machine learning. ¿Cuáles DOS casos de uso son apropiados para esta tecnología? (Selecciona dos.)","options":["Estimar la probabilidad de incumplimiento de pago de un solicitante a partir de su historial crediticio.","Detectar patrones inusuales en transacciones de tarjeta para alertar posibles fraudes.","Calcular el interés de un crédito aplicando la tasa fija que indica el contrato.","Imprimir los estados de cuenta con el formato mensual definido por el área de operaciones.","Guardar en el libro contable la fecha y la hora de cada operación registrada."],"answers":[0,1],"explain":"El machine learning se justifica cuando hay que aprender patrones a partir de datos, como estimar un riesgo o detectar comportamientos atípicos. Aplicar una tasa fija es un cálculo determinista, y la impresión de documentos o el registro de operaciones son procesos de operación que no requieren aprendizaje."},{"id":10,"domain":1,"task":"1.3","type":"mc","stem":"El equipo de datos de una aseguradora presenta a la dirección dos tipos de indicadores para un modelo que prioriza reclamaciones: métricas del modelo y métricas del negocio. ¿Cuál de los siguientes es una métrica del NEGOCIO?","options":["El costo promedio por reclamación procesada y el retorno de la inversión (ROI) del proyecto.","El puntaje F1 obtenido en el conjunto de prueba.","La exactitud (accuracy) del modelo en producción.","La exhaustividad (recall) de la clase positiva."],"answers":[0],"explain":"Las métricas del negocio expresan el efecto económico del sistema, como el costo por caso atendido o el ROI. F1, exactitud y exhaustividad describen el desempeño estadístico del modelo y no permiten por sí solas afirmar que el proyecto sea rentable."},{"id":11,"domain":1,"task":"1.3","type":"mc","stem":"Un equipo de auditoría entrena un clasificador para identificar hallazgos materiales en 10 000 expedientes, de los cuales solo 200 son materiales. El modelo alcanza 98 % de exactitud, pero detecta muy pocos hallazgos reales. ¿Cuál es la explicación más probable?","options":["Las clases están muy desbalanceadas y la exactitud refleja sobre todo el acierto en la clase mayoritaria.","La exactitud no puede calcularse en problemas de clasificación, por lo que el valor obtenido no significa nada.","La exactitud de un modelo siempre es menor que su precisión, de modo que el resultado es engañoso por definición.","La exactitud solo es válida para modelos de regresión, no para clasificadores."],"answers":[0],"explain":"Con 200 casos positivos entre 10 000, un modelo que responda casi siempre la clase mayoritaria obtiene una exactitud alta sin detectar los hallazgos relevantes; por eso conviene revisar precisión, exhaustividad y F1 por clase. Las otras opciones son incorrectas porque la exactitud sí se calcula en clasificación y no existe una regla que la obligue a ser menor que la precisión."},{"id":12,"domain":1,"task":"1.3","type":"mc","stem":"Una firma de inversión quiere resumir reportes trimestrales con un modelo fundacional, pero su equipo de tecnología es pequeño y no quiere administrar servidores con GPU. ¿Qué enfoque de despliegue es el más adecuado?","options":["Consumir el modelo como API administrada, de modo que la infraestructura quede a cargo del proveedor del servicio.","Desplegar el modelo en instancias propias con GPU y encargarse del escalado y las actualizaciones.","Entrenar un modelo desde cero con los reportes trimestrales.","Copiar los pesos del modelo en un servidor local sin revisar la licencia."],"answers":[0],"explain":"La API administrada reduce el esfuerzo operativo y es la opción natural cuando el equipo no quiere mantener infraestructura de cómputo. El despliegue propio se justifica por requisitos de control o personalización que aquí no se mencionan, y entrenar desde cero exige muchos más datos y presupuesto que resumir reportes con un modelo ya disponible."},{"id":13,"domain":1,"task":"1.3","type":"order","stem":"Un banco pone en producción un modelo de scoring crediticio. Ordena las etapas del proyecto, desde la primera actividad hasta la última.","items":["Definir el objetivo del negocio y recolectar los datos históricos de solicitudes de crédito.","Limpiar, transformar y etiquetar los datos con el resultado observado de cada solicitud.","Entrenar el modelo con el conjunto de entrenamiento y ajustar sus parámetros.","Evaluar el modelo con el conjunto de prueba y contrastar las métricas con el objetivo del negocio.","Desplegar el modelo y monitorear su desempeño en producción con prácticas de MLOps."],"explain":"El proyecto avanza de la definición del objetivo y la recolección de datos hacia la preparación, el entrenamiento, la evaluación y el despliegue con monitoreo continuo. Etiquetar antes de limpiar los datos, o entrenar antes de evaluar, invertiría etapas y produciría resultados poco confiables."},{"id":14,"domain":2,"task":"2.1","type":"mc","stem":"Un analista de riesgo carga un contrato extenso en un asistente basado en un modelo fundacional y el sistema indica que se superó la ventana de contexto. ¿Qué significa ese aviso?","options":["Que la cantidad de tokens del texto de entrada y de la conversación previa supera lo que el modelo puede procesar en una sola solicitud.","Que el modelo necesita más ejemplos etiquetados para poder responder.","Que el archivo excede el tamaño máximo permitido para guardarlo en Amazon S3.","Que el asistente agotó su cuota mensual de respuestas."],"answers":[0],"explain":"La ventana de contexto es la cantidad máxima de tokens que el modelo puede considerar, e incluye el prompt del sistema, el contexto recuperado, el historial y la salida. Las demás opciones describen límites de entrenamiento, de almacenamiento o de cuota de uso, que no tienen relación con ese aviso."},{"id":15,"domain":2,"task":"2.1","type":"mc","stem":"Un equipo jurídico indexa 40 años de contratos para un asistente de consulta. Antes de generar las incrustaciones (embeddings), divide cada contrato en fragmentos (chunking). ¿Cuál es el propósito principal de esa división?","options":["Obtener unidades más pequeñas y coherentes que puedan recuperarse con precisión y quepan en la ventana de contexto junto con la consulta.","Reducir el texto a cero tokens para que el modelo no consuma presupuesto.","Cifrar cada parte del documento con una clave distinta.","Traducir el contrato automáticamente a varios idiomas."],"answers":[0],"explain":"La fragmentación permite indexar y recuperar solo los pasajes relevantes, en lugar de enviar documentos completos que no caben en la ventana de contexto. La fragmentación no cifra ni traduce el contenido; además, nunca elimina los tokens, solo los organiza en unidades recuperables."},{"id":16,"domain":2,"task":"2.1","type":"mc","stem":"Un banco quiere agrupar automáticamente las reclamaciones de clientes que plantean el mismo problema aunque estén redactadas con palabras distintas. ¿Qué componente permite representar cada texto como un vector numérico comparable por similitud?","options":["Las incrustaciones (embeddings) generadas por un modelo de lenguaje.","El tokenizador, que divide el texto en unidades mínimas.","La temperatura, que controla la variabilidad de las respuestas.","La longitud máxima de salida, que limita la respuesta generada."],"answers":[0],"explain":"Las incrustaciones convierten el texto en vectores que capturan su significado, de modo que los textos con sentido parecido quedan cerca en el espacio vectorial aunque usen otras palabras. El tokenizador solo divide el texto, y la temperatura y la longitud máxima de salida son parámetros de generación que no producen representaciones comparables."},{"id":17,"domain":2,"task":"2.1","type":"mc","stem":"Un ajustador de una aseguradora de automóviles carga las fotografías del vehículo dañado, la descripción escrita del siniestro y el reporte del taller, y pide al asistente un resumen consolidado. ¿Qué tipo de modelo fundacional se necesita?","options":["Un modelo multimodal, capaz de procesar imágenes y texto en la misma solicitud.","Un modelo de difusión, capaz de generar imágenes nuevas a partir de ruido.","Un modelo de regresión, capaz de estimar el valor de la reparación.","Un modelo de clasificación binaria, capaz de marcar el caso como aprobado o rechazado."],"answers":[0],"explain":"Un modelo multimodal acepta más de una modalidad de entrada, en este caso imágenes y texto, y puede resumirlas en una sola respuesta. Un modelo de difusión genera imágenes, uno de regresión estima valores numéricos y uno de clasificación binaria asigna una de dos clases: ninguno produce el resumen solicitado a partir de las dos modalidades."},{"id":18,"domain":2,"task":"2.1","type":"mc","stem":"Los modelos de lenguaje de gran tamaño se construyen sobre la arquitectura transformer. ¿Qué característica de esta arquitectura explica su buen desempeño con textos extensos?","options":["El mecanismo de atención, que relaciona cada parte del texto con las demás partes relevantes de la secuencia.","Un conjunto de reglas gramaticales codificadas por especialistas en lingüística.","El almacenamiento del texto en tablas relacionales dentro del modelo.","La división del texto en vectores de ceros y unos generados al azar."],"answers":[0],"explain":"El mecanismo de atención permite que el modelo pondere la importancia de cada token en función de los demás, lo que le da contexto amplio sin recorrer el texto en un solo sentido. La arquitectura transformer no contiene reglas gramaticales escritas a mano, no usa tablas relacionales y no depende de vectores aleatorios."},{"id":19,"domain":2,"task":"2.1","type":"mc","stem":"Un equipo diseña un asistente de cumplimiento normativo. En cada consulta, además de la instrucción, el sistema incluye las políticas vigentes recuperadas, los resultados de la búsqueda documental y el resumen de la conversación previa, ajustándose siempre al límite de la ventana de contexto. ¿Qué práctica describe este diseño?","options":["Ingeniería de contexto (context engineering), que consiste en seleccionar y organizar la información que se entrega al modelo en cada solicitud.","Preentrenamiento del modelo con las políticas de la organización.","Destilación de modelos (model distillation) a partir de uno mayor.","Inferencia por lotes aplicada a las consultas de los usuarios."],"answers":[0],"explain":"La ingeniería de contexto decide qué información entra en la ventana de contexto y en qué orden, incluido el material recuperado y el historial. El preentrenamiento y la destilación modifican el modelo, no la información de cada solicitud, y la inferencia por lotes describe la forma de procesar solicitudes programadas."},{"id":20,"domain":2,"task":"2.1","type":"mc","stem":"Un asistente para analistas de inversión debe consultar el portafolio del cliente, ejecutar cálculos con esas cifras y luego redactar un resumen, decidiendo por sí mismo el orden de esos pasos según la solicitud. ¿Qué concepto describe mejor este diseño?","options":["Un agente de IA, que planifica pasos, invoca herramientas y mantiene contexto para cumplir un objetivo.","Un clasificador supervisado, que asigna cada solicitud a una categoría predefinida.","Un modelo de difusión, que genera contenido nuevo a partir de ruido.","Un proceso de inferencia por lotes, que atiende solicitudes programadas."],"answers":[0],"explain":"La capacidad de planificar, usar herramientas y conservar contexto para alcanzar un objetivo es propia de los agentes de IA. Un clasificador devuelve una etiqueta, un modelo de difusión genera imágenes y la inferencia por lotes es una forma de procesar grandes volúmenes de datos; ninguna de ellas decide pasos ni ejecuta herramientas."},{"id":21,"domain":2,"task":"2.1","type":"mc","stem":"Una casa de bolsa construye un sistema en el que un agente coordinador reparte el trabajo entre un agente especializado en normativa de inversión y otro especializado en cálculos de rendimiento. ¿Qué patrón de diseño describe esta arquitectura?","options":["Orquestación multiagente, en la que un agente coordinador delega subtareas en agentes especializados.","Ajuste fino supervisado, con ejemplos revisados por especialistas.","Destilación de modelos, que transfiere conocimiento de un modelo mayor a uno menor.","Inferencia asíncrona, que encola solicitudes y las procesa después."],"answers":[0],"explain":"El patrón descrito distribuye el trabajo entre varios agentes con roles distintos y un coordinador que los organiza, lo que corresponde a una arquitectura multiagente. El ajuste fino, la destilación y la inferencia asíncrona son técnicas de entrenamiento o de ejecución del modelo, y no describen la división de tareas entre agentes."},{"id":22,"domain":2,"task":"2.2","type":"mc","stem":"Una fintech compara su chatbot actual, basado en reglas fijas, con un asistente construido sobre un modelo fundacional para atender consultas sobre créditos. ¿Cuál es la ventaja principal del asistente basado en el modelo fundacional?","options":["Puede atender consultas redactadas de formas muy distintas sin que se programen reglas para cada variante.","Garantiza que todas sus respuestas sean factualmente correctas.","Elimina la necesidad de revisar las respuestas antes de publicarlas al cliente.","Consume siempre menos recursos de cómputo que un sistema de reglas."],"answers":[0],"explain":"El modelo fundacional generaliza a formulaciones nuevas sin reglas específicas, algo que un sistema basado en reglas no logra. No garantiza la veracidad de sus respuestas, puede producir errores o inventar información, y su costo de cómputo puede ser mayor que el de un conjunto de reglas."},{"id":23,"domain":2,"task":"2.2","type":"mc","stem":"El comité de riesgos de un banco pide explicar por qué el asistente generativo recomendó rechazar una refinanciación, y el equipo no logra reconstruir el razonamiento que produjo esa salida. ¿Qué limitación de la IA generativa ilustra esta situación?","options":["La dificultad de interpretar cómo el modelo llegó a una salida (interpretabilidad limitada).","La falta de fluidez del texto generado.","El tamaño reducido de la ventana de contexto.","La incapacidad del modelo para procesar lenguaje natural."],"answers":[0],"explain":"Los modelos fundacionales no exponen de forma directa la cadena de razonamiento que produjo una respuesta, lo que dificulta justificar decisiones ante terceros. Los textos generados sí suelen ser fluidos, el problema descrito no depende de la ventana de contexto y estos modelos procesan lenguaje natural por definición."},{"id":24,"domain":2,"task":"2.2","type":"mc","stem":"El área de auditoría interna de un grupo financiero quiere clasificar por tono 30 000 correos por trimestre para priorizar revisiones; el trabajo admite procesarse durante varios días y no hay requisito de respuesta inmediata. ¿Qué criterio de selección del modelo es el más razonable?","options":["Privilegiar un modelo de menor costo con latencia moderada, porque el volumen es alto y no se necesita inmediatez.","Elegir el modelo multimodal más costoso, porque es el más completo en todos los casos.","Elegir el modelo con la ventana de contexto más grande, porque siempre es el más adecuado.","Elegir el modelo con más parámetros, porque el tamaño garantiza el mejor ajuste al caso de uso."],"answers":[0],"explain":"Cuando el trabajo se procesa en lote y no hay presión de tiempo, conviene optimizar el costo y la calidad medida, no la velocidad. La modalidad, el tamaño de la ventana de contexto y el número de parámetros solo aportan valor si el caso de uso los exige; ninguno garantiza por sí solo el mejor resultado."},{"id":25,"domain":2,"task":"2.2","type":"mr","stem":"La dirección de una casa de bolsa quiere justificar la inversión en un asistente generativo para sus asesores. ¿Cuáles DOS indicadores de valor de negocio son los más apropiados para ese informe? (Selecciona dos.)","options":["El retorno de la inversión (ROI) del proyecto.","La tasa de conversión de las oportunidades atendidas por los asesores.","La temperatura configurada en las invocaciones del modelo.","El número de capas de la red neuronal del modelo fundacional.","La cantidad de tokens que tiene el prompt del sistema."],"answers":[0,1],"explain":"Los indicadores de valor de negocio se expresan en resultados como el ROI, la tasa de conversión, el ingreso promedio por usuario o el valor de vida del cliente. La temperatura, la profundidad de la red y el tamaño del prompt describen la configuración del modelo, no el beneficio que obtiene la organización."},{"id":26,"domain":2,"task":"2.3","type":"mc","stem":"Una aseguradora quiere evaluar y usar modelos fundacionales de varios proveedores desde una sola API administrada, sin contratar por separado con cada proveedor. ¿Qué servicio de AWS se ajusta mejor a ese objetivo?","options":["Amazon Bedrock.","Amazon SageMaker JumpStart.","Amazon Comprehend.","Amazon Lex."],"answers":[0],"explain":"Amazon Bedrock ofrece acceso mediante una API unificada a modelos fundacionales de distintos proveedores, además de capacidades para personalizarlos e integrarlos en aplicaciones. SageMaker JumpStart es un catálogo de modelos y recetas que se despliegan dentro de SageMaker AI, y Comprehend y Lex cubren análisis de lenguaje y conversación, no el acceso multiproveedor a modelos fundacionales."},{"id":27,"domain":2,"task":"2.3","type":"mc","stem":"Un equipo de ciencia de datos quiere explorar un catálogo de modelos preentrenados y recetas listas para usar, y desplegarlos dentro de su entorno de Amazon SageMaker AI sin entrenar desde cero. ¿Qué componente de AWS ofrece ese catálogo?","options":["Amazon SageMaker JumpStart.","Amazon Bedrock.","AWS Glue DataBrew.","Amazon Personalize."],"answers":[0],"explain":"SageMaker JumpStart reúne modelos preentrenados y plantillas que se pueden desplegar en el entorno de SageMaker AI del cliente. Bedrock permite invocar modelos fundacionales como servicio administrado, sin desplegarlos en la cuenta del cliente, y DataBrew y Personalize se orientan a la preparación de datos y a las recomendaciones, respectivamente."},{"id":28,"domain":2,"task":"2.3","type":"mc","stem":"Una correduría de seguros atiende un pico de consultas durante la temporada de resultados y un volumen muy bajo el resto del año. ¿Qué enfoque de costo es el más razonable para su asistente sobre Amazon Bedrock?","options":["Pago por uso según los tokens procesados, porque el consumo es irregular.","Throughput aprovisionado (provisioned throughput) durante todo el año, para asegurar capacidad aunque esté ociosa.","Adquirir servidores propios con GPU para todo el año, para no pagar por invocación.","Entrenar un modelo propio para eliminar el costo por invocación."],"answers":[0],"explain":"El pago por uso conviene cuando la demanda es variable, porque se paga solo lo consumido. El throughput aprovisionado tiene sentido con cargas altas y sostenidas que aprovechen la capacidad reservada; comprar hardware propio o entrenar un modelo añade costos fijos y de operación sin relación con el patrón de demanda descrito."},{"id":29,"domain":2,"task":"2.3","type":"match","stem":"Una empresa financiera evalúa servicios de AWS para su programa de IA generativa. Relaciona cada servicio con la función que le corresponde.","pairs":[["Amazon Bedrock","Acceder mediante una API administrada a modelos fundacionales de varios proveedores y personalizarlos con datos propios."],["Amazon SageMaker AI","Construir, entrenar y desplegar modelos propios con herramientas para todo el ciclo de vida."],["Kiro","Asistir el desarrollo de software a partir de especificaciones dentro de un entorno de desarrollo integrado."],["Strands Agents","Construir agentes de IA con un marco de trabajo de código abierto."],["Amazon Bedrock AgentCore","Ejecutar agentes en producción con componentes administrados de identidad, memoria y herramientas."]],"explain":"Cada servicio cubre una parte distinta del programa: Bedrock para consumir y personalizar modelos fundacionales, SageMaker AI para el ciclo de vida de modelos propios, Kiro para el desarrollo guiado por especificaciones, Strands Agents como marco para construir agentes y Bedrock AgentCore para operarlos en producción. Confundir Bedrock con SageMaker AI lleva a elegir la pieza equivocada cuando el requisito es entrenar modelos propios."},{"id":30,"domain":3,"task":"3.1","type":"mc","stem":"El área de marketing de un banco quiere generar cinco variantes creativas del mismo mensaje para una campaña y después elegir la mejor. ¿Qué ajuste de los parámetros de inferencia favorece respuestas más variadas?","options":["Aumentar la temperatura.","Reducir la temperatura a un valor cercano a cero.","Reducir la longitud máxima de la respuesta.","Aumentar la longitud del prompt del sistema."],"answers":[0],"explain":"Una temperatura más alta incrementa la diversidad de las salidas, lo que ayuda a explorar variantes creativas. Bajarla produce respuestas más repetitivas y predecibles, y ni la longitud de la respuesta ni el tamaño del prompt del sistema modifican la variabilidad creativa del modelo."},{"id":31,"domain":3,"task":"3.1","type":"mc","stem":"Un banco adjunta el mismo manual de políticas de 200 páginas en cada consulta que los analistas hacen al asistente. ¿Qué práctica ayuda a reducir el costo y la latencia de esas invocaciones?","options":["Usar el almacenamiento en caché de prompts (prompt caching) para reutilizar el contexto que se repite.","Elevar la temperatura en cada consulta para que el modelo responda más rápido.","Enviar el manual dos veces en cada consulta para reforzar el contexto.","Eliminar el prompt del sistema para liberar espacio en la ventana de contexto."],"answers":[0],"explain":"El almacenamiento en caché de prompts permite reutilizar el contenido que se repite entre invocaciones y así disminuir el tiempo y el costo del procesamiento. Elevar la temperatura no acelera la respuesta, duplicar el manual aumenta el consumo de tokens y eliminar el prompt del sistema degrada el comportamiento del asistente."},{"id":32,"domain":3,"task":"3.1","type":"mc","stem":"Un despacho legal quiere que su asistente cite la cláusula exacta de los expedientes vigentes al responder, sin volver a entrenar el modelo cada vez que se actualiza un documento. ¿Qué enfoque cumple mejor ese requisito?","options":["Generación aumentada por recuperación (RAG), que busca los fragmentos relevantes y los entrega al modelo como contexto para fundamentar la respuesta.","Ajuste fino (fine-tuning) del modelo con todos los expedientes cada semana.","Preentrenamiento del modelo con el archivo histórico completo de la firma.","Ampliar la ventana de contexto hasta incluir todos los expedientes en cada solicitud."],"answers":[0],"explain":"RAG fundamenta la respuesta en la evidencia recuperada del corpus actualizado, sin modificar los pesos del modelo ni reentrenar. El ajuste fino y el preentrenamiento sí modifican el modelo y resultan costosos para un contenido que cambia con frecuencia, y cargar todos los expedientes en cada solicitud no es viable ni económico."},{"id":33,"domain":3,"task":"3.1","type":"mc","stem":"Un banco almacena sus datos de clientes en una base de datos PostgreSQL administrada y quiere agregar búsqueda por similitud de incrustaciones (embeddings) sin migrar a otro motor. ¿Qué opción es la más adecuada?","options":["Usar Amazon RDS for PostgreSQL, que admite extensiones para almacenar y consultar vectores.","Migrar todos los datos a Amazon Neptune, que es un motor de grafos.","Guardar los vectores en Amazon ElastiCache, que es una caché en memoria.","Guardar los vectores en AWS Glue DataBrew junto con las tablas originales."],"answers":[0],"explain":"Amazon RDS for PostgreSQL admite extensiones de vectores, por lo que permite conservar el motor actual y añadir búsqueda por similitud. Neptune se orienta a datos altamente conectados, ElastiCache es una capa de caché y no un almacén persistente principal, y Glue DataBrew sirve para preparar y perfilar datos, no para almacenar vectores."},{"id":34,"domain":3,"task":"3.1","type":"mc","stem":"Un equipo de cumplimiento reúne 400 pares de entrada y salida que muestran el formato exacto del dictamen que exige la firma y quiere que el modelo lo reproduzca de manera consistente. ¿Qué enfoque es el más adecuado?","options":["Ajuste fino (fine-tuning) con esos ejemplos curados, para que el modelo aprenda el formato.","Preentrenamiento del modelo desde cero con los 400 ejemplos.","Aumentar la temperatura para que el modelo explore distintos formatos.","Eliminar los ejemplos del prompt y confiar en que el modelo los deduzca por sí solo."],"answers":[0],"explain":"El ajuste fino es adecuado para que el modelo adopte un estilo o formato específico a partir de ejemplos curados. El preentrenamiento desde cero exige corpus mucho mayores y no se justifica para 400 pares, la temperatura alta aumenta la variabilidad en lugar de fijar el formato y, sin ejemplos ni instrucciones, no hay garantía de que el formato se reproduzca."},{"id":35,"domain":3,"task":"3.1","type":"mc","stem":"El comité de arquitectura de un banco debe elegir entre varios modelos fundacionales disponibles en Amazon Bedrock para resumir expedientes confidenciales. ¿Qué conjunto de criterios es el más apropiado para tomar la decisión?","options":["La calidad medida con evaluaciones sobre casos propios, el costo por token, la latencia y las regiones donde el modelo está disponible.","El número de parámetros del modelo, porque a mayor tamaño siempre corresponde mejor calidad.","La antigüedad del proveedor, porque garantiza que el modelo no cambiará con el tiempo.","La longitud del prompt del sistema, porque un prompt más largo asegura mejores respuestas."],"answers":[0],"explain":"La selección debe combinar la calidad observada en el caso de uso con restricciones operativas como costo, latencia y disponibilidad regional. El tamaño del modelo, la antigüedad del proveedor o la longitud del prompt son indicios aislados que no garantizan un mejor resultado para el requisito planteado."},{"id":36,"domain":3,"task":"3.1","type":"mc","stem":"Una aseguradora quiere que sus
